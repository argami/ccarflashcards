<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F · Flashcards</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#7a7a7a; --line:#e4e4e4; --panel:#f7f7f8;
    --red:#c0392b; --red-bg:#fdf1ef; --green:#2e7d32; --green-bg:#eef7ee;
    --amber:#b8860b; --amber-bg:#fff8e6; --accent:#c8553d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151515; --fg:#ececec; --muted:#9a9a9a; --line:#2e2e2e; --panel:#1e1e1e;
      --red:#ff7b6b; --red-bg:#2a1a17; --green:#7bd88f; --green-bg:#16241a;
      --amber:#e5b454; --amber-bg:#272013; --accent:#e07a5f; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:780px;margin:0 auto;padding:22px 18px 90px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;font-weight:600}
  .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
    color:var(--fg);border-radius:6px;padding:7px 12px;font-size:13px;transition:.12s}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .meta{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .pill{border:1px solid var(--line);border-radius:99px;padding:2px 9px}
  .scenario{background:var(--panel);border-left:3px solid var(--accent);padding:13px 15px;
    border-radius:3px;margin-bottom:16px;font-size:15px}
  .question{font-weight:600;margin-bottom:14px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
    border:1px solid var(--line);background:transparent;border-radius:6px;padding:11px 13px;
    margin-bottom:9px;font-size:15px;line-height:1.45}
  .opt:hover:not(.locked){border-color:var(--accent);background:var(--panel)}
  .opt .key{font-weight:700;color:var(--accent);min-width:15px}
  .opt.locked{cursor:default}
  .opt.right{border-color:var(--green);background:var(--green-bg)}
  .opt.wrong{border-color:var(--red);background:var(--red-bg)}
  .opt.dim{opacity:.55}
  .verdict{margin:18px 0 10px;font-size:15px;font-weight:600}
  .verdict.ok{color:var(--green)} .verdict.ko{color:var(--red)}
  .box{border-left:3px solid var(--line);padding:11px 14px;border-radius:3px;margin-bottom:11px;
    font-size:14.5px;background:var(--panel)}
  .box.green{border-color:var(--green);background:var(--green-bg)}
  .box.red{border-color:var(--red);background:var(--red-bg)}
  .box.amber{border-color:var(--amber);background:var(--amber-bg)}
  .box b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:4px}
  .cite{font-size:12.5px;color:var(--muted);margin-bottom:8px}
  .cite a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent)}
  .quote{display:block;font-style:italic;margin-top:3px;color:var(--fg);opacity:.8}
  .grade{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .grade button{flex:1;min-width:110px;padding:11px 8px;font-size:13px}
  .grade button small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
  .grade button:hover{background:var(--accent);color:#fff}
  .grade button:hover small{color:rgba(255,255,255,.75)}
  .progress{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
  .progress b{color:var(--fg)}
  /* stats */
  .rows{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .row{display:grid;grid-template-columns:150px 1fr 86px;gap:10px;align-items:center;font-size:12.5px}
  .row>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row>span:last-child{white-space:nowrap;text-align:right}
  .track{height:9px;background:var(--panel);border-radius:4px;overflow:hidden}
  .fill{height:100%;background:var(--green)}
  .fill.mid{background:var(--amber)} .fill.low{background:var(--red)}
  .empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
  .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0}
  .stat{border:1px solid var(--line);border-radius:8px;padding:13px}
  .stat .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);padding:7px 18px;display:flex;justify-content:space-between}
  kbd{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:10.5px}
  .langtag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    margin:16px 0 6px;border-top:1px dashed var(--line);padding-top:10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:0;border-radius:0;padding:5px 9px;font-size:11.5px;background:transparent}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--accent);color:#fff}
</style>
</head>

<script>
const DATA = {"cards": [{"id": "D1-1.1-001", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "An online retailer's support agent answers 'where is my order' messages. About 4% of production conversations end after a single turn with a reply like \"I'll look up your order now\" and no lookup ever runs. The loop's exit test is `if response.content[0].type == \"text\": return response.content[0].text`, and the response in those cases contains a text block followed by a tool_use block.", "question": "Which change makes the loop actually execute the tools Claude asks for?", "options": {"A": "Keep the content-type test but scan every block and terminate as soon as any block has type \"text\", so a preamble placed later in the array cannot be missed.", "B": "Branch on response.stop_reason: on \"tool_use\" execute the requested tools and iterate, on \"end_turn\" return the answer to the caller.", "C": "Add a system-prompt rule forbidding Claude from writing explanatory text in the same turn as a tool call, so content[0] is always the tool_use block.", "D": "Inspect response.content[-1] instead of content[0], since Claude places its tool_use block after the narration that introduces it."}, "correct": "B", "why_correct_es": "stop_reason es el único campo que declara explícitamente si el turno terminó o si Claude pide herramientas; el tipo del contenido no dice nada sobre la finalización. Mientras sea \"tool_use\" hay que ejecutar y volver a iterar, y solo \"end_turn\" autoriza devolver la respuesta.", "why_correct_en": "`stop_reason` is the only field that explicitly declares whether the turn is finished or Claude is asking for tools; the content type says nothing about completion. While it is `\"tool_use\"` you must execute and iterate again, and only `\"end_turn\"` authorizes returning the answer.", "option_rationales_es": {"A": "Recorrer todos los bloques no arregla nada: sigue usando la presencia de texto como señal de fin, y Claude puede narrar y pedir una herramienta en el mismo turno.", "C": "Un prompt puede reducir la frecuencia del preámbulo, pero no es determinista ni sustituye al control de flujo; ante una respuesta con texto y tool_use el bucle seguiría terminando antes de tiempo.", "D": "El orden de los bloques no está garantizado ni significa finalización; cambiar el índice solo mueve el mismo error de señal, no lo corrige."}, "option_rationales_en": {"A": "Walking every block fixes nothing: it still uses the presence of text as the end signal, and Claude can narrate and request a tool in the same turn.", "C": "A prompt can reduce how often a preamble appears, but it is not deterministic and does not replace flow control; on a response with text and tool_use the loop would still end early.", "D": "Block order is not guaranteed and does not mean completion; changing the index only moves the same signalling error, it does not correct it."}, "trap": {"kind": "determinism_drift", "tip_es": "Si ves una condición de parada que mira `content[...]` o el texto en lugar de `stop_reason`, es el anti-patrón de terminación prematura. Cinco segundos: busca dónde se decide si se repite el bucle.", "tip_en": "If you see a stop condition looking at `content[...]` or at the text instead of `stop_reason`, that is the premature-termination anti-pattern. Five seconds: find where the decision to repeat the loop is made."}, "citations": [{"source_id": "lesson-1.1", "section": "The Three Anti-Patterns", "quote": "The code uses `response.content[0].type == \"text\"` to decide that the loop is finished. Claude can return text together with `tool_use` blocks."}, {"source_id": "lesson-1.1", "section": "Practical Example: The Premature Termination Bug", "quote": "The fix is to check `stop_reason` instead of the content type: continue on `\"tool_use\"` , terminate on `\"end_turn\"` . This check works whatever content types the response holds."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.1-002", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "A data-ops agent reconciles CSV exports. Its loop concatenates the text of each assistant message and exits when the string contains \"TASK COMPLETE\" or \"I have finished\". In production the run ended after Claude wrote \"I have finished the first export; now I'll reconcile the second file\", leaving half the work undone.", "question": "Which change removes this class of failure?", "options": {"A": "Require the phrase to appear at the very end of the message and match it case-sensitively, so incidental mentions mid-sentence no longer trigger the exit.", "B": "List the completion phrases in the system prompt and instruct Claude to use them only when the entire task is done, keeping the text scan as the exit test.", "C": "Require the phrase in two consecutive assistant messages before exiting, so a single ambiguous sentence cannot terminate the run.", "D": "Delete the phrase scan and end the loop only when stop_reason is \"end_turn\", executing the requested tools and iterating while it is \"tool_use\"."}, "correct": "D", "why_correct_es": "Parsear lenguaje natural para decidir la terminación es frágil por diseño: el modelo puede usar esas palabras sin querer cerrar el ciclo. La terminación debe venir de stop_reason, un campo estructurado que no depende de cómo redacte Claude.", "why_correct_en": "Parsing natural language to decide termination is fragile by design: Claude can use those words without meaning to close the cycle. Termination must come from `stop_reason`, a structured field that does not depend on how Claude words its reply.", "option_rationales_es": {"A": "Anclar la frase al final del mensaje reduce falsos positivos pero no los elimina: el modelo sigue siendo él quien decide, con texto libre, cuándo termina el programa.", "B": "Reforzar la instrucción en el prompt deja el control en manos del modelo; una respuesta legítima que mencione la frase sigue pudiendo cortar el bucle.", "C": "Pedir dos mensajes consecutivos solo hace el fallo menos frecuente y además puede impedir terminaciones legítimas; la señal sigue siendo texto interpretado por el código."}, "option_rationales_en": {"A": "Anchoring the phrase to the end of the message reduces false positives but does not remove them: Claude is still the one deciding, in free text, when the program ends.", "B": "Hardening the instruction in the prompt leaves control with Claude; a legitimate response that mentions the phrase can still cut the loop.", "C": "Requiring two consecutive messages only makes the failure rarer and can also block legitimate endings; the signal is still text interpreted by code."}, "trap": {"kind": "determinism_drift", "tip_es": "Cualquier `if \"frase\" in texto` o regex sobre la respuesta del modelo para decidir si continuar es el anti-patrón de parsing de lenguaje natural. La respuesta correcta siempre mueve la decisión a stop_reason.", "tip_en": "Any `if \"phrase\" in text` or regex over Claude's response to decide whether to continue is the natural language parsing anti-pattern. The correct answer always moves the decision to `stop_reason`."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Skills in)", "quote": "Avoiding anti-patterns such as parsing natural language signals to determine loop termination,\nsetting arbitrary iteration caps as the primary stopping mechanism, or checking for assistant text\ncontent as a completion indicator"}, {"source_id": "lesson-1.1", "section": "Practical Example: The Premature Termination Bug", "quote": "The fix is to check `stop_reason` instead of the content type: continue on `\"tool_use\"` , terminate on `\"end_turn\"` . This check works whatever content types the response holds."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.1-003", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "A research agent runs `for i in range(5)` around its request/tool cycle. Tasks that need six or seven tool calls return partial reports annotated \"reached step limit\". An engineer proposes changing 5 to 50 and keeping the counter as the loop's exit condition.", "question": "What is the correct role for the iteration bound?", "options": {"A": "Terminate on stop_reason \"end_turn\" and keep a generous iteration cap only as a safety net that logs a warning when it fires.", "B": "Keep the counter as the exit condition but raise it to 50, since a bound expressed in iterations is the most predictable way to end a loop.", "C": "Remove any bound so the loop runs until Claude stops asking for tools, because a cap can only truncate legitimate work.", "D": "Replace the iteration counter with a ten-minute wall-clock timeout, which bounds cost without cutting off a task that is still progressing."}, "correct": "A", "why_correct_es": "El bucle termina cuando Claude deja de pedir herramientas, es decir en \"end_turn\". Un tope de iteraciones solo es aceptable como red de seguridad que nunca debería activarse en operación normal y que avisa cuando lo hace.", "why_correct_en": "The loop ends when Claude stops asking for tools, that is on `\"end_turn\"`. An iteration cap is acceptable only as a safety net that should never fire in normal operation and that logs a warning when it does.", "option_rationales_es": {"B": "Subir el número no cambia el diseño: el tope sigue siendo el mecanismo principal de parada y cualquier tarea más larga volverá a truncarse.", "C": "Eliminar el tope quita la protección contra bucles patológicos; el examen acepta un cap de seguridad como fallback, lo que rechaza es usarlo como criterio primario.", "D": "Un timeout es otra forma de cortar por tiempo en vez de por estado del modelo; convierte un problema de terminación en un fallo intermitente según la latencia."}, "option_rationales_en": {"B": "Raising the number does not change the design: the cap is still the primary stop mechanism and any longer task will be truncated again.", "C": "Removing the cap drops the protection against pathological loops; the exam accepts a safety cap as a fallback, what it rejects is using it as the primary criterion.", "D": "A timeout is another way of cutting by time instead of by the model's own state; it turns a termination problem into an intermittent failure driven by latency."}, "trap": {"kind": "iteration_cap", "tip_es": "Si la opción correcta habla de \"safety cap que solo registra un warning\", es la buena; si el cap es la condición del while, es anti-patrón. El examen separa explícitamente fallback de mecanismo principal.", "tip_en": "If the correct option talks about a \"safety cap that only logs a warning\", it is the right one; if the cap is the `while` condition, it is an anti-pattern. The exam explicitly separates fallback from primary mechanism."}, "citations": [{"source_id": "lesson-1.1", "section": "Build a Multi-Tool Agent Loop", "quote": "Add a safety iteration cap of 20 as a maximum bound (not the primary stopping mechanism) and log a warning if it triggers"}, {"source_id": "lesson-1.1", "section": "Build a Multi-Tool Agent Loop", "quote": "The exam distinguishes safety caps (acceptable as a fallback) from using caps as the primary stopping mechanism (an anti-pattern)."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.1-004", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "After a get_order call, an engineer's loop appends `{\"role\": \"user\", \"content\": \"get_order returned: shipped, ETA Tuesday\"}` and re-sends the conversation. Claude replies by calling get_order again with the same order id, and does so on every subsequent turn.", "question": "What is wrong with how the tool output was added to the conversation?", "options": {"A": "The output should have been appended to the system prompt, so it stays visible on every later turn instead of arriving once as a user message.", "B": "The output should have been passed in the next request's metadata field, which is the channel Claude reads for out-of-band tool output.", "C": "The output must be a tool_result block whose tool_use_id matches the assistant's tool_use block, placed in the user message that follows it.", "D": "The output must be appended as an assistant message, because only assistant turns are treated as verified facts the model can rely on."}, "correct": "C", "why_correct_es": "El historial es el canal por el que el modelo razona sobre lo ya ocurrido: el resultado tiene que volver como bloque tool_result emparejado por tool_use_id con el tool_use que lo pidió. Sin ese emparejamiento Claude no ve que la llamada ya se resolvió y la repite.", "why_correct_en": "History is the conduit through which Claude reasons about what already happened: the result has to come back as a `tool_result` block matched by `tool_use_id` to the `tool_use` that requested it. Without that match Claude does not see that the call was already resolved and repeats it.", "option_rationales_es": {"A": "Meter el resultado en el system prompt lo saca del flujo de la conversación, se pierde al crecer el contexto y no responde al tool_use pendiente.", "B": "No existe un canal de metadatos que el modelo lea como resultado de herramienta; el resultado va en el historial de mensajes.", "D": "Fabricar un turno de assistant con datos de la herramienta falsifica el rol y deja el tool_use original sin responder, así que la API y el modelo quedan desalineados."}, "option_rationales_en": {"A": "Putting the result into the system prompt takes it out of the conversation flow, it is lost as context grows and it does not answer the pending tool_use.", "B": "There is no metadata field that Claude reads as a tool result; the output belongs in the message history.", "D": "Fabricating an assistant turn with tool data falsifies the role and leaves the original tool_use unanswered, so Claude and the API end up misaligned."}, "trap": {"kind": "context_inheritance", "tip_es": "Si la opción menciona tool_result emparejado por tool_use_id en el mensaje de user siguiente, es la correcta. Cualquier variante que meta el resultado en el prompt, en metadata o como texto suelto es distractor.", "tip_en": "If the option mentions a `tool_result` matched by `tool_use_id` in the following user message, it is the correct one. Any variant that puts the result into the prompt, into metadata or as loose text is a distractor."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Knowledge of)", "quote": "How tool results are appended to conversation history so the model can reason about the next\naction"}, {"source_id": "lesson-1.1", "section": "What You Need to Know", "quote": "Until Claude has finished, your code sends a request, runs any tools that Claude requests, and sends the results to Claude."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.1-005", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "An agent worked in local testing because the team's SDK wrapper kept a server-side thread. In production the team calls the Messages API directly and each iteration sends only `[system, {\"role\": \"user\", \"content\": [tool_result...]}]`. From the third tool call on, the agent re-requests data it already retrieved and repeats its first search.", "question": "What is the root cause?", "options": {"A": "The tool_result blocks need a cache_control breakpoint on every iteration so the earlier turns are restored from the prompt cache.", "B": "The Messages API is stateless: every request must resend the full accumulated message list, including the assistant tool_use turns and their tool_result turns.", "C": "The loop should pass the previous response id in a conversation field so the API can attach the new turn to the earlier exchange.", "D": "The system prompt must restate the results of every completed tool call, because tool_result blocks are not visible to later requests."}, "correct": "B", "why_correct_es": "Cada llamada a la API es independiente: el estado del agente es el array de mensajes que tú reenvías. Si solo mandas el último tool_result, el modelo pierde el plan y los resultados previos y vuelve a empezar.", "why_correct_en": "Every API call is independent: the agent state is the message array you resend. If you only send the last `tool_result`, Claude loses the plan and the earlier results and starts over.", "option_rationales_es": {"A": "El prompt caching abarata reenviar el historial, no lo sustituye; sin los mensajes anteriores no hay nada que cachear ni que razonar.", "C": "No hay un identificador de conversación que haga persistente el hilo en la Messages API; la continuidad la construye tu código reenviando el historial.", "D": "Reescribir resultados en el system prompt duplica información, crece sin control y sigue sin emparejar los tool_use pendientes."}, "option_rationales_en": {"A": "Prompt caching makes resending the history cheaper, it does not replace it; without the earlier messages there is nothing to cache and nothing to reason over.", "C": "There is no conversation identifier that makes the thread persistent in the Messages API; continuity is built by your code resending the history.", "D": "Rewriting results into the system prompt duplicates information, grows without bound and still leaves the pending tool_use blocks unmatched."}, "trap": {"kind": "context_inheritance", "tip_es": "Ante \"funcionaba en local y en prod el agente olvida\" sospecha siempre de estado implícito: el bucle debe reenviar todo el historial en cada request. La opción que menciona API stateless es la respuesta.", "tip_en": "When you see \"it worked locally and in prod the agent forgets\", always suspect implicit state: the loop must resend the full history on every request. The option that mentions the stateless API is the answer."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Knowledge of)", "quote": "How tool results are appended to conversation history so the model can reason about the next\naction"}, {"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Skills in)", "quote": "Adding tool results to conversation context between iterations so the model can incorporate new\ninformation into its reasoning"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.1-006", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "A finance-ops agent was built as a fixed pipeline: `if step == 1: search_invoices() elif step == 2: fetch_pdf() elif step == 3: summarize()`. A new request needs a second search after reading a PDF, which the tree cannot express, so engineers keep appending branches for every combination they observe.", "question": "Which design change addresses the root cause rather than the symptom?", "options": {"A": "Add branch conditions for each observed order of tool calls, so the tree covers the sequences that real requests actually produce.", "B": "Insert a classifier call before each step that chooses the next step from the fixed enum of existing pipeline steps.", "C": "Move the step list into the system prompt as a numbered procedure and let Claude follow it while the code keeps advancing the step index.", "D": "Expose the tools and let Claude choose the next call from the conversation, with the code executing requested tools and looping while stop_reason is \"tool_use\"."}, "correct": "D", "why_correct_es": "El bucle agéntico es control de flujo determinista en el código, pero la decisión de qué herramienta usar es del modelo y se basa en el contexto acumulado. Un árbol fijo no puede anticipar combinaciones nuevas; el modelo sí, porque decide en cada turno.", "why_correct_en": "The agentic loop is deterministic flow control in code, but the decision of which tool to use belongs to the model, and it is based on the accumulated context. A fixed tree cannot anticipate new combinations; Claude can, because it decides on every turn.", "option_rationales_es": {"A": "Añadir ramas persigue casos observados y nunca alcanza al siguiente; el árbol crece y sigue sin cubrir el espacio de decisiones.", "B": "Un clasificador sobre un enum cerrado reproduce la limitación del árbol: solo puede elegir entre los pasos ya previstos.", "C": "Describir la secuencia en el prompt no cambia quién controla la iteración; el índice del código seguiría imponiendo el orden y las repeticiones necesarias seguirían sin caber."}, "option_rationales_en": {"A": "Adding branches chases observed cases and never catches up with the next one; the tree grows and still does not cover the decision space.", "B": "A classifier over a closed enum reproduces the tree's limitation: it can only choose among steps that were already foreseen.", "C": "Describing the sequence in the prompt does not change who controls the iteration; the code index would still impose the order and the necessary repeats would still not fit."}, "trap": {"kind": "prompt_over_program", "tip_es": "Si la opción describe una secuencia o árbol preconfigurado (incluido \"ponlo en el prompt\"), es distractor. La correcta devuelve la elección de herramienta al modelo y deja al código solo ejecutar y comprobar stop_reason.", "tip_en": "If the option describes a preconfigured sequence or tree (including \"put it in the prompt\"), it is a distractor. The correct one hands tool choice back to Claude and leaves the code doing only execution and the `stop_reason` check."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Knowledge of)", "quote": "The distinction between model-driven decision-making (Claude reasons about which tool to call\nnext based on context) and pre-conﬁgured decision trees or tool sequences"}, {"source_id": "lesson-1.1", "section": "What You Need to Know", "quote": "That code is the **agentic loop** : the core execution cycle of every Claude-based agent. It is deterministic control flow, defined in code."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.1-007", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "One assistant response from a pricing agent contains three tool_use blocks: two catalog lookups and one calculation. The loop executes `response.content[0]` only and appends a single tool_result. The next request fails with HTTP 400: \"tool_use ids were found without tool_result blocks immediately after\".", "question": "What must the loop do with a response that requests several tools?", "options": {"A": "Execute every tool_use block in the response and return one tool_result per tool_use_id, all inside the single user message that follows.", "B": "Return one tool_result for the first block and re-send the request with the remaining tool_use ids listed as a hint for the next turn.", "C": "Disable parallel tool use on the request so that a response can contain at most one tool_use block per turn and the mismatch cannot occur.", "D": "Merge the three outputs into one tool_result that carries the first tool_use_id and lists the other results inside its content."}, "correct": "A", "why_correct_es": "El contrato exige un tool_result por cada tool_use del turno anterior, todos en el mensaje de user inmediatamente siguiente. Si el modelo pidió tres herramientas en paralelo, hay que ejecutar las tres y devolver las tres, no una.", "why_correct_en": "The contract requires one `tool_result` per `tool_use` from the previous turn, all in the immediately following user message. If Claude asked for three tools in parallel, you must run all three and return all three, not one.", "option_rationales_es": {"B": "Dejar ids sin responder rompe el emparejamiento y la API rechaza la petición; el \"hint\" no sustituye al tool_result que falta.", "C": "Desactivar el paralelismo evita el caso pero degrada el agente y no arregla un bucle que sigue asumiendo un solo bloque por turno.", "D": "Un único tool_result solo puede responder a un tool_use; fusionar salidas bajo un id deja los otros dos sin resultado y vuelve a fallar la validación."}, "option_rationales_en": {"B": "Leaving ids unanswered breaks the matching and the API rejects the request; the \"hint\" does not replace the missing tool_result.", "C": "Disabling parallelism avoids the case but degrades the agent and does not fix a loop that still assumes one block per turn.", "D": "A single tool_result can only answer one tool_use; merging outputs under one id leaves the other two without a result and validation fails again."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "Cuando el error menciona tool_use ids sin tool_result, cuenta bloques: N tool_use exigen N tool_result en el mensaje siguiente. Cualquier opción que reduzca el número de resultados o desactive el paralelismo es distractor.", "tip_en": "When the error mentions tool_use ids without tool_result, count blocks: N tool_use require N tool_result in the next message. Any option that reduces the number of results or disables parallelism is a distractor."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Knowledge of)", "quote": "The agentic loop lifecycle: sending requests to Claude, inspecting stop_reason (\"tool_use\" vs\n\"end_turn\"), executing requested tools, and returning results for the next iteration"}, {"source_id": "lesson-1.1", "section": "What You Need to Know", "quote": "Until Claude has finished, your code sends a request, runs any tools that Claude requests, and sends the results to Claude."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.1-008", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "An internal endpoint takes a user question, sends one request to Claude, executes the single requested tool, and returns the tool's raw JSON to the caller as the \"agent answer\". Users get payloads like `{\"status\":\"shipped\"}` instead of an answer, and any question needing two lookups fails entirely.", "question": "What is missing from this implementation?", "options": {"A": "A higher max_tokens value, so the first response has room to contain both the tool call and the final natural-language answer.", "B": "A system-prompt instruction telling Claude to answer in the same turn in which it requests the tool, instead of waiting for the result.", "C": "The loop itself: each tool_result must be fed back to Claude and the cycle repeated until stop_reason is \"end_turn\", whose text is the answer.", "D": "A follow-up request that sends the tool output without the original user message, so Claude answers from the tool data alone."}, "correct": "C", "why_correct_es": "Una sola petición y una sola ejecución no son un bucle agéntico: el resultado tiene que volver al modelo para que razone y decida el siguiente paso, y solo cuando stop_reason es \"end_turn\" existe una respuesta final que devolver.", "why_correct_en": "One request and one execution are not an agentic loop: the result has to go back to Claude so it can reason and decide the next step, and only when `stop_reason` is `\"end_turn\"` is there a final answer to return.", "option_rationales_es": {"A": "El problema no es el espacio de la respuesta sino que nunca se devuelve el resultado a Claude; subir max_tokens no crea la segunda iteración.", "B": "El modelo no puede responder antes de conocer el resultado de la herramienta; pedírselo solo produciría una respuesta inventada.", "D": "Quitar el mensaje original rompe el contexto de la tarea y tampoco cierra el ciclo, que debe continuar hasta end_turn."}, "option_rationales_en": {"A": "The problem is not answer space but that the result is never returned to Claude; raising max_tokens does not create the second iteration.", "B": "Claude cannot answer before it knows the tool result; asking it to do so would only produce an invented answer.", "D": "Dropping the original message breaks the task context and does not close the cycle either, which must continue until `end_turn`."}, "trap": {"kind": "determinism_drift", "tip_es": "Si el escenario devuelve JSON de herramienta al usuario, falta el ciclo: tool_result al modelo, repetir, y devolver el texto final. La opción que describe el bucle hasta end_turn es la correcta.", "tip_en": "If the scenario returns the tool's JSON to the user, the cycle is missing: tool_result back to Claude, repeat, and return the final text. The option that describes the loop until `end_turn` is the correct one."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Knowledge of)", "quote": "The agentic loop lifecycle: sending requests to Claude, inspecting stop_reason (\"tool_use\" vs\n\"end_turn\"), executing requested tools, and returning results for the next iteration"}, {"source_id": "lesson-1.1", "section": "What You Need to Know", "quote": "Until Claude has finished, your code sends a request, runs any tools that Claude requests, and sends the results to Claude."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.1-009", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "A planning agent issues three to four parallel tool calls per turn. Its loop increments MAX_ITERATIONS once per tool_use block, so with MAX_ITERATIONS=20 it aborts after roughly six productive turns, mid-task and with a partial answer.", "question": "What is wrong with the loop's iteration accounting?", "options": {"A": "The counter should be reset whenever a turn issues parallel calls, so a multi-tool turn does not consume the shared budget.", "B": "One iteration is one request/response cycle: count turns, not the tool_use blocks inside a response, and keep the cap as a safety net rather than the exit condition.", "C": "The limit should be expressed in total tokens consumed rather than in counted units, since token spend is the resource the bound is meant to protect.", "D": "The counter should be compared with `>` instead of `>=`, giving every turn one extra round of tool calls before the loop stops."}, "correct": "B", "why_correct_es": "Una iteración del bucle es una vuelta completa: enviar la petición, ejecutar lo que Claude pidió, devolver los resultados. Contar bloques tool_use confunde llamadas con iteraciones y agota el presupuesto en tareas perfectamente sanas; además el cap nunca debe ser el mecanismo de parada.", "why_correct_en": "One loop iteration is one full cycle: send the request, run what Claude asked for, return the results. Counting tool_use blocks confuses calls with iterations and exhausts the budget on perfectly healthy tasks; on top of that the cap must never be the stop mechanism.", "option_rationales_es": {"A": "Reiniciar el contador según el paralelismo hace el límite impredecible y sigue midiendo la unidad equivocada, así que el agente puede correr sin control real.", "C": "Los tokens miden coste, no progreso del bucle; un tope por tokens es otro corte arbitrario que no sabe si la tarea terminó.", "D": "Un off-by-one solo regala una vuelta y mantiene el error de fondo: se sigue contando por bloque y se sigue parando por el cap."}, "option_rationales_en": {"A": "Resetting the counter based on parallelism makes the limit unpredictable and still measures the wrong unit, so the agent can run with no real control.", "C": "Tokens measure cost, not loop progress; a token cap is another arbitrary cut that does not know whether the task finished.", "D": "An off-by-one only gifts one extra round and keeps the underlying error: counting is still per block and stopping is still by the cap."}, "trap": {"kind": "iteration_cap", "tip_es": "Fíjate en la unidad del contador: si cuenta tool_use en vez de turnos, el tope se agota antes de tiempo. La respuesta correcta redefine la iteración y devuelve el cap a su papel de red de seguridad.", "tip_en": "Look at the counter's unit: if it counts tool_use instead of turns, the cap runs out early. The correct answer redefines the iteration and returns the cap to its role as a safety net."}, "citations": [{"source_id": "lesson-1.1", "section": "Build a Multi-Tool Agent Loop", "quote": "A MAX_ITERATIONS constant, a counter that increments each loop, and a warning log if the cap is hit."}, {"source_id": "lesson-1.1", "section": "Build a Multi-Tool Agent Loop", "quote": "The exam distinguishes safety caps (acceptable as a fallback) from using caps as the primary stopping mechanism (an anti-pattern)."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.1-010", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "An engineer stores history by appending `{\"role\": \"assistant\", \"content\": [{\"type\": \"text\", \"text\": response_text}]}` — only the narration — and then appending the tool_result. It worked while responses had no tool calls; now the API rejects requests with \"unexpected tool_use_id found in tool_result blocks\".", "question": "What is the correct fix to the history construction?", "options": {"A": "Strip the tool_use_id from the tool_result block so it no longer references a block that is absent from the history.", "B": "Convert the tool_result into a plain text block holding the tool output, so the history needs no id reference at all.", "C": "Append the tool_result before the assistant message, so the referenced block exists by the time the result is read.", "D": "Append the assistant turn verbatim, tool_use blocks and their ids included, then a user turn whose tool_result blocks match those ids."}, "correct": "D", "why_correct_es": "El historial debe reflejar exactamente lo que devolvió la API: si reconstruyes el turno del assistant solo con el texto, borras los tool_use y los tool_result quedan huérfanos. Se añade la respuesta tal cual y después el turno de user con los resultados emparejados.", "why_correct_en": "The history must reflect exactly what the API returned: if you rebuild the assistant turn from the text alone, you erase the tool_use blocks and the tool_result blocks are left orphaned. You append the response as-is and then the user turn with the matched results.", "option_rationales_es": {"A": "Quitar el id deja el resultado sin referencia y el modelo no puede saber a qué llamada corresponde; la API tampoco lo acepta como tool_result válido.", "B": "Convertirlo en texto elimina la estructura que el modelo usa para cerrar el ciclo y vuelve a provocar llamadas repetidas.", "C": "Invertir el orden rompe la secuencia exigida: el tool_result debe seguir al turno que contiene el tool_use, no precederlo."}, "option_rationales_en": {"A": "Removing the id leaves the result without a reference and Claude cannot tell which call it belongs to; the API does not accept it as a valid tool_result either.", "B": "Turning it into text removes the structure Claude uses to close the cycle and brings back repeated calls.", "C": "Reversing the order breaks the required sequence: the tool_result must follow the turn that contains the tool_use, not precede it."}, "trap": {"kind": "context_inheritance", "tip_es": "Si el código \"reconstruye\" el turno del assistant en lugar de reenviarlo tal cual, los tool_use desaparecen y aparecen errores de ids. La respuesta correcta siempre dice: historial verbatim, resultados emparejados.", "tip_en": "If the code \"rebuilds\" the assistant turn instead of resending it as-is, the tool_use blocks disappear and id errors show up. The correct answer always says: verbatim history, matched results."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Knowledge of)", "quote": "How tool results are appended to conversation history so the model can reason about the next\naction"}, {"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Skills in)", "quote": "Adding tool results to conversation context between iterations so the model can incorporate new\ninformation into its reasoning"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.1-011", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "A payments agent wraps its whole cycle in try/except. On an overloaded error (HTTP 529) it restarts the loop from the original user message, re-running create_refund, which had already succeeded on the previous attempt. Production shows duplicate refunds.", "question": "What is the correct retry behaviour for this loop?", "options": {"A": "Retry only the failed request with the existing message history, so tool calls that already completed are never executed again.", "B": "Retry from the original user message but attach a request_id, so each tool can detect the duplicate call on the second pass.", "C": "Terminate the agent on any 529 and ask the user to resubmit, since the loop state cannot be trusted after a transport error.", "D": "Restart the loop and lower MAX_ITERATIONS on each retry, so a persistent overload cannot produce repeated side effects."}, "correct": "A", "why_correct_es": "El estado del agente es el historial de mensajes: los tool_result ya obtenidos viven ahí. Reintentar la petición fallida con ese historial continúa donde se quedó, mientras que reiniciar desde el prompt original reejecuta efectos ya consumados.", "why_correct_en": "The agent state is the message history: the tool_result blocks already obtained live there. Retrying the failed request with that history continues where it left off, while restarting from the original prompt re-runs effects that already happened.", "option_rationales_es": {"B": "Depender de que cada herramienta detecte duplicados traslada al servidor de herramientas una responsabilidad del bucle y no evita el segundo efecto antes de detectarlo.", "C": "Abortar por un error transitorio convierte un reintento trivial en un fallo de usuario y descarta trabajo ya pagado.", "D": "Bajar el cap no impide la reejecución: el problema es el punto de reanudación, no cuántas vueltas quedan."}, "option_rationales_en": {"B": "Depending on every tool detecting duplicates shifts a loop responsibility onto the tool server and does not prevent the second effect before it is detected.", "C": "Aborting on a transient error turns a trivial retry into a user-facing failure and throws away work already paid for.", "D": "Lowering the cap does not prevent re-execution: the problem is the resume point, not how many rounds are left."}, "trap": {"kind": "determinism_drift", "tip_es": "Si el reintento vuelve al mensaje inicial, volverá a ejecutar herramientas con efectos. La respuesta correcta reanuda desde el historial; cualquier opción que reinicie el ciclo completo es distractor.", "tip_en": "If the retry goes back to the first message, it will run effectful tools again. The correct answer resumes from the history; any option that restarts the whole cycle is a distractor."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Domain 1 — Task Statement 1.1 (Skills in)", "quote": "Adding tool results to conversation context between iterations so the model can incorporate new\ninformation into its reasoning"}, {"source_id": "lesson-1.1", "section": "What You Need to Know", "quote": "Until Claude has finished, your code sends a request, runs any tools that Claude requests, and sends the results to Claude."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.1-012", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "An agent's loop now terminates correctly on \"end_turn\", but the endpoint returns `response.content[0].text` as the answer. Users sometimes see only a lead-in like \"Here's the summary:\", and other times the handler raises because content[0] is not a text block.", "question": "How should the final answer be extracted from the last response?", "options": {"A": "Return content[-1].text, since the substantive answer is always the last block Claude emits in the closing turn.", "B": "Return the text of every block, serializing tool_use blocks as JSON so nothing from the closing turn is lost.", "C": "Concatenate the text of all blocks whose type is \"text\" in the final response, ignoring non-text blocks.", "D": "Read content[0].text and fall back to the previous turn's text whenever the first block is not of type text."}, "correct": "C", "why_correct_es": "La respuesta final puede repartirse en varios bloques y no hay garantía de que el primero sea texto. Se recolectan todos los bloques de tipo \"text\" del turno final y se concatenan; los bloques que no son texto no forman parte de la respuesta al usuario.", "why_correct_en": "The final answer can be spread across several blocks and there is no guarantee that the first one is text. You collect every block whose type is `\"text\"` from the closing turn and concatenate them; blocks that are not text are not part of the answer to the user.", "option_rationales_es": {"A": "Suponer que el último bloque es la respuesta repite el mismo error de indexación: el orden y el número de bloques varían entre respuestas.", "B": "Serializar tool_use en la respuesta al usuario filtra estructura interna y ensucia la salida; el turno final puede además no contener herramientas.", "D": "El fallback al turno anterior devuelve texto obsoleto y oculta el fallo en lugar de extraer correctamente los bloques del turno actual."}, "option_rationales_en": {"A": "Assuming the last block is the answer repeats the same indexing error: block order and block count vary between responses.", "B": "Serializing tool_use into the user-facing answer leaks internal structure and dirties the output; the closing turn may also contain no tools at all.", "D": "The fallback to the previous turn returns stale text and hides the failure instead of extracting the current turn's blocks correctly."}, "trap": {"kind": "determinism_drift", "tip_es": "Cualquier `content[0]` o `content[-1]` es sospechoso: los bloques son una lista heterogénea. La respuesta correcta filtra por type == \"text\" y concatena.", "tip_en": "Any `content[0]` or `content[-1]` is suspect: the blocks are a heterogeneous list. The correct answer filters on `type == \"text\"` and concatenates."}, "citations": [{"source_id": "lesson-1.1", "section": "Practical Example: The Premature Termination Bug", "quote": "The fix is to check `stop_reason` instead of the content type: continue on `\"tool_use\"` , terminate on `\"end_turn\"` . This check works whatever content types the response holds."}, {"source_id": "lesson-1.1", "section": "The Three Anti-Patterns", "quote": "The code uses `response.content[0].type == \"text\"` to decide that the loop is finished. Claude can return text together with `tool_use` blocks."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.1-E10", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "A platform team is building a shared agentic-loop library for several internal agents. One engineer proposes checking response.stop_reason in (\"tool_use\", \"end_turn\") and treating both values as \"continue the loop.\"", "question": "What is wrong with treating \"end_turn\" as a continue condition in this shared loop?", "options": {"A": "\"end_turn\" is returned when Claude issues several tool calls in parallel, so continuing on it makes the loop run the same tool calls a second time", "B": "\"end_turn\" is returned when a response is cut off at the token limit, so continuing on it resends a truncated reply and the loop never reaches a final answer", "C": "\"end_turn\" is returned when Claude finishes its answer without requesting a tool, so continuing on it sends another request after the work is complete", "D": "\"end_turn\" is returned when a custom stop sequence is matched, so continuing on it restarts generation that the application deliberately halted"}, "correct": "C", "why_correct_es": "end_turn significa que Claude terminó su respuesta sin pedir ninguna herramienta: el trabajo está hecho. Tratarlo como 'continuar' envía una petición más después de la respuesta final, con coste y latencia extra y riesgo de respuestas redundantes. Solo tool_use obliga a otra iteración.", "why_correct_en": "end_turn means Claude finished its answer without requesting any tool: the work is done. Treating it as 'continue' sends one more request after the final answer, adding cost and latency and risking redundant responses. Only tool_use forces another iteration.", "option_rationales_es": {"A": "Varias tool calls en paralelo llegan dentro de un mismo mensaje con stop_reason \"tool_use\"; no producen \"end_turn\", así que la duplicación de llamadas no es el fallo que introduce este valor.", "B": "La truncación por límite de tokens se reporta con otro stop_reason (max_tokens), no con \"end_turn\"; confundirlos hace que el loop no detecte el corte real.", "D": "Una stop_sequence personalizada devuelve \"stop_sequence\", un valor distinto. \"end_turn\" no tiene relación con paradas deliberadas de la aplicación."}, "option_rationales_en": {"A": "Several parallel tool calls arrive inside a single message with stop_reason \"tool_use\"; they do not produce \"end_turn\", so duplicate calls are not the failure mode this value introduces.", "B": "Token-limit truncation is reported with a different stop_reason (max_tokens), not \"end_turn\"; confusing the two makes the loop miss the real cutoff.", "D": "A custom stop_sequence returns \"stop_sequence\", a different value. \"end_turn\" has nothing to do with deliberate application-side halts."}, "trap": {"kind": "iteration_cap", "tip_es": "Memoriza el binomio: tool_use = hay que ejecutar herramientas y volver; end_turn = ya está, se devuelve la respuesta. Cualquier opción que describa otro significado de end_turn (límite de tokens, paralelismo, stop_sequence) es falsa.", "tip_en": "Memorise the pair: tool_use = you must run tools and come back; end_turn = done, return the answer. Any option that describes another meaning for end_turn (token limit, parallelism, stop_sequence) is false."}, "citations": [{"source_id": "lesson-1.1", "section": "Practical Example: The Premature Termination Bug", "quote": "The fix is to check `stop_reason` instead of the content type: continue on `\"tool_use\"` , terminate on `\"end_turn\"` . This check works whatever content types the response holds."}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.1", "quote": "The agentic loop lifecycle: sending requests to Claude, inspecting stop_reason (\"tool_use\" vs\n\"end_turn\"), executing requested tools, and returning results for the next iteration"}], "difficulty": "core", "origin": "enriched_existing"}, {"id": "D1-1.1-E14", "domain": 1, "subdomain": "1.1", "task_statement": "1.1 — Design and implement agentic loops for autonomous task execution", "type": "scenario_mcq", "scenario": "A build-automation loop's exception handler catches a tool execution failure, appends a tool_result block with \"is_error\": true describing the failure, and sends the updated conversation back to Claude. A reviewer argues the loop should terminate immediately on any tool failure instead.", "question": "Why is appending the error and continuing generally the better design here?", "options": {"A": "Claude reads the failure details on its next turn, which lets it retry with adjusted arguments or choose a different tool for the same step", "B": "The Messages API re-runs the failed call itself when is_error is set, which gives the same tool a fresh attempt on the next request", "C": "The is_error field acts as the loop's exit condition, which makes a separate stop_reason check unnecessary for the later turns of the conversation", "D": "The is_error flag marks the tool as unavailable, which makes Claude drop it and answer from its training knowledge for the rest of the conversation"}, "correct": "A", "why_correct_es": "El error pasa a formar parte del historial: al añadirlo como tool_result con is_error, Claude lo lee en el siguiente turno y decide —reintentar con argumentos corregidos, cambiar de herramienta o escalar—. Es el bucle dirigido por el modelo, no un pipeline que aborta al primer fallo.", "why_correct_en": "The error becomes part of the history: by appending it as a tool_result with is_error, Claude reads it on the next turn and decides - retry with corrected arguments, switch tools, or escalate. That is the model-driven loop, not a pipeline that aborts on the first failure.", "option_rationales_es": {"B": "La Messages API no reejecuta nada por su cuenta: solo devuelve lo que el modelo pide. El reintento existe porque el modelo lo decide al ver el error en el turno siguiente.", "C": "is_error describe el resultado de la herramienta, no es una condición de parada: el loop sigue gobernándose por stop_reason en cada respuesta.", "D": "is_error no marca la herramienta como no disponible: sigue en la lista de tools del modelo y puede volver a llamarla cuando le convenga."}, "option_rationales_en": {"B": "The Messages API re-runs nothing on its own: it only returns what the model asks for. The retry happens because the model chooses it after seeing the error on the next turn.", "C": "is_error describes the tool's result, it is not a stop condition: the loop is still governed by stop_reason on every response.", "D": "is_error does not mark the tool as unavailable: it stays in the model's tool list and the model can call it again when that suits it."}, "trap": {"kind": "iteration_cap", "tip_es": "Ante un fallo de herramienta pregúntate quién decide el siguiente paso. Si la opción correcta devuelve el control al modelo con información (el error en el historial), las que abortan el bucle o atribuyen poderes mágicos a la API son falsas.", "tip_en": "On a tool failure, ask who decides the next step. If the correct option hands control back to the model with information (the error in the history), then options that abort the loop or grant magic powers to the API are false."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.1", "quote": "Adding tool results to conversation context between iterations so the model can incorporate new\ninformation into its reasoning"}, {"source_id": "lesson-1.1", "section": "What You Need to Know", "quote": "Until Claude has finished, your code sends a request, runs any tools that Claude requests, and sends the results to Claude."}], "difficulty": "core", "origin": "enriched_existing"}, {"id": "D1-1.2-001", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "In a bank's churn-research system, an analysis subagent needs to know which claims the web-search subagent already verified before it can assess them. To save one hop, an engineer proposes letting the analysis subagent call the search subagent directly through the Task tool, returning results peer-to-peer.", "question": "What is the strongest architectural objection to that proposal?", "options": {"A": "None worth blocking: skipping the extra hop lowers latency, and both subagents already run on the same model and tool set.", "B": "It is acceptable provided the two subagents append their exchange to a shared log file that the coordinator can replay later.", "C": "It bypasses the hub: routing through the coordinator is what keeps one auditable path and one place for error handling and information flow control.", "D": "It is worse than simply granting the analysis subagent its own web-search tool so no inter-agent call is needed at all."}, "correct": "C", "why_correct_es": "En hub-and-spoke toda comunicación entre subagentes pasa por el coordinador: así hay un único punto de observabilidad, de manejo de errores y de control del flujo de información. Que los subagentes se llamen entre sí convierte el grafo en malla y el coordinador deja de poder explicar ni reparar lo que ocurrió.", "why_correct_en": "In hub-and-spoke, all communication between subagents goes through the coordinator: that gives you a single point for observability, error handling and information-flow control. Having subagents call each other turns the graph into a mesh, and the coordinator can no longer explain or repair what happened.", "option_rationales_es": {"A": "Ahorrar un salto no compensa perder el punto único de trazabilidad: el coste real no es la latencia, sino que nadie puede reconstruir qué se pasó entre agentes ni aplicar una política de errores coherente.", "B": "Un log compartido documenta el intercambio pero no lo controla: el error se propaga sin que el coordinador pueda decidir reintentar, sustituir la fuente o degradar la cobertura, y la política de errores queda repartida.", "D": "Dar herramientas de búsqueda al subagente de análisis elimina la especialización y crea una segunda ruta hacia las mismas fuentes, con lo que se duplica el trabajo y se pierde el control central del alcance."}, "option_rationales_en": {"A": "Saving one hop does not offset losing the single point of traceability: the real cost is not latency, but that nobody can reconstruct what was passed between agents or apply a consistent error policy.", "B": "A shared log documents the exchange but does not control it: the error propagates without the coordinator being able to decide to retry, substitute the source or degrade coverage, and the error policy ends up scattered.", "D": "Giving search tools to the analysis subagent eliminates specialisation and creates a second route to the same sources, which duplicates the work and loses central control of scope."}, "trap": {"kind": "hub_and_spoke_bypass", "tip_es": "Si una opción hace que dos subagentes hablen entre sí o que uno haga el trabajo del otro 'para ahorrar un salto', es una fuga del hub. En el examen, la respuesta correcta casi siempre reencamina la petición por el coordinador.", "tip_en": "If an option makes two subagents talk to each other, or makes one do the other's job 'to save a hop', it is a leak out of the hub. On the exam, the correct answer almost always routes the request back through the coordinator."}, "citations": [{"source_id": "lesson-1.2", "section": "Key Concept", "quote": "The basic architectural constraint of hub-and-spoke orchestration is this: all communication between subagents routes through the coordinator."}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Skills in", "quote": "Routing all subagent communication through the coordinator for observability, consistent error\nhandling, and controlled information"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.2-002", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "A coordinator finishes web search and document analysis, then invokes the synthesis subagent with the prompt: 'Use all the findings gathered so far to write the report.' The synthesis agent returns a competent but generic essay with no figures, no sources and no reference to the documents the team actually collected.", "question": "What explains the generic output and what should the coordinator do differently?", "options": {"A": "The synthesis subagent starts with an isolated context, so the coordinator must place the complete findings — claims, source names and supporting excerpts — directly in its prompt.", "B": "The synthesis subagent should have been told where the findings live so it can read whatever it needs from the shared workspace during its run.", "C": "The coordinator should persist its own conversation transcript to a file and point the synthesis prompt at that file path.", "D": "The synthesis subagent should be given the Task tool so it can query the search subagent for the details it is missing."}, "correct": "A", "why_correct_es": "Los subagentes no heredan el historial del coordinador: arrancan con contexto aislado y solo saben lo que va escrito en su prompt. Por eso el coordinador debe incluir los hallazgos completos y estructurados, no una referencia a ellos.", "why_correct_en": "Subagents do not inherit the coordinator's history: they start with an isolated context and know only what is written in their prompt. That is why the coordinator must include the complete, structured findings, not a reference to them.", "option_rationales_es": {"B": "Un subagente no 'va a buscar' lo que necesita: sin el contenido en el prompt no sabe qué existe ni dónde, y una instrucción de leer del workspace solo funciona si además le pasas rutas y formato concretos.", "C": "Apuntar a un fichero de transcripción traslada el problema: el subagente no hereda el historial y no puede destilar de una transcripción larga lo que el coordinador ya sabe que es relevante.", "D": "Delegar la recuperación otra vez añade saltos y latencia, y el subagente de búsqueda tampoco conserva memoria de invocaciones anteriores, así que repetiría trabajo en lugar de recibir los hallazgos ya filtrados."}, "option_rationales_en": {"B": "A subagent does not 'go and fetch' what it needs: without the content in the prompt it does not know what exists or where, and an instruction to read from the workspace only works if you also pass concrete paths and formats.", "C": "Pointing at a transcript file moves the problem elsewhere: the subagent does not inherit the history and cannot distil from a long transcript what the coordinator already knows is relevant.", "D": "Delegating retrieval again adds hops and latency, and the search subagent also keeps no memory of previous invocations, so it would repeat work instead of receiving the already-filtered findings."}, "trap": {"kind": "context_inheritance", "tip_es": "Sospecha de cualquier opción que asuma herencia de contexto ('ya tiene acceso a', 'recuerda lo anterior', 'lee el workspace'). Entre agentes, contexto = lo que se copia explícitamente en el prompt.", "tip_en": "Be suspicious of any option that assumes context inheritance ('it already has access to', 'it remembers the above', 'it reads the workspace'). Between agents, context equals exactly what is explicitly copied into the prompt."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.3 — Knowledge of", "quote": "subagent context must be explicitly provided in the prompt—subagents do not automatically\ninherit parent context or share memory between invocations"}, {"source_id": "lesson-1.2", "section": "Hub-and-Spoke Architecture", "quote": "The coordinator receives the initial task and decomposes it. It decides which subagents to invoke and passes context to them."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.2-003", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "Regression tests for a research coordinator are flaky: the same question sometimes triggers search plus analysis plus synthesis, sometimes only search, so recorded outputs never match. An engineer proposes that the coordinator always invoke all four subagents in a fixed order, which would make every run structurally identical.", "question": "Which change best addresses the flakiness without damaging the architecture?", "options": {"A": "Adopt the fixed four-stage pipeline and accept the extra cost as the price of reproducible regression runs.", "B": "Set the coordinator's temperature to 0 so that identical inputs always produce an identical subagent selection.", "C": "Record the first run's plan per question and replay that same plan whenever the question reappears in tests.", "D": "Keep dynamic selection and log the chosen subagents plus the coordinator's reason for each, then assert in tests that the plan satisfies the question's coverage requirements."}, "correct": "D", "why_correct_es": "La selección dinámica es una responsabilidad del coordinador, no un defecto: un pipeline fijo derrocha tiempo y recursos en consultas simples. Para poder testear sin congelar la arquitectura se registra la decisión (qué subagentes y por qué) y se valida contra criterios de cobertura, no contra una secuencia exacta.", "why_correct_en": "Dynamic selection is a coordinator responsibility, not a defect: a fixed pipeline wastes time and resources on simple queries. To test without freezing the architecture you log the decision (which subagents and why) and assert against coverage criteria, not against an exact sequence.", "option_rationales_es": {"A": "Un pipeline fijo hace deterministas los tests a costa de eliminar la selección dinámica: cada consulta trivial paga los cuatro subagentes, justo el desperdicio que el patrón pretende evitar.", "B": "Temperature 0 reduce la varianza pero no garantiza una selección idéntica de herramientas entre ejecuciones, y no dice nada sobre si el conjunto elegido era el adecuado.", "C": "Grabar y reproducir el plan de la primera ejecución fosiliza una decisión puntual: si cambia la pregunta o el corpus, los tests siguen pasando con un plan que ya no cubre el caso."}, "option_rationales_en": {"A": "A fixed pipeline makes the tests deterministic at the cost of removing dynamic selection: every trivial query pays for all four subagents, exactly the waste the pattern is meant to avoid.", "B": "Temperature 0 reduces variance but does not guarantee an identical tool selection across runs, and it says nothing about whether the chosen set was adequate.", "C": "Recording and replaying the first run's plan fossilises a one-off decision: if the question or the corpus changes, the tests keep passing with a plan that no longer covers the case."}, "trap": {"kind": "determinism_drift", "tip_es": "Cuando el enunciado pide 'resultados reproducibles', la trampa es fijar la arquitectura. La solución correcta suele ser observar/registrar la decisión del modelo, no sustituirla por una secuencia hardcodeada.", "tip_en": "When the prompt asks for 'reproducible results', the trap is freezing the architecture. The correct solution is usually to observe and log the model's decision, not replace it with a hardcoded sequence."}, "citations": [{"source_id": "lesson-1.2", "section": "Coordinator Responsibilities", "quote": "A coordinator that routes every query through every subagent wastes time and resources. If an analyst asks only for the central bank's current interest rate, the coordinator invokes the web search subagent alone."}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Skills in", "quote": "Designing coordinator agents that analyze query requirements and dynamically select which\nsubagents to invoke rather than always routing through the full pipeline"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.2-004", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "Asked why customers are closing accounts, a coordinator decomposed the topic into fee increases, mobile-app crashes, competitor pricing and call-centre wait times. All four subagents returned confirming evidence, the synthesis was coherent, yet the board immediately named a factor the report never mentions: a regulatory change that made account switching painless.", "question": "What is the root cause of the incomplete report?", "options": {"A": "The coordinator's system prompt was too weak; telling it to be thorough and to consider every angle would have surfaced the regulatory factor.", "B": "The decomposition mirrored the coordinator's initial hypothesis, so scope was never partitioned to cover competing explanations or checked for coverage before synthesis.", "C": "The synthesis subagent should have listed the report's limitations; adding a mandatory limitations section would have caught the missing factor.", "D": "The pipeline lacked a final review subagent, so a fifth agent verifying the report would have detected the gap before delivery."}, "correct": "B", "why_correct_es": "El riesgo documentado es la descomposición demasiado estrecha: si el coordinador parte de una hipótesis y reparte solo sus ramas, ningún subagente tiene mandato para explorar explicaciones alternativas y la cobertura es incompleta aunque cada pieza sea correcta. Se corrige en el reparto de alcance y en la comprobación de cobertura, no en la redacción.", "why_correct_en": "The documented risk is decomposition that is too narrow: if the coordinator starts from one hypothesis and hands out only its branches, no subagent has a mandate to explore alternative explanations, and coverage is incomplete even though every piece is correct. The fix is in scope partitioning and coverage checking, not in the writing.", "option_rationales_es": {"A": "Pedir 'ser exhaustivo' no cambia la estructura del reparto: sin subtemas o fuentes asignadas que cubran hipótesis alternativas, el coordinador sigue generando las mismas cuatro ramas.", "C": "Una sección de limitaciones describe lo que ya se sabe que falta; no descubre un factor que nunca estuvo en el alcance de ningún subagente.", "D": "Un revisor final solo ve lo que produjo el pipeline: sin acceso a un alcance más amplio, valida la coherencia interna y no la cobertura frente a la pregunta original."}, "option_rationales_en": {"A": "Asking it to 'be thorough' does not change the structure of the partition: without subtopics or assigned sources that cover alternative hypotheses, the coordinator keeps generating the same four branches.", "C": "A limitations section describes what is already known to be missing; it does not discover a factor that never fell inside any subagent's scope.", "D": "A final reviewer sees only what the pipeline produced: with no access to a wider scope it validates internal coherence, not coverage against the original question."}, "trap": {"kind": "prompt_over_program", "tip_es": "'Sé más exhaustivo' o 'revisa al final' son parches de prompt. Si el fallo es que faltan perspectivas, la corrección estructural es particionar el alcance y evaluar cobertura.", "tip_en": "'Be more thorough' or 'review at the end' are prompt patches. If the failure is missing perspectives, the structural correction is to partition the scope and assess coverage, not to add more instruction."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Knowledge of", "quote": "Risks of overly narrow task decomposition by the coordinator, leading to incomplete coverage of\nbroad research topics"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.2-005", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "After the first synthesis pass on a due-diligence report, the coordinator can see that two of the six questions in the brief are still unanswered, and that one section rests on a single blog post. The run is already expensive and the client wants the draft today.", "question": "What should the coordinator do next?", "options": {"A": "Deliver the draft with a limitations note listing the two unanswered questions so the client can request a second pass.", "B": "Restart the whole pipeline in a fresh coordinator session so that the second attempt is not anchored on the first one.", "C": "Send the gap list to the search and analysis subagents as targeted queries, then re-invoke synthesis with the new findings, repeating until the brief's coverage criteria are met.", "D": "Ask the synthesis subagent to fill the gaps from its own knowledge so that no additional round trip is needed."}, "correct": "C", "why_correct_es": "El bucle de refinamiento iterativo es explícito: el coordinador evalúa la síntesis, detecta huecos, re-delega consultas dirigidas a búsqueda y análisis, y vuelve a invocar la síntesis hasta que la cobertura sea suficiente. Es más barato que reiniciar y más honesto que entregar con huecos.", "why_correct_en": "The iterative refinement loop is explicit: the coordinator evaluates the synthesis, detects gaps, re-delegates targeted queries to search and analysis, and re-invokes synthesis until coverage is sufficient. It is cheaper than restarting and more honest than shipping with gaps.", "option_rationales_es": {"A": "Documentar el hueco no es cubrirlo: el entregable se juzga por respondir al brief, y una nota de limitaciones traslada al cliente un trabajo que el coordinador aún puede completar.", "B": "Reiniciar desde cero tira los hallazgos válidos y vuelve a pagar búsquedas ya hechas; el problema es acotado (dos preguntas y una fuente débil), no sistémico.", "D": "Pedir a la síntesis que rellene con conocimiento propio produce afirmaciones sin fuente en un informe que exige citas verificables: convierte un hueco visible en un riesgo invisible."}, "option_rationales_en": {"A": "Documenting the gap is not closing it: the deliverable is judged on answering the brief, and a limitations note hands the client work the coordinator can still complete.", "B": "Restarting from scratch throws away valid findings and pays again for searches already done; the problem is bounded (two questions and one weak source), not systemic.", "D": "Asking synthesis to fill the gaps from its own knowledge produces unsourced claims in a report that requires verifiable citations: it turns a visible gap into an invisible risk."}, "trap": {"kind": "iteration_cap", "tip_es": "Si el escenario muestra huecos concretos y alguien propone 'entregar con nota' o 'reiniciar todo', la respuesta suele ser la tercera vía: re-delegación dirigida y re-síntesis.", "tip_en": "If the scenario shows concrete gaps and someone proposes 'deliver with a note' or 'restart everything', the answer is usually the third way: targeted re-delegation and re-synthesis."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Skills in", "quote": "Implementing iterative reﬁnement loops where the coordinator evaluates synthesis output for gaps,\nre-delegates to search and analysis subagents with targeted queries, and re-invokes synthesis until\ncoverage is sufﬁcient"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.2-006", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "Two search subagents are launched in parallel, each with the instruction 'research the account-churn problem on the web'. Post-hoc analysis shows 70% of their retrieved documents are identical, while regulator filings and app-store reviews — both relevant — were never touched.", "question": "What change most directly fixes both the duplication and the gap?", "options": {"A": "Assign each search subagent a distinct slice of the scope — different subtopics or different source types — and state that boundary in its prompt.", "B": "Keep both on the full topic but add an instruction to each prompt telling it not to duplicate the other agent's work.", "C": "Merge the two agents into a single search agent allowed to run more iterations over the same query.", "D": "Keep the identical assignments and deduplicate the merged results by URL hash before synthesis."}, "correct": "A", "why_correct_es": "Particionar el alcance entre subagentes es la técnica prevista para minimizar duplicación: cada agente recibe subtemas o tipos de fuente distintos, de modo que el conjunto cubra más terreno. Además la instrucción debe estar en el prompt de cada agente, porque ninguno ve el encargo del otro.", "why_correct_en": "Partitioning scope across subagents is the intended approach for minimising duplication: each agent receives different subtopics or source types, so the set as a whole covers more ground. The instruction also has to be in each agent's prompt, the reason being that neither one sees the other's assignment.", "option_rationales_es": {"B": "Un subagente no sabe qué está haciendo su compañero: no comparte contexto ni memoria, así que la instrucción 'no dupliques' no tiene información sobre la que operar y ambos siguen buscando lo mismo.", "C": "Un solo agente con más iteraciones sobre la misma consulta recupera más de lo mismo: la duplicación desaparece como síntoma, pero la falta de fuentes regulatorias y de reviews se mantiene.", "D": "Deduplicar después reduce el ruido del informe pero no el trabajo gastado ni el hueco de cobertura: ambas búsquedas siguieron apuntando al mismo segmento de la web."}, "option_rationales_en": {"B": "A subagent does not know what its peer is doing: it shares no context and no memory, so the instruction 'do not duplicate' has no information to operate on and both keep searching for the same thing.", "C": "A single agent with more iterations over the same query retrieves more of the same: duplication disappears as a symptom, but the missing regulator filings and app-store reviews stay missing.",
