— Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "A refund cap of 500 EUR is written in three places: the system prompt, the process_refund tool description, and a constant in the PreToolUse hook. When compliance lowered the cap to 250 EUR, an engineer updated the prompt and the tool description and shipped. Six weeks later an audit found 37 refunds between 250 and 500 EUR that the agent had auto-approved.", "question": "What is the root cause and the correct fix?", "options": {"A": "The model ignored the updated prose; the new figure must also be added to the few-shot examples so both the prompt and the demonstrations carry the current threshold.", "B": "The threshold was duplicated and only the prose copies were updated, so the hook kept applying 500; the policy must live in one source that the gate reads, with prompt and description derived from it.", "C": "The hook compared against the amount the model passed instead of the amount returned by lookup_order, so a stale argument let larger refunds through under the old limit.", "D": "The constant should be replaced by a policy_version argument that the model supplies on each call, so the policy can change without redeploying the service."}, "correct": "B", "why_correct_es": "El umbral estaba triplicado y solo se actualizaron las copias en prosa, así que el gate siguió aplicando 500. La política debe vivir en una única fuente que lea el código, y los textos del prompt y de la herramienta generarse desde ella para que no puedan divergir.", "why_correct_en": "The threshold was triplicated and only the prose copies were updated, so the gate kept applying 500. The policy must live in a single source that the code reads, and the prompt and tool text generated from it so they cannot drift apart.", "option_rationales_es": {"A": "Añadir la cifra nueva a los ejemplos no ataca la causa: siguen existiendo varias copias del umbral y volverán a desincronizarse en el próximo cambio.", "C": "Usar el importe de lookup_order mejora la procedencia, pero no explica ni corrige que el umbral esté duplicado en tres sitios.", "D": "Dejar que el modelo envíe policy_version le entrega al componente probabilístico la decisión de qué política aplicar."}, "option_rationales_en": {"A": "Adding the new figure to the examples does not attack the cause: several copies of the threshold still exist and will fall out of sync again on the next change.", "C": "Using the amount from lookup_order improves provenance, but it neither explains nor fixes the threshold being duplicated in three places.", "D": "Letting the assistant send policy_version hands the probabilistic component the decision of which policy to apply."}, "trap": {"kind": "determinism_drift", "tip_es": "Si el mismo número aparece en prompt, descripción y hook, pregúntate cuál es la fuente única. Las copias en prosa siempre se quedan atrás en el siguiente cambio de política.", "tip_en": "If the same number appears in the prompt, the description and the hook, ask which one is the single source. The prose copies always lag behind on the next policy change."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.4: Knowledge of", "quote": "When deterministic compliance is required (e.g., identity veriﬁcation before ﬁnancial operations),\nprompt instructions alone have a non-zero failure rate"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.4-008", "domain": 1, "subdomain": "1.4", "task_statement": "1.4 — Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "A gate blocks process_refund until a verified customer ID exists. Support agents complained about stuck cases — gift recipients, shared accounts — so an engineer added a rule: after three blocked attempts on the same order, allow the refund and tag the case 'verification waived'. Waivers reached 6% of refunds, and two of them were later confirmed as fraud.", "question": "What is wrong, and what should happen after repeated blocks?", "options": {"A": "The waiver is fine in principle but needs justification: require the model to state a reason for waiving, and log that reason for QA review while the refund proceeds.", "B": "The attempt counter should be scoped to the session rather than the order, so a customer who reopens the conversation is not penalised for earlier blocked attempts.", "C": "A gate must never turn repeated attempts into permission; after N blocks it should keep holding the refund and emit a structured handoff for human approval instead of allowing it.", "D": "The waiver should depend on amount rather than attempt count: small refunds can be auto-waived, while refunds above the approval threshold stay blocked."}, "correct": "C", "why_correct_es": "Un contador de intentos no es una verificación: el gate debe seguir bloqueando y, cuando el caso no se puede resolver, emitir un handoff estructurado para aprobación humana. Convertir N bloqueos en permiso es un fail-open sobre una operación irreversible.", "why_correct_en": "An attempt counter is not a verification: the gate must keep blocking and, when the case cannot be resolved, emit a structured handoff for human approval. Turning N blocks into permission is a fail-open on an irreversible operation.", "option_rationales_es": {"A": "Pedir una razón y registrarla añade trazabilidad a un reembolso no verificado; el dinero sale igual y la revisión llega después del daño.", "B": "Reiniciar el contador por sesión hace el waiver aún más fácil de alcanzar: basta con abrir una conversación nueva.", "D": "Umbralar el waiver por importe convierte los reembolsos pequeños en fraude gratis; el requisito de identidad no depende del importe."}, "option_rationales_en": {"A": "Asking for a reason and logging it adds traceability to an unverified refund; the money leaves anyway and the review arrives after the damage.", "B": "Resetting the counter per session makes the waiver even easier to reach: opening a new conversation is enough.", "D": "Thresholding the waiver by amount turns small refunds into free fraud; the identity requirement does not depend on the amount."}, "trap": {"kind": "iteration_cap", "tip_es": "Cualquier diseño que tras X intentos 'deje pasar' es fail-open. La salida correcta de un bloqueo repetido es retener y escalar, nunca permitir.", "tip_en": "Any design that 'lets it through' after X attempts is fail-open. The correct exit from a repeated block is to hold and escalate, never to allow."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.4: Skills", "quote": "Implementing programmatic prerequisites that block downstream tool calls until prerequisite steps\nhave completed (e.g., blocking process_refund until get_customer has returned a veriﬁed customer\nID)"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.4-009", "domain": 1, "subdomain": "1.4", "task_statement": "1.4 — Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "A workflow escalated a 1,240 EUR refund to a human reviewer, who replied in the shared chat: 'Checked with the customer, approved — go ahead.' The workflow resumed and the gate blocked the refund because the workflow state contained no approval record. An engineer proposes that the agent set approved=true once it reads that message, so manually approved cases can proceed.", "question": "What is the correct design for the approval path?", "options": {"A": "The human's decision should be written into workflow state as a structured approval record — approver, order, amount — that the gate reads; the chat message alone must not authorise the tool call.", "B": "The gate should allow the call whenever the most recent message in the conversation contains an approval phrase such as 'approved' or 'go ahead'.", "C": "The agent should set approved=true after confirming with the human in conversation, since it is the only component that reads the chat and knows an approval happened.", "D": "The workflow should restart from the identity-verification step after approval, so the gate sees a fresh verification and then permits the refund."}, "correct": "A", "why_correct_es": "La aprobación tiene que ser un artefacto que el código pueda leer: quién aprobó, qué pedido y qué importe. Si solo existe como mensaje de chat, el gate no puede distinguir una autorización real de una frase cualquiera, y el registro estructurado además deja rastro auditable.", "why_correct_en": "The approval has to be an artifact the code can read: who approved, which order and which amount. If it exists only as a chat message, the gate cannot tell a real authorisation from any stray sentence, and the structured record also leaves an auditable trail.", "option_rationales_es": {"B": "Buscar una palabra de aprobación en el último mensaje permite que cualquier texto, incluso uno escrito por el cliente, autorice el pago.", "C": "Que el modelo ponga approved=true tras hablar con el humano vuelve a delegar la autorización en el componente probabilístico, que es lo que el gate existía para evitar.", "D": "Reiniciar la verificación no aporta la aprobación: el gate sigue sin un registro de quién autorizó el importe y el caso puede quedar en bucle."}, "option_rationales_en": {"B": "Searching for an approval word in the last message lets any text, even one written by the customer, authorise the payment.", "C": "Having the assistant set approved=true after talking to the human delegates authorisation back to the probabilistic component, which is exactly what the gate existed to prevent.", "D": "Restarting verification does not supply the approval: the gate still has no record of who authorised the amount and the case can end up in a loop."}, "trap": {"kind": "context_inheritance", "tip_es": "Una aprobación humana que solo vive en el chat no es estado. Si el gate no puede leerla, no autoriza: exige que la decisión se escriba como registro estructurado.", "tip_en": "A human approval that lives only in the chat is not state. If the gate cannot read it, it does not authorise: require the decision to be written as a structured record."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.4: Knowledge of", "quote": "Structured handoff protocols for mid-process escalation that include customer details, root cause\nanalysis, and recommended actions"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.4-E23", "domain": 1, "subdomain": "1.4", "task_statement": "1.4 — Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "An architect wants a compliance rule enforced so reliably that it must hold even if the model's system prompt is later edited by another team member who is unaware of the refund policy.", "question": "Which design property makes a PreToolUse hook the right mechanism for this, compared to keeping the rule only in the system prompt?", "options": {"A": "The hook output is treated by the model as a higher-priority instruction than the system prompt, so the refund rule takes precedence in the model's reasoning when the prompt text has been edited.", "B": "The hook re-injects the refund policy text into the model's context when each session starts, so the instruction is restored in the conversation even after the prompt text has been edited.", "C": "The hook is defined in the same configuration file as the system prompt, so the refund logic is saved and versioned together with the prompt text and follows it through each revision of that file.", "D": "The hook is registered in application code outside the prompt file, so the refund check runs on each matching tool call whatever the prompt text says, and a prompt edit cannot switch that check off."}, "correct": "D", "why_correct_es": "El hook vive en código de aplicación, fuera del fichero del prompt: se ejecuta en cada llamada que casa con el matcher, con independencia de lo que diga el system prompt. Editar el prompt puede cambiar el comportamiento del modelo, pero no puede desactivar una comprobación que corre antes de la ejecución.", "why_correct_en": "The hook lives in application code, outside the prompt file: it runs on every call that matches the matcher, regardless of what the system prompt says. Editing the prompt can change the model's behaviour, but it cannot switch off a check that runs before execution.", "option_rationales_es": {"A": "Los hooks no inyectan instrucciones con prioridad superior en el razonamiento del modelo: no compiten en la jerarquía del prompt, simplemente actúan sobre la llamada antes de que se ejecute.", "B": "Reinyectar la política al inicio de sesión es otra forma de guía por prompt: si el texto se edita o se omite, el resultado vuelve a depender del modelo.", "C": "Compartir fichero con el prompt es lo contrario de lo que se busca: acopla la regla al artefacto que se edita, así que un cambio de prompt puede arrastrar o romper la lógica."}, "option_rationales_en": {"A": "Hooks do not inject higher-priority instructions into the model's reasoning: they do not compete in the prompt hierarchy, they simply act on the call before it executes.", "B": "Re-injecting the policy at session start is just another form of prompt guidance: if the text is edited or omitted, the result depends on the model again.", "C": "Sharing a file with the prompt is the opposite of what you want: it couples the rule to the artefact being edited, so a prompt change can drag the logic along or break it."}, "trap": {"kind": "prompt_over_program", "tip_es": "La palabra 'garantía' o 'incluso si el prompt cambia' apunta siempre a código fuera del prompt. Si la opción describe el hook como si influyera en el razonamiento del modelo (mayor prioridad, reinyección, mismo fichero), está mal planteada.", "tip_en": "The word 'guarantee', or 'even if the prompt changes', always points to code outside the prompt. If the option describes the hook as if it influenced the model's reasoning (higher priority, re-injection, same file), it is framed wrong."}, "citations": [{"source_id": "lesson-1.4", "section": "Prompt Guidance Versus Programmatic Enforcement", "quote": "A prompt instruction works most of the time, perhaps in 90-95% of cases. It still has a non-zero failure rate, because the model is probabilistic."}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5", "quote": "The distinction between using hooks for deterministic guarantees versus relying on prompt\ninstructions for probabilistic compliance"}], "difficulty": "hard", "origin": "enriched_existing"}, {"id": "D1-1.5-001", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "A logistics support agent calls three MCP tools. track_delivery returns an ETA as a Unix epoch integer, get_order returns an ISO 8601 string with an offset, and check_warehouse returns a numeric status code (1 = packed, 2 = in transit, 3 = delivered). The agent keeps comparing values across the three tools and telling customers the wrong delivery day.", "question": "Where should the format conversion be implemented so the agent reasons over one consistent representation on every call?", "options": {"A": "In the system prompt: enumerate the three formats and the status-code meanings, and instruct the model to convert every value to UTC before it compares them.", "B": "In a PreToolUse hook on all three tools that rewrites the outgoing arguments so each server is asked to answer in one shared format.", "C": "In a PostToolUse hook that converts each tool result to ISO 8601 UTC timestamps and text status labels before the model processes it.", "D": "In the report step, where a formatting function converts the collected values before the answer is shown to the customer."}, "correct": "C", "why_correct_es": "PostToolUse recibe el resultado de la herramienta y lo transforma antes de que el modelo lo procese, así que la normalización ocurre en cada llamada y el modelo nunca compara representaciones distintas. Al vivir en código, no depende de que el modelo recuerde convertir nada.", "option_rationales_es": {"A": "Una instrucción de prompt es probabilística y además llega tarde: el modelo ya recibió los valores crudos, y si se salta una conversión no hay nada que lo detecte.", "B": "PreToolUse actúa sobre la petición saliente, no sobre la respuesta; no puede imponer el formato de salida de un servidor que no controlas.", "D": "Convertir al final deja al agente razonando sobre valores crudos durante toda la conversación y solo arregla la presentación."}, "trap": {"kind": "prompt_over_program", "tip_es": "Si la opción correcta 'explica los formatos en el prompt' o 'lo arregla al final del flujo', sospecha: la normalización pertenece al punto donde el resultado entra al modelo.", "tip_en": "If the correct option 'explains the formats in the prompt' or 'fixes it at the end of the flow', be suspicious: normalization belongs at the point where the result enters the model."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Skills in", "quote": "Implementing PostToolUse hooks to normalize heterogeneous data formats (Unix timestamps, ISO\n8601, numeric status codes) from different MCP tools before the agent processes them"}, {"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "A hook is deterministic: it applies the same rule every time, inside an otherwise probabilistic system. Hooks run between the model and the tools it calls."}], "difficulty": "core", "origin": "generated", "why_correct_en": "PostToolUse receives the tool result and transforms it before the model processes it, so normalization runs on every call and the model never compares two different representations. Because it lives in code, it does not depend on the model remembering to convert anything.", "option_rationales_en": {"A": "A prompt instruction is probabilistic and also arrives too late: the model has already received the raw values, and if it skips a conversion nothing detects that.", "B": "PreToolUse acts on the outgoing request, not on the response; it cannot impose the output format of a server you do not control.", "D": "Converting at the end leaves the agent reasoning over raw values for the whole conversation and only fixes the presentation."}}, {"id": "D1-1.5-002", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "A payments agent issues refunds through issue_refund. To enforce a $500 ceiling the team registers a PostToolUse hook on that tool which logs a violation and rewrites the result text to 'refund rejected'. In staging, $900 refunds still move money; only the confirmation the model reads says the refund was rejected.", "question": "Why does the guard fail to prevent the transfer?", "options": {"A": "PostToolUse runs on the tool result, after the refund has already executed; only a PreToolUse hook can stop the call before it runs.", "B": "The callback returns a rewritten result instead of raising an exception, and only exceptions abort an in-flight tool execution.", "C": "The hook is registered without a matcher, so it also fires on read-only tools whose output overwrites the rewritten result.", "D": "The $500 threshold must be expressed in the hook's matcher pattern rather than evaluated inside the callback body."}, "correct": "A", "why_correct_es": "La fase es el problema: PostToolUse observa y transforma el resultado cuando el efecto ya se produjo, así que reescribir el texto no revierte el cargo. La interceptación que bloquea es la de la llamada saliente, en PreToolUse.", "option_rationales_es": {"B": "Inventa un mecanismo que no existe: el problema no es el tipo de retorno, y una excepción lanzada en PostToolUse tampoco deshace el pago ya ejecutado.", "C": "El matcher no cambia el momento de ejecución; con o sin matcher, el resultado reescrito llega después del cargo.", "D": "El matcher solo filtra por nombre de herramienta; no evalúa importes ni argumentos, por eso la comprobación va dentro del callback."}, "trap": {"kind": "determinism_drift", "tip_es": "Bloquear exige ejecutarse ANTES del efecto: si la opción habla de PostToolUse, de reescribir el resultado o de registrar la violación, no está impidiendo nada.", "tip_en": "Blocking requires running BEFORE the effect: if the option talks about PostToolUse, about rewriting the result, or about logging the violation, it is not preventing anything."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Skills in", "quote": "Implementing tool call interception hooks that block policy-violating actions (e.g., refunds exceeding\n$500) and redirect to alternative workﬂows (e.g., human escalation)"}, {"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "A hook is deterministic: it applies the same rule every time, inside an otherwise probabilistic system. Hooks run between the model and the tools it calls."}], "difficulty": "core", "origin": "generated", "why_correct_en": "The phase is the problem: PostToolUse observes and transforms the result once the effect has already happened, so rewriting the text does not reverse the charge. The interception that blocks is the one on the outgoing call, in PreToolUse.", "option_rationales_en": {"B": "It invents a mechanism that does not exist: the root cause is not the return type, and an exception raised in PostToolUse does not undo the payment that already executed either.", "C": "The matcher does not change the moment of execution; with or without a matcher, the rewritten result arrives after the charge.", "D": "The matcher only filters by tool name; it does not evaluate amounts or arguments, which is why the check belongs inside the callback."}}, {"id": "D1-1.5-003", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "Compliance requires every refund above $200 to carry a written business justification that is checked before money moves. A PreToolUse hook on issue_refund receives the tool name and the call's input. The architect still needs the model's justification available to that check.", "question": "How should the justification reach the hook?", "options": {"A": "Read it from the model's stated rationale, which the SDK passes to the hook alongside the tool call, and match it against policy keywords.", "B": "Log the justification with a PostToolUse hook on issue_refund and have a nightly job reverse refunds whose justification failed the keyword match.", "C": "State the justification requirement in the system prompt and let the model decide per call whether a justification is warranted.", "D": "Add a required justification field to issue_refund's input schema so the model must supply it in the call, then validate that field in the hook."}, "correct": "D", "why_correct_es": "El hook ve el nombre de la herramienta y el input de la llamada, no la cadena de razonamiento del modelo. Si el dato debe existir de forma determinista, tiene que formar parte del esquema de entrada de la herramienta, y el hook lo valida leyéndolo del input.", "option_rationales_es": {"A": "El hook no recibe el razonamiento interno del modelo: solo la llamada, así que no hay texto que leer.", "B": "PostToolUse llega después del pago y un proceso nocturno no bloquea nada; la comprobación dejaría de ser previa.", "C": "El prompt no garantiza que el campo exista en la llamada, de modo que el hook no tendría qué validar y la regla volvería a ser probabilística."}, "trap": {"kind": "context_inheritance", "tip_es": "Un hook no hereda la conversación ni el razonamiento: si la decisión necesita un dato, ese dato debe viajar en el input de la herramienta.", "tip_en": "A hook does not inherit the conversation or the reasoning: if the decision needs a datum, that datum must travel inside the tool input."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Knowledge of", "quote": "Hook patterns that intercept outgoing tool calls to enforce compliance rules (e.g., blocking refunds\nabove a threshold)"}, {"source_id": "lesson-1.5", "section": "Build Exercise", "quote": "Two callbacks: a PreToolUse hook on transfer_funds that denies until session state records a passing AML check, and a PostToolUse hook on aml_check that sets that state."}], "difficulty": "hard", "origin": "generated", "why_correct_en": "The hook sees the tool name and the input of the call, not the model's reasoning chain. If the datum must exist deterministically, it has to be part of the tool's input schema, and the hook validates it by reading it from the input.", "option_rationales_en": {"A": "The hook does not receive the model's internal reasoning, only the call, so there is no text to read.", "B": "PostToolUse arrives after the payment and a nightly job blocks nothing; the check would stop being prior.", "C": "The prompt does not guarantee that the field exists in the call, so the hook would have nothing to validate and the rule would become probabilistic again."}}, {"id": "D1-1.5-004", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "While reviewing a PreToolUse hook that denies transfers without a passing AML check, a product owner asks what the customer will experience. They fear that a denied call raises an exception that kills the session, or that the SDK retries the identical call until the hook relents.", "question": "What actually happens when the hook blocks a call?", "options": {"A": "The SDK raises an unhandled tool error that terminates the session, so the application must restart the agent from the last checkpoint.", "B": "The tool never executes; the denial is returned to the model as the tool result and the loop continues, so the model can choose another action.", "C": "The tool executes and its side effect is rolled back, after which the model is told that the call was rejected.", "D": "The SDK re-sends the identical call until the hook stops denying it, so the denial only delays the operation."}, "correct": "B", "why_correct_es": "El hook se ejecuta entre el modelo y la herramienta: si deniega, la llamada no llega a ejecutarse y esa negativa vuelve al modelo como resultado, de modo que el bucle sigue y el modelo puede replantear o escalar.", "option_rationales_es": {"A": "No hay excepción fatal: negar es una decisión normal del hook, no un fallo del runtime, y la sesión continúa.", "C": "No existe rollback en este punto: si la comprobación no bloqueó antes, el efecto ya es real.", "D": "No hay reintento automático de la misma llamada; el modelo recibe la negativa y decide qué hacer."}, "trap": {"kind": "iteration_cap", "tip_es": "Bloquear no es fallar: distingue 'la llamada no se ejecuta y el modelo recibe el motivo' de las opciones que imaginan excepciones, rollback o reintentos automáticos.", "tip_en": "Blocking is not failing: distinguish 'the call does not execute and the model receives the reason' from the options that imagine exceptions, rollback or automatic retries."}, "citations": [{"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "A hook is deterministic: it applies the same rule every time, inside an otherwise probabilistic system. Hooks run between the model and the tools it calls."}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Knowledge of", "quote": "Hook patterns (e.g., PostToolUse) that intercept tool results for transformation before the model\nprocesses them"}], "difficulty": "core", "origin": "generated", "why_correct_en": "The hook runs between the model and the tool: if it denies, the call never executes and that denial comes back to the model as the result, so the loop continues and the model can re-plan or escalate.", "option_rationales_en": {"A": "There is no fatal exception: denying is a normal hook decision, not a runtime failure, and the session continues.", "C": "There is no rollback at this point: if the check did not block beforehand, the effect is already real.", "D": "There is no automatic retry of the same call; the model receives the denial and decides what to do next."}}, {"id": "D1-1.5-005", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "Blocked refunds must reach the human escalation queue with the order ID and amount. The team's PreToolUse hook returns a denial whose message says only 'not allowed'. Agents then apologise to the customer and close the conversation, and no ticket ever appears in the queue.", "question": "Where should the escalation be triggered?", "options": {"A": "In a PostToolUse hook that spots denial text in the transcript and files a ticket when that text appears.", "B": "In the denial message, instructing the model to open a ticket with the order ID before it replies to the customer.", "C": "In the hook's deny path: the callback writes the case (order ID, amount, reason) to the escalation queue and then returns the denial.", "D": "In a nightly reconciliation job that scans closed conversations for refund attempts that were never completed."}, "correct": "C", "why_correct_es": "La redirección forma parte de la regla, así que pertenece al mismo callback determinista: el ticket se crea siempre, con los datos exactos que traía la llamada. Delegarla en el modelo reintroduce el fallo probabilístico que el hook venía a eliminar.", "option_rationales_es": {"A": "Buscar texto de denegación es un proxy frágil: cualquier cambio de redacción desactiva la escalada.", "B": "Depende de que el modelo obedezca y de que copie bien los datos; si se salta el paso, el caso se pierde igual que ahora.", "D": "No hay ticket en el momento de la negativa, así que el cliente se queda sin respuesta y el caso aparece con un día de retraso."}, "trap": {"kind": "hub_and_spoke_bypass", "tip_es": "Cuando la regla exige 'bloquear y redirigir', la redirección va en el mismo hook: si la opción pide al modelo que abra el ticket, está saltándose el canal determinista.", "tip_en": "When the rule requires 'block and redirect', the redirection goes in the same hook: if the option asks the model to open the ticket, it is bypassing the deterministic channel."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Skills in", "quote": "Implementing tool call interception hooks that block policy-violating actions (e.g., refunds exceeding\n$500) and redirect to alternative workﬂows (e.g., human escalation)"}], "difficulty": "hard", "origin": "generated", "why_correct_en": "The redirection is part of the rule, so it belongs in the same deterministic callback: the ticket is always created, carrying the exact data the call already had. Delegating it to the model reintroduces the probabilistic failure that the hook existed to remove.", "option_rationales_en": {"A": "Searching for denial text is a fragile proxy: any change of wording disables the escalation.", "B": "It depends on the model obeying and copying the data correctly; if it skips the step, the case is lost exactly as it is today.", "D": "There is no ticket at the moment of the denial, so the customer is left without an answer and the case surfaces a day late."}}, {"id": "D1-1.5-006", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "An inventory MCP tool sometimes answers with an empty body or a proxy HTML error page instead of JSON. The agent reads the empty payload as 'no stock' and tells customers an item is unavailable when the warehouse has it.", "question": "Which change makes the failure explicit to the agent instead of silently plausible?", "options": {"A": "A PreToolUse hook that validates the request parameters so the server can no longer return an error page.", "B": "A prompt rule stating that an empty tool result means the lookup failed and that stock levels must never be inferred from it.", "C": "A PostToolUse hook that detects the empty or unparseable result and replaces it with a structured error payload the model must treat as a failed call.", "D": "A higher HTTP retry count inside the tool wrapper, so an empty body is retried until JSON comes back."}, "correct": "C", "why_correct_es": "Validar y sustituir el resultado en PostToolUse convierte un fallo ambiguo en un error explícito antes de que el modelo lo interprete, y cubre también el caso del HTML de error, que no es JSON válido.", "option_rationales_es": {"A": "Actúa sobre la petición: no evita que el servidor falle ni inspecciona lo que devuelve.", "B": "El modelo puede seguir leyendo el vacío como un dato válido; una regla de prompt no cambia la forma del payload.", "D": "Los reintentos reducen la frecuencia pero no eliminan el caso, y el payload vacío acaba llegando al modelo igual."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "Validar la petición no es validar la respuesta: si el problema es lo que vuelve de la herramienta, la solución vive en PostToolUse.", "tip_en": "Validating the request is not validating the response: if the problem is what comes back from the tool, the solution lives in PostToolUse."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Knowledge of", "quote": "Hook patterns (e.g., PostToolUse) that intercept tool results for transformation before the model\nprocesses them"}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Skills in", "quote": "Implementing PostToolUse hooks to normalize heterogeneous data formats (Unix timestamps, ISO\n8601, numeric status codes) from different MCP tools before the agent processes them"}], "difficulty": "hard", "origin": "generated", "why_correct_en": "Validating and substituting the result in PostToolUse turns an ambiguous failure into an explicit error before the model interprets it, and it also covers the error-HTML case, which is not valid JSON.", "option_rationales_en": {"A": "It acts on the request: it does not prevent the server from failing and does not inspect what the server returns.", "B": "The model can still read the empty body as valid data; a prompt rule does not change the shape of the payload.", "D": "Retries reduce the frequency but do not eliminate the case, and the empty payload still reaches the model."}}, {"id": "D1-1.5-007", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "An auditor asks the bank to prove that no transfer executed without a passing AML check last quarter. Today the rule is a system-prompt paragraph plus a PreToolUse hook that denies when session state holds no passing check. The auditor wants evidence per call, not a policy document.", "question": "Which property of the hook-based design satisfies the audit?", "options": {"A": "The PreToolUse callback runs on every matching call and can emit a structured record of its decision, so each allow or deny is evidenced independently of the model.", "B": "The system-prompt paragraph is versioned in the repository, so the auditor can read the exact wording that was in force.", "C": "The SDK's verbose mode prints the full prompt and the model's messages, which shows the policy was in context for each transfer.", "D": "A random 10% of the quarter's transcripts is reviewed by hand and reconciled against the transfer ledger."}, "correct": "A", "why_correct_es": "El hook es código que se ejecuta en cada llamada coincidente, así que puede registrar la decisión concreta: el registro existe aunque el modelo se equivoque, omita mencionar la comprobación o intente otra ruta.", "option_rationales_es": {"B": "Documenta la intención, no la ejecución: prueba qué política estaba escrita, no que se aplicara en cada transferencia.", "C": "Que la política esté en el contexto no demuestra que se haya aplicado; es exactamente el fallo probabilístico que el auditor sospecha.", "D": "Un muestreo no es una garantía por llamada y deja sin evidencia el 90% restante."}, "trap": {"kind": "determinism_drift", "tip_es": "'Demostrar que se ejecutó en cada llamada' apunta al hook, que es código con registro; documentación, contexto o muestreo no son evidencia de ejecución.", "tip_en": "'Prove that it ran on every call' points to the hook, which is code with a record; documentation, context or sampling are not evidence of execution."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Knowledge of", "quote": "The distinction between using hooks for deterministic guarantees versus relying on prompt\ninstructions for probabilistic compliance"}, {"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "The model's choices are probabilistic. A hook is deterministic: it applies the same rule every time, inside an otherwise probabilistic system."}], "difficulty": "hard", "origin": "generated", "why_correct_en": "The hook is code that runs on every matching call, so it can record the specific decision: the record exists even if the model is wrong, omits mentioning the check, or tries another route.", "option_rationales_en": {"B": "It documents intent, not execution: it proves which policy was written down, not that it was applied on every transfer.", "C": "Having the policy in the context does not prove it was applied; it is exactly the probabilistic failure the auditor suspects.", "D": "A sample is not a per-call guarantee and leaves the remaining 90% without evidence."}}, {"id": "D1-1.5-008", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "A team is sorting four requirements into hooks and prompt guidance, to avoid turning every stylistic preference into code that someone must maintain and that can break a workflow.", "question": "Which requirement should NOT be implemented as a hook?", "options": {"A": "Refunds above $500 must be blocked and routed to a human approver.", "B": "A transfer must be denied whenever session state holds no passing AML check.", "C": "Delivery timestamps returned by three MCP tools must reach the model as ISO 8601 UTC.", "D": "Replies to customers should stay under 120 words and avoid internal jargon."}, "correct": "D", "why_correct_es": "Una preferencia de estilo no necesita cumplimiento garantizado: si falla una vez, el daño es cosmético y corregible. Los hooks son para reglas cuyo incumplimiento es inaceptable; el tono y la longitud se guían mejor con prompt.", "option_rationales_es": {"A": "Incumplirla mueve dinero sin aprobación: es el caso típico de garantía determinista.", "B": "Es una precondición obligatoria antes de una operación financiera, así que debe bloquearse en código.", "C": "La normalización debe ser idéntica en cada llamada y para cada herramienta, algo que un prompt no asegura."}, "trap": {"kind": "prompt_over_program", "tip_es": "Pregunta inversa: si el incumplimiento solo produce una respuesta menos elegante, no merece un hook; si produce dinero movido o datos expuestos, sí.", "tip_en": "Ask it backwards: if violating the rule only produces a less elegant reply, it does not deserve a hook; if it moves money or exposes data, it does."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Knowledge of", "quote": "The distinction between using hooks for deterministic guarantees versus relying on prompt\ninstructions for probabilistic compliance"}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Skills in", "quote": "Hook patterns that intercept outgoing tool calls to enforce compliance rules (e.g., blocking refunds\nabove a threshold)"}], "difficulty": "core", "origin": "generated", "why_correct_en": "A style preference does not need guaranteed enforcement: if it fails once, the damage is cosmetic and correctable. Hooks are for rules whose violation is unacceptable; tone and length are better guided with a prompt.", "option_rationales_en": {"A": "Violating it moves money without approval: this is the textbook case for deterministic enforcement.", "B": "It is a mandatory precondition before a financial operation, so it must be blocked in code.", "C": "Normalization must be identical on every call and for every tool, something a prompt does not ensure."}}, {"id": "D1-1.5-009", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "schedule_delivery expects date as YYYY-MM-DD. The model often passes 'next friday' or 'tomorrow', the tool answers HTTP 500 with an opaque message, and the agent retries the same string two or three times before asking the customer to rephrase.", "question": "Which hook intervention removes the wasted retries most directly?", "options": {"A": "A matcher on the PreToolUse hook that only admits calls whose arguments match a date regex, silently dropping the rest.", "B": "A PostToolUse hook that rewrites the HTTP 500 body into a friendlier message so the model understands that something failed.", "C": "A system-prompt paragraph listing every accepted date format and asking the model to normalise dates before calling tools.", "D": "A PreToolUse hook that validates date against the expected format and denies with a reason naming the expected format and the value received, before the call executes."}, "correct": "D", "why_correct_es": "Validar en PreToolUse corta la llamada inválida y devuelve al modelo un motivo accionable con el formato esperado y el valor recibido, así que corrige en un solo turno en lugar de reintentar a ciegas.", "option_rationales_es": {"A": "Descartar en silencio deja al modelo sin información: no sabe por qué no ocurrió nada ni cómo arreglarlo.", "B": "El error sigue ocurriendo y el reintento se desperdicia igual; solo cambia el texto que el modelo lee después del fallo.", "C": "Ayuda en la mayoría de casos, pero no garantiza el formato ni aporta el valor recibido para corregir."}, "trap": {"kind": "iteration_cap", "tip_es": "Si el síntoma son reintentos repetidos con el mismo argumento inválido, la solución es un rechazo previo con motivo accionable, no un mensaje de error más amable.", "tip_en": "If the symptom is repeated retries with the same invalid argument, the solution is a prior rejection with an actionable reason, not a friendlier error message."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Knowledge of", "quote": "Hook patterns that intercept outgoing tool calls to enforce compliance rules (e.g., blocking refunds\nabove a threshold)"}, {"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "A hook is deterministic: it applies the same rule every time, inside an otherwise probabilistic system. Hooks run between the model and the tools it calls."}], "difficulty": "core", "origin": "generated", "why_correct_en": "Validating in PreToolUse cuts the invalid call and returns an actionable reason to the model, naming the expected format and the value received, so it corrects in a single turn instead of retrying blindly.", "option_rationales_en": {"A": "Dropping silently leaves the model without information: it does not know why nothing happened or how to fix it.", "B": "The error still occurs and the retry is wasted just the same; only the text the model reads after the failure changes.", "C": "It helps in most cases, but it does not guarantee the format and does not provide the value received so the model can correct itself."}}, {"id": "D1-1.5-010", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "Support agents read payment records from a get_payment MCP tool, and responses include full card numbers. The current mitigation is a prompt line telling the agent never to repeat a card number, plus a filter on the final answer that masks 16-digit sequences.", "question": "What closes the exposure inside the agent's own reasoning and its intermediate summaries?", "options": {"A": "A stronger prompt rule that also forbids paraphrasing or partially quoting card numbers in any internal note the agent writes.", "B": "A PostToolUse hook on get_payment that masks the card number in the result before the model processes it.", "C": "Extending the final-answer filter to every message the agent emits, including the arguments of the tools it calls.", "D": "Restricting get_payment to a service account whose request logs are redacted at the API gateway."}, "correct": "B", "why_correct_es": "Enmascarar en PostToolUse impide que el dato entre en el contexto del modelo: a partir de ahí no puede filtrarse en un resumen, en una nota interna ni en los argumentos de otra herramienta.", "option_rationales_es": {"A": "Sigue siendo probabilístico y, sobre todo, llega tarde: el número completo ya está en el contexto y el modelo ya razonó sobre él.", "C": "Filtrar mensajes es una carrera perdida y no cubre lo que el modelo escribe como argumento de otras herramientas.", "D": "Redacta los logs del gateway, no el contexto del agente; el modelo sigue viendo el número completo."}, "trap": {"kind": "prompt_over_program", "tip_es": "Si el dato sensible ya está en el contexto, ninguna instrucción posterior lo protege: la transformación debe ocurrir al entrar, en PostToolUse.", "tip_en": "If the sensitive datum is already in the context, no later instruction protects it: the transformation must happen on entry, in PostToolUse."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Knowledge of", "quote": "Hook patterns (e.g., PostToolUse) that intercept tool results for transformation before the model\nprocesses them"}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5 — Skills in", "quote": "Implementing PostToolUse hooks to normalize heterogeneous data formats (Unix timestamps, ISO\n8601, numeric status codes) from different MCP tools before the agent processes them"}], "difficulty": "hard", "origin": "generated", "why_correct_en": "Masking in PostToolUse keeps the datum from entering the model's context: from that point on it cannot leak into a summary, an internal note or the arguments of another tool.", "option_rationales_en": {"A": "It is still probabilistic and, above all, it arrives too late: the full number is already in the context and the model has already reasoned over it.", "C": "Filtering messages is a losing race and does not cover what the model writes as arguments to other tools.", "D": "It redacts the logs at the gateway, not the agent's context; the model still sees the full number."}}, {"id": "D1-1.5-E05", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "A PreToolUse hook needs to block refunds above $500 only when they target a specific merchant category, based on a field named category inside the refund tool's arguments. The hook is registered with matcher=\"refund_customer\".", "question": "Where should the category check be implemented?", "options": {"A": "In the matcher string, by writing a regex such as refund_customer.*category=restricted so the SDK filters on the argument before invoking the callback", "B": "In the tool's own MCP server definition, since PreToolUse hooks cannot inspect individual tool arguments under any circumstances", "C": "Inside the callback function itself, by reading input_data[\"tool_input\"][\"category\"] and applying the conditional logic there, since matchers only filter by tool name", "D": "In a second, separate matcher field called argument_matcher that the HookMatcher accepts alongside the tool-name matcher"}, "correct": "C", "why_correct_es": "El matcher solo selecciona por nombre o patrón de herramienta; no mira los argumentos. La condición sobre category se programa dentro del callback, que recibe la llamada en input_data[\"tool_input\"] y puede devolver allow o deny según el valor de ese campo.", "why_correct_en": "The matcher only selects by tool name or pattern; it never looks at the arguments. The condition on category is implemented inside the callback, which receives the call in input_data[\"tool_input\"] and can return allow or deny based on that field's value.", "option_rationales_es": {"A": "El matcher es un filtro de nombre de herramienta: no inspecciona argumentos, así que una regex con category=restricted nunca se evalúa contra tool_input y no bloquea nada.", "B": "Los hooks PreToolUse sí reciben los argumentos de la llamada en input_data[\"tool_input\"]. Mover la regla al servidor MCP pierde el punto de control central y obliga a duplicar la lógica en cada herramienta.", "D": "HookMatcher no expone un campo argument_matcher: los campos inexistentes no se evalúan y la comprobación de category simplemente nunca corre."}, "option_rationales_en": {"A": "The matcher is a tool-name filter: it does not inspect arguments, so a regex containing category=restricted is never evaluated against tool_input and blocks nothing.", "B": "PreToolUse hooks do receive the call's arguments in input_data[\"tool_input\"]. Moving the rule into the MCP server loses the central control point and forces you to duplicate the logic in every tool.", "D": "HookMatcher exposes no argument_matcher field: nonexistent fields are never evaluated, so the category check simply never runs."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "Distingue el selector de la lógica: el matcher decide A QUÉ herramienta se aplica el hook; el callback decide QUÉ se hace con la llamada y sus argumentos. Cualquier condición sobre tool_input pertenece al callback.", "tip_en": "Separate the selector from the logic: the matcher decides WHICH tool the hook applies to; the callback decides WHAT happens to the call and its arguments. Any condition on tool_input belongs in the callback."}, "citations": [{"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "The model's choices are probabilistic. A hook is deterministic: it applies the same rule every time, inside an otherwise probabilistic system."}, {"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "Hooks run between the model and the tools it calls. There, they enforce business rules and normalise data (convert it to one consistent format)."}], "difficulty": "core", "origin": "enriched_existing"}, {"id": "D1-1.5-E12", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "An agent connects to two MCP servers named \"billing\" and \"inventory\". An architect wants a single PreToolUse hook to run for every tool exposed by the \"billing\" server, without matching any tool from \"inventory\" or any built-in tool like Bash or Read.", "question": "Which matcher achieves this?", "options": {"A": "billing", "B": "mcp__billing__.*", "C": "^mcp__billing__$", "D": "^mcp__"}, "correct": "B", "why_correct_es": "Las herramientas MCP se exponen como mcp__<servidor>__<herramienta>. El patrón mcp__billing__ seguido de .* cubre todas las tools del servidor billing y ninguna de inventory ni las built-in (Bash, Read), que no llevan ese prefijo.", "why_correct_en": "MCP tools are exposed as mcp__<server>__<tool>. The pattern mcp__billing__ followed by .* covers every tool on the billing server and none from inventory or from the built-in tools (Bash, Read), which do not carry that prefix.", "option_rationales_es": {"A": "\"billing\" no es el nombre de ninguna herramienta: los nombres reales incluyen el prefijo mcp__ y el nombre del tool, así que ese matcher no coincide con nada.", "C": "^mcp__billing__$ ancla el fin de cadena justo después del prefijo: exige que no haya nombre de herramienta, así que no casa con ninguna tool real.", "D": "^mcp__ es demasiado amplio: alcanza también todas las tools de inventory y de cualquier otro servidor, justo lo que se quería excluir."}, "option_rationales_en": {"A": "\"billing\" is not the name of any tool: real names include the mcp__ prefix and the tool name, so that matcher matches nothing.", "C": "^mcp__billing__$ anchors the end of the string right after the prefix: it requires that there be no tool name, so it matches no real tool.", "D": "^mcp__ is too broad: it also reaches every tool from inventory and from any other server, exactly what you wanted to exclude."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "Escribe el nombre real de una tool MCP: mcp__billing__issue_refund. Si la opción no puede casar con esa cadena (porque le falta el sufijo de la tool o porque añade un ancla $), está mal.", "tip_en": "Write out a real MCP tool name: mcp__billing__issue_refund. If the option cannot match that string (because it lacks the tool suffix or because it adds a $ anchor), it is wrong."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 2.4", "quote": "That tools from all conﬁgured MCP servers are discovered at connection time and available\nsimultaneously to the agent"}, {"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "A hook is deterministic: it applies the same rule every time, inside an otherwise probabilistic system."}], "difficulty": "core", "origin": "enriched_existing"}, {"id": "D1-1.5-E13", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "A refund workflow requires that process_refund always be called with the exact customer_id captured by an earlier verified get_customer call, never a value the model retypes from the conversation. A PreToolUse hook already blocks the call when no verified ID exists in session state.", "question": "What should the hook do once a verified ID is present, to prevent the model from substituting a different ID string?", "options": {"A": "Return permissionDecision \"ask\" with a prompt showing the verified ID, so a reviewer compares it with the model's customer_id and approves each refund call", "B": "Return permissionDecision \"deny\" with a reason giving the verified ID, so the model retries process_refund and passes the customer_id from that message", "C": "Return permissionDecision \"allow\" with no updatedInput, so the refund runs with the customer_id the model supplied once session state holds a verified ID", "D": "Return permissionDecision \"allow\" with updatedInput that replaces customer_id with the verified ID from session state, so the refund runs with the stored value"}, "correct": "D", "why_correct_es": "updatedInput permite que el hook reescriba los argumentos de la llamada antes de ejecutarla: se sustituye customer_id por el ID verificado guardado en el estado de sesión. El valor lo fija el código, así que el modelo no puede colar otro string aunque lo intente.", "why_correct_en": "updatedInput lets the hook rewrite the call's arguments before execution: customer_id is replaced by the verified ID stored in session state. The code sets the value, so the model cannot slip in a different string even if it tries.", "option_rationales_es": {"A": "Pedir aprobación humana traslada al revisor una comprobación que el código puede hacer solo: añade latencia y deja abierta la posibilidad de aprobar el ID equivocado.", "B": "Denegar con el ID en el mensaje vuelve a confiar en que el modelo copie bien el valor al reintentar: es exactamente el comportamiento probabilístico que se quería eliminar.", "C": "Allow sin updatedInput ejecuta la llamada con el customer_id que propuso el modelo; que exista un ID verificado en el estado no cambia el argumento de la llamada."}, "option_rationales_en": {"A": "Asking for human approval hands the reviewer a check the code can do on its own: it adds latency and leaves open the possibility of approving the wrong ID.", "B": "Denying with the ID in the message again relies on the model copying the value correctly on retry: that is exactly the probabilistic behaviour you set out to eliminate.", "C": "Allow without updatedInput executes the call with the customer_id the model proposed; having a verified ID in state does not change the call's argument."}, "trap": {"kind": "prompt_over_program", "tip_es": "Si la regla es 'el argumento debe ser exactamente este valor', la única respuesta determinista es la que reescribe el argumento (updatedInput). Cualquier opción que deje el valor en manos del modelo o de un humano es prompt o revisión, no enforcement.", "tip_en": "If the rule is 'the argument must be exactly this value', the only deterministic answer is the one that rewrites the argument (updatedInput). Any option that leaves the value in the model's hands, or a human's, is prompting or review, not enforcement."}, "citations": [{"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "A hook is deterministic: it applies the same rule every time, inside an otherwise probabilistic system."}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.4", "quote": "Implementing programmatic prerequisites that block downstream tool calls until prerequisite steps\nhave completed (e.g., blocking process_refund until get_customer has returned a veriﬁed customer\nID)"}], "difficulty": "core", "origin": "enriched_existing"}, {"id": "D1-1.5-E18", "domain": 1, "subdomain": "1.5", "task_statement": "1.5 — Apply Agent SDK hooks for tool call interception and data normalization", "type": "scenario_mcq", "scenario": "A billing MCP server exposes several tools: issue_refund, void_authorization, and apply_credit, all of which move money and should be gated behind the same identity-verification check. Writing three nearly identical PreToolUse hooks, one per tool name, would work but creates duplication the architect wants to avoid.", "question": "What matcher approach covers all three with one hook registration, without also matching unrelated read-only tools from the same server?", "options": {"A": "Register one PreToolUse hook with the matcher \"mcp__billing__(issue_refund|void_authorization|apply_credit)\", listing the three money-moving tools by name", "B": "Register one PreToolUse hook with the matcher \"mcp__billing__.*\", targeting the billing server's tools through a wildcard on its namespace prefix", "C": "Register one PreToolUse hook with the matcher \"mcp__billing__issue_refund|void_authorization|apply_credit\", listing the three money-moving tools by name", "D": "Register one PreToolUse hook with the matcher \"mcp__billing\", targeting the billing server's tools through the namespace prefix shared by those tools"}, "correct": "A", "why_correct_es": "Los paréntesis agrupan la alternancia y el prefijo mcp__billing__ la ancla al servidor: mcp__billing__(issue_refund|void_authorization|apply_credit) coincide exactamente con esas tres tools y con ninguna otra, incluidas las de solo lectura del mismo servidor.", "why_correct_en": "The parentheses group the alternation and the mcp__billing__ prefix anchors it to the server: mcp__billing__(issue_refund|void_authorization|apply_credit) matches exactly those three tools and nothing else, including the read-only tools on the same server.", "option_rationales_es": {"B": "El comodín sobre todo el prefijo del servidor alcanza también get_balance, list_invoices y demás tools de lectura, así que el gate de identidad se aplicaría a operaciones que no lo necesitan.", "C": "Sin paréntesis la alternancia se aplica a la cadena completa: el patrón deja de estar anclado al namespace billing y puede casar con nombres de otras tools o servidores.", "D": "mcp__billing no es el nombre de ninguna herramienta (falta el sufijo __<tool>): el prefijo desnudo no coincide con las tools reales y el gate nunca se dispara."}, "option_rationales_en": {"B": "The wildcard over the whole server prefix also reaches get_balance, list_invoices and the other read tools, so the identity gate would apply to operations that do not need it.", "C": "Without parentheses the alternation applies to the whole string: the pattern is no longer anchored to the billing namespace and can match tool or server names from elsewhere.", "D": "mcp__billing is not the name of any tool (the __<tool> suffix is missing): the bare prefix matches no real tool and the gate never fires."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "Cuenta los paréntesis y el sufijo. Precisión = prefijo completo del servidor + grupo (a|b|c). Un wildcard .* es demasiado amplio y una alternancia sin paréntesis pierde el anclaje.", "tip_en": "Count the parentheses and the suffix. Precision = full server prefix + group (a|b|c). A .* wildcard is too broad, and an alternation without parentheses loses the anchoring."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.5", "quote": "Hook patterns that intercept outgoing tool calls to enforce compliance rules (e.g., blocking refunds\nabove a threshold)"}, {"source_id": "lesson-1.5", "section": "What You Need to Know", "quote": "Hooks run between the model and the tools it calls. There, they enforce business rules and normalise data (convert it to one consistent format)."}], "difficulty": "hard", "origin": "enriched_existing"}, {"id": "D1-1.6-001", "domain": 1, "subdomain": "1.6", "task_statement": "1.6 — Design task decomposition strategies for complex workflows", "type": "scenario_mcq", "scenario": "A fintech ops team processes ~400 supplier invoices a month. The job has four fixed stages the team already documented: OCR sanity check, extraction of 12 mandated ledger fields, arithmetic consistency check, and ledger upsert. Every invoice follows the same path, and auditors require that a given invoice always produces the same stage sequence. A new architect proposes replacing the chain with a dynamic planner that decides the next stage from what each stage reveals, arguing it will cope better with unusual invoices.", "question": "Which decomposition should the team adopt?", "options": {"A": "One consolidated extraction call that performs all four stages in a single prompt, so no context is lost between stages.", "B": "A dynamic planner that inspects each invoice first and then generates the remaining subtasks from the findings.", "C": "Keep the fixed prompt chain, because the stages and their order are known and identical for every invoice.", "D": "Four independent agents extracting every field in parallel, reconciling disagreements by majority vote."}, "correct": "C", "why_correct_es": "Cuando los pasos están definidos de antemano y la entrada es estructurada, la cadena fija (prompt chaining) da resultados consistentes, es fácil de depurar y de auditar porque sabes qué paso produjo qué salida. La adaptabilidad dinámica no aporta nada aquí y rompe la reproducibilidad que exige el auditor.", "why_correct_en": "When the steps are defined up front and the input is structured, the fixed chain (prompt chaining) produces consistent results and is easy to debug and to audit because you know which step produced which output. Dynamic adaptability buys you nothing here and breaks the reproducibility the auditor requires.", "option_rationales_es": {"A": "Un único prompt con las cuatro etapas elimina la trazabilidad por etapa y concentra todo el trabajo en una sola pasada, justo lo que la cadena fija evita al registrar la salida de cada paso.", "B": "El planificador dinámico hace que la secuencia dependa de lo que se descubra en cada factura: introduce variabilidad en el orden de etapas, que es precisamente lo que el requisito de auditoría prohíbe.", "D": "Cuatro agentes que extraen todos los campos y votan multiplica el coste por cuatro y no elimina el problema de fondo: sigue sin haber un paso de validación aritmética con responsabilidad única ni trazas por etapa."}, "option_rationales_en": {"A": "A single prompt covering all four stages eliminates per-stage traceability and concentrates all the work in one pass, which is exactly what the fixed chain avoids by recording the output of each step.", "B": "The dynamic planner makes the sequence depend on what is discovered in each invoice: it introduces variability in the stage order, which is precisely what the audit requirement forbids.", "D": "Four agents extracting every field and voting multiplies cost by four and does not remove the underlying problem: there is still no arithmetical validation step with single ownership and no per-stage traces."}, "trap": {"kind": "determinism_drift", "tip_es": "Si el enunciado dice 'los pasos ya están documentados' o 'la misma entrada sigue el mismo camino', la respuesta es cadena fija. Lo dinámico suena más avanzado y por eso es el señuelo.", "tip_en": "If the prompt says 'the steps are already documented' or 'the same input follows the same path', the answer is a fixed chain. Dynamic sounds more advanced, and that is exactly why it is the decoy."}, "citations": [{"source_id": "lesson-1.6", "section": "Fixed Sequential Pipelines (Prompt Chaining)", "quote": "A fixed sequential pipeline, also called prompt chaining, runs predetermined steps in order. Dynamic adaptive decomposition generates subtasks from what each step discovers."}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.6", "quote": "Selecting task decomposition patterns appropriate to the workﬂow: prompt chaining for\npredictable multi-aspect reviews, dynamic decomposition for open-ended investigation tasks"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.6-002", "domain": 1, "subdomain": "1.6", "task_statement": "1.6 — Design task decomposition strategies for complex workflows", "type": "scenario_mcq", "scenario": "An engineer is told to 'add comprehensive tests' to a 12-year-old checkout service: roughly 40 modules, no dependency map, and almost no existing coverage. The engineering manager wants a signed-off plan of six numbered steps, in a fixed order, before any work begins, so the sprint can be estimated precisely. Nobody on the team can say which modules depend on which.", "question": "What decomposition approach should the engineer propose?", "options": {"A": "Start by mapping the code's structure, identify the high-impact areas from that map, then keep reprioritising the test plan as dependencies surface.", "B": "Fix the six steps up front (map, list modules, test in alphabetical order, run coverage, fix failures, report) and execute them unchanged.", "C": "Write tests for all 40 modules in a single pass so the agent sees the whole service at once and can order the work itself.", "D": "Keep the six fixed steps but add a long system-prompt section instructing the agent to handle any dependency it encounters."}, "correct": "A", "why_correct_es": "Con un alcance desconocido nadie puede escribir los pasos por adelantado: el patrón correcto es mapear la estructura, identificar las áreas de mayor impacto y dejar que el plan se repriorice a medida que aparecen dependencias. Eso es exactamente la descomposición dinámica adaptativa.", "why_correct_en": "With unknown scope nobody can write the steps in advance: the correct pattern is to map the structure, identify the highest-impact areas and let the plan be reprioritised as dependencies surface. That is exactly dynamic adaptive decomposition.", "option_rationales_es": {"B": "Congelar seis pasos antes de conocer el grafo de dependencias garantiza que el orden sea arbitrario: cuando aparezca que el módulo de descuentos no tiene tests, el plan fijo no puede insertar ese trabajo delante.", "C": "Una sola pasada sobre 40 módulos produce dilución de atención: los primeros módulos reciben análisis detallado y los últimos reciben cobertura superficial, además de que el agente no puede ordenar lo que aún no ha descubierto.", "D": "Un prompt más largo no cambia que la secuencia esté prefijada: la instrucción de 'manejar dependencias' no puede reordenar ni añadir pasos, solo cambia cómo se redacta el informe."}, "option_rationales_en": {"B": "Freezing six steps before you know the dependency graph guarantees an arbitrary order: once it turns out the discount module has no tests, the fixed plan cannot insert that work ahead of the rest.", "C": "A single pass over 40 modules produces attention dilution: the first modules get detailed analysis and the last ones get shallow coverage, and on top of that the agent cannot order work it has not discovered yet.", "D": "A longer prompt does not change the fact that the sequence is prefixed: the instruction to 'handle dependencies' cannot reorder or add steps, it only changes how the report is worded."}, "trap": {"kind": "determinism_drift", "tip_es": "La presión por 'estimar el sprint' empuja a congelar pasos. Si el enunciado insiste en que el alcance es desconocido, ningún plan fijo es defendible: el orden se descubre investigando.", "tip_en": "Pressure to 'estimate the sprint' pushes you to freeze steps. If the prompt insists that the scope is unknown, no fixed plan is defensible: the order is discovered by investigating."}, "citations": [{"source_id": "lesson-1.6", "section": "Dynamic Adaptive Decomposition", "quote": "The checkout tests need this pattern. Nobody knows at the start which parts of the legacy code depend on which, so nobody can write the steps in advance."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.6-003", "domain": 1, "subdomain": "1.6", "task_statement": "1.6 — Design task decomposition strategies for complex workflows", "type": "scenario_mcq", "scenario": "A review agent was failing on 18-file pull requests: solid findings for the first files, near-silence for the last ones. The team split the PR into three batches of six files reviewed in parallel, and each batch prompt now asks the agent to 'also check data flow and API consistency'. Per-file depth is now uniform. In the next release, a helper renamed in batch 1 broke 14 call sites in batch 3, and nothing in the review flagged it.", "question": "Which structural element is still missing from the pipeline?", "options": {"A": "Smaller batches of four files, so each batch agent has more attention left for cross-file checks.", "B": "A final step that concatenates the three batch reports into a single review document.", "C": "A stronger instruction at the start of each batch prompt to treat the pull request as a whole.", "D": "A separate cross-file integration pass over the batch outputs that looks for cross-cutting issues."}, "correct": "D", "why_correct_es": "El batching reduce la dilución dentro de cada lote, pero ningún agente de lote ve los otros lotes, así que las cuestiones transversales (renombrados, flujos de datos, convenciones) quedan invisibles. Hace falta una pasada de integración dedicada sobre las salidas de todos los lotes.", "why_correct_en": "Batching reduces dilution within each batch, but no batch agent sees the other batches, so cross-cutting issues (renames, data flow, conventions) stay invisible. A dedicated integration pass over the outputs of all batches is required.", "option_rationales_es": {"A": "Lotes más pequeños mejoran la profundidad por fichero, pero siguen sin dar a ningún agente visibilidad de los otros lotes: el call site roto en el lote 3 sigue fuera de su contexto.", "B": "Concatenar informes es agregación mecánica, no análisis: no detecta que un símbolo renombrado en un lote dejó de existir para los consumidores de otro lote.", "C": "La instrucción de 'tratar el PR como un todo' no puede funcionar porque el agente del lote 1 nunca recibió los ficheros del lote 3; el límite es de contexto, no de redacción."}, "option_rationales_en": {"A": "Smaller batches improve per-file depth, but they still give no agent visibility into the other batches: the broken call site in batch 3 remains outside its context.", "B": "Concatenating reports is mechanical aggregation, not analysis: it does not detect that a symbol renamed in one batch no longer exists for consumers in another batch.", "C": "The instruction to 'treat the PR as a whole' cannot work because the batch 1 agent never received the batch 3 files; the limit is context, not wording."}, "trap": {"kind": "context_inheritance", "tip_es": "Divide y vencerás a medias: si la solución solo trocea y ningún paso ve todos los trozos juntos, falta la pasada de integración. Batching sin integración es el señuelo clásico.", "tip_en": "Divide and conquer done halfway: if the solution only splits the work and no step ever sees all the pieces together, the integration pass is missing. Batching without integration is the classic decoy."}, "citations": [{"source_id": "lesson-1.6", "section": "Exam Traps", "quote": "Batching reduces attention dilution within each batch but misses cross-batch issues. Without a dedicated cross-file integration pass, data flow issues and pattern inconsistencies across batches go undetected."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.6-004", "domain": 1, "subdomain": "1.6", "task_statement": "1.6 — Design task decomposition strategies for complex workflows", "type": "scenario_mcq", "scenario": "A security review agent sweeps 26 service repositories in one pass. Repos 1-6 get line-level findings; repos 18-26 get one-line summaries. The same unsafe SQL string concatenation is flagged in one repo and approved without comment in another. A staff engineer proposes upgrading to a model with a much larger context window and adding a paragraph that insists on 'equal depth for every repository, no exceptions'.", "question": "Which change is most likely to eliminate the inconsistency?", "options": {"A": "Move to the larger-context model and keep the single pass, so all 26 repos fit comfortably.", "B": "Give each repository its own local analysis pass, then run one cross-repo integration pass over the results.", "C": "Repeat the equal-depth instruction at both the start and the end of the prompt to counter recency effects.", "D": "Lower the temperature and require a structured rubric per repository so scoring becomes uniform."}, "correct": "B", "why_correct_es": "La dilución de atención es estructural: demasiados ítems en una sola pasada. La única corrección real es dar a cada ítem su propia pasada local y añadir después una pasada de integración que compare patrones entre ítems.", "why_correct_en": "Attention dilution is structural: too many items in a single pass. The only real fix is to give each item its own local pass and then add an integration pass that compares patterns across items.", "option_rationales_es": {"A": "Una ventana mayor no cambia el hecho de que los 26 repos siguen compitiendo por la atención en la misma pasada; el modelo solo tendría más sitio para repartir la misma atención.", "C": "Repetir la instrucción mitiga el sesgo de recencia como mucho de forma cosmética: el ítem 26 sigue recibiendo una fracción de la atención del ítem 1.", "D": "Bajar la temperatura hace la salida más estable, pero no corrige la asignación de atención; una rúbrica uniforme produce respuestas uniformemente superficiales en la cola."}, "option_rationales_en": {"A": "A larger window does not change the fact that the 26 repos still compete for attention in the same pass; it only gives the LLM more room in which to spread the same attention.", "C": "Repeating the instruction mitigates recency bias at best cosmetically: item 26 still receives a fraction of the attention that item 1 gets.", "D": "Lowering the temperature makes the output more stable, but it does not fix attention allocation; a uniform rubric produces uniformly shallow answers at the tail."}, "trap": {"kind": "prompt_over_program", "tip_es": "Si la opción habla de modelo más potente, ventana más grande o prompt más insistente, es el señuelo: el arreglo de la dilución es de arquitectura, no de prompt ni de modelo.", "tip_en": "If an option talks about a stronger LLM, a bigger window or a more insistent prompt, it is the decoy: fixing dilution is an architecture change, not a prompt or LLM change."}, "citations": [{"source_id": "lesson-1.6", "section": "Exam Traps", "quote": "Attention dilution comes from too many items in one pass. A better model, a larger context window or a more detailed prompt still leaves every item in one pass."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.6-005", "domain": 1, "subdomain": "1.6", "task_statement": "1.6 — Design task decomposition strategies for complex workflows", "type": "scenario_mcq", "scenario": "A three-stage review chain (per-file analysis, cross-file integration, report) has been running unchanged for a year. In integration, the agent finds that the pull request deletes formatCurrency, which 30 call sites across 12 files still invoke. The chain has no step that inspects call sites. The team lead says the report will mention the deletion and that reviewers can grep for callers themselves.", "question": "What is the most accurate reading of this situation?", "options": {"A": "The per-file step was misconfigured; adding 'check for callers of removed symbols' to the per-file prompt resolves it.", "B": "The chain is fine as designed; surfacing the deletion in the report is the intended division of labour with human reviewers.", "C": "This finding shows the task was not fully predictable, so the pipeline needs an adaptive step that investigates the call sites before the report is written.", "D": "The stages should be reordered so cross-file integration runs first and per-file analysis only covers files it flags."}, "correct": "C", "why_correct_es": "Una cadena fija no puede adaptarse a hallazgos inesperados: el paso 3 solo compila el informe aunque el paso 2 descubra un problema que exige trabajo adicional. Cuando el hallazgo obliga a un paso nuevo, la descomposición correcta incorpora una rama adaptativa guiada por lo descubierto.", "why_correct_en": "A fixed chain cannot adapt to unexpected findings: step 3 only compiles the report even when step 2 uncovers a problem that demands additional work. When a finding forces a new step, the correct decomposition adds an adaptive branch driven by what was discovered.", "option_rationales_es": {"A": "El agente por fichero no tiene el grafo de llamadas del repositorio; pedirle que busque llamadores de símbolos borrados en otros ficheros le pide exactamente la visibilidad que su pasada no tiene.", "B": "Delegar en el revisor humano convierte una comprobación mecánica y barata en trabajo manual no fiable; el agente ya tiene el contexto para investigar y no lo está haciendo.", "D": "Invertir el orden deja la integración sin los análisis locales que necesita como entrada, y no crea ninguna capacidad nueva de investigar los llamadores."}, "option_rationales_en": {"A": "The per-file agent does not hold the repository's call graph; asking it to look for callers of removed symbols in other files asks for exactly the visibility its pass does not have.", "B": "Delegating to the human reviewer turns a mechanical, cheap check into unreliable manual work; the agent already has the context to investigate and is not doing it.", "D": "Reversing the order leaves integration without the local analyses it needs as input, and it creates no new capability to investigate the callers."}, "trap": {"kind": "determinism_drift", "tip_es": "Cuan
