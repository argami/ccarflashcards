do un paso intermedio descubre algo que exige trabajo no previsto, la cadena fija ya no encaja: el examen quiere que reconozcas la señal y añadas adaptatividad, no que defiendas el plan original.", "tip_en": "When an intermediate step discovers something that requires unplanned work, the fixed chain no longer fits: the exam wants you to recognise the signal and add adaptability, not to defend the original plan."}, "citations": [{"source_id": "lesson-1.6", "section": "Fixed Sequential Pipelines (Prompt Chaining)", "quote": "A fixed pipeline cannot adapt to unexpected findings. If Step 2 finds that half the changed files call a function the pull request deletes, Step 3 still only compiles the report."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.6-006", "domain": 1, "subdomain": "1.6", "task_statement": "1.6 — Design task decomposition strategies for complex workflows", "type": "scenario_mcq", "scenario": "A coordinator is writing tests for the same legacy checkout service. Its plan lists eight module-level subtasks. Mapping revealed that the basket module depends on the discount module, which has no tests at all. To cut wall-clock time, the coordinator wants to launch all eight test-writing subagents at the same time, each with the dependency map attached.", "question": "How should the coordinator sequence the work?", "options": {"A": "Launch all eight in parallel and reconcile contradictory test fixtures in a final integration pass.", "B": "Run the discount subtask first, then the basket subtask, and parallelise only modules with no unresolved dependency.", "C": "Run all eight subtasks strictly one after another, since any parallelism risks inconsistent assumptions.", "D": "Launch all eight in parallel but let the subagents message each other to negotiate the shared fixtures."}, "correct": "B", "why_correct_es": "La descomposición dinámica obliga a repriorizar cuando aparece una dependencia: los tests de descuentos deben existir antes de que los de la cesta puedan apoyarse en ellos. El paralelismo solo es seguro entre subtareas sin dependencia pendiente.", "why_correct_en": "Dynamic decomposition forces you to reprioritise when a dependency surfaces: the discount tests must exist before the basket tests can rely on them. Parallelism is only safe between subtasks with no pending dependency.", "option_rationales_es": {"A": "Reconciliar fixtures al final no arregla que los tests de la cesta se escribieron contra un módulo de descuentos sin cubrir: el trabajo dependiente se hizo con supuestos no verificados.", "C": "Serializarlo todo renuncia a la ganancia legítima de paralelismo entre módulos independientes; el orden solo debe imponerse donde hay una dependencia real.", "D": "Los subagentes no comparten estado ni se coordinan entre sí; adjuntar el mapa no les da los tests del módulo del que dependen, solo la descripción del problema."}, "option_rationales_en": {"A": "Reconciling fixtures at the end does not fix the fact that the basket tests were written against an untested discount module: the dependent work was done on unverified assumptions.", "C": "Serialising everything gives up the legitimate parallelism gain between independent modules; order should only be imposed where a real dependency exists.", "D": "Subagents do not share state and do not coordinate with each other; attaching the map does not give them the tests of the module they depend on, only a description of the problem."}, "trap": {"kind": "context_inheritance", "tip_es": "Adjuntar el mapa de dependencias no equivale a tener el trabajo previo hecho. Si dos subtareas tienen una arista de dependencia, van en secuencia; las hojas independientes sí se paralelizan.", "tip_en": "Attaching the dependency map is not the same as having the prior work done. If two subtasks share a dependency edge they run in sequence; independent leaves can be parallelised."}, "citations": [{"source_id": "lesson-1.6", "section": "Dynamic Adaptive Decomposition", "quote": "Start writing tests, and discover that the basket module depends on the discount module, which has no tests."}, {"source_id": "lesson-1.6", "section": "Dynamic Adaptive Decomposition", "quote": "With dynamic decomposition, the plan changes as the agent learns. The agent starts with a high-level goal. It investigates, and it plans from what it finds."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.6-007", "domain": 1, "subdomain": "1.6", "task_statement": "1.6 — Design task decomposition strategies for complex workflows", "type": "scenario_mcq", "scenario": "A security audit of a recently acquired codebase uses dynamic decomposition. The first run took 40 minutes; the next took nearly six hours after it uncovered three nested authentication paths. A programme manager wants the audit converted to a fixed seven-step plan so the team can forecast cost per run, and proposes generating every subtask up front to pin the count down.", "question": "What should the architect recommend?", "options": {"A": "Convert to the fixed seven-step plan, since predictable cost matters more than exhaustiveness for a security audit.", "B": "Keep dynamic decomposition but enumerate all subtasks during the mapping phase so the run length becomes fixed.", "C": "Collapse the audit into one large pass so there is only one unit of work to estimate.", "D": "Keep dynamic decomposition and bound each run with a time and token budget plus checkpoints, accepting that scope drives duration."}, "correct": "D", "why_correct_es": "La varianza es una propiedad del patrón, no un defecto: con alcance desconocido, la duración depende de lo que se descubra. Se gestiona con presupuestos, checkpoints y estimaciones por rango, no congelando pasos que no cubren el alcance real.", "why_correct_en": "Variance is a property of the pattern, not a defect: with unknown scope, duration depends on what gets discovered. You manage it with budgets, checkpoints and range-based estimates, not by freezing steps that do not cover the real scope.", "option_rationales_es": {"A": "Un plan fijo de siete pasos no puede cubrir rutas de autenticación que nadie conocía; se obtiene un coste predecible a cambio de una auditoría incompleta y con falsa sensación de cobertura.", "B": "Enumerar todas las subtareas durante el mapeo exige conocer el alcance al principio, que es justo lo que un audit de código heredado no permite; el recuento se rompe al primer hallazgo.", "C": "Una sola pasada gigante sustituye la varianza por dilución de atención y por un fallo no reproducible: el coste se vuelve estable y la calidad, inservible."}, "option_rationales_en": {"A": "A fixed seven-step plan cannot cover authentication paths nobody knew about; you get a predictable cost in exchange for an incomplete audit and a false sense of coverage.", "B": "Enumerating every subtask during mapping requires knowing the scope at the start, which is exactly what a legacy code audit does not allow; the count breaks at the first finding.", "C": "One giant pass replaces variance with attention dilution and with a non-reproducible failure: cost becomes stable and quality becomes useless."}, "trap": {"kind": "determinism_drift", "tip_es": "Si el enunciado usa la variabilidad de duración como argumento para cambiar de patrón en una tarea abierta, es un señuelo: la impredecibilidad es el precio conocido de la descomposición dinámica.", "tip_en": "If the prompt uses duration variability as an argument for switching patterns on an open-ended task, it is a decoy: unpredictability is the known price of dynamic decomposition."}, "citations": [{"source_id": "lesson-1.6", "section": "Dynamic Adaptive Decomposition", "quote": "It is less predictable. Execution time varies with discoveries, so completion time and resource usage are harder to estimate. Debugging is also harder."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.6-008", "domain": 1, "subdomain": "1.6", "task_statement": "1.6 — Design task decomposition strategies for complex workflows", "type": "scenario_mcq", "scenario": "A compliance team must check a single 25-page vendor data-processing agreement against nine known policy clauses. One document, one known checklist, and a reviewer who will read the result. An engineer proposes five chained agents (clause extraction, risk classification, policy mapping, summary, QA), each passing its output to the next, on the grounds that 'decomposition always improves depth'.", "question": "What is the best assessment of that proposal?", "options": {"A": "Reject it: one document in one pass has no attention dilution to fix, and the chain adds latency and fidelity loss at every handoff.", "B": "Accept it: more passes always mean more depth per clause, whatever the size of the input.", "C": "Accept it, but add a sixth integration agent that reconciles the five outputs before review.", "D": "Accept it, but run the five agents in parallel so the latency cost disappears."}, "correct": "A", "why_correct_es": "La descomposición responde a un problema concreto: demasiados ítems en una pasada, o un alcance que no se conoce. Con un único documento pequeño y una checklist cerrada no hay dilución que corregir, así que cinco saltos solo añaden latencia y pérdida de detalle en cada traspaso.", "why_correct_en": "Decomposition answers a specific problem: too many items in one pass, or a scope that is not known. With a single small document and a closed checklist there is no dilution to correct, so five hops only add latency and detail loss at every handoff.", "option_rationales_es": {"B": "Más pasadas no añaden profundidad si ya había una sola unidad de trabajo; reparten el mismo contenido en más traspasos, y cada traspaso resume y pierde matices.", "C": "Un sexto agente de integración encarece todavía más una cadena que no hacía falta; integra outputs de pasos que nunca debieron separarse.", "D": "Paralelizar los cinco pasos rompe su dependencia real (la clasificación necesita la extracción previa) y no elimina la pérdida de fidelidad entre etapas."}, "option_rationales_en": {"B": "More passes do not add depth when there was already a single unit of work; they spread the same content over more handoffs, and every handoff summarises and loses nuance.", "C": "A sixth integration agent makes an unnecessary chain even more expensive; it integrates outputs of steps that should never have been split.", "D": "Parallelising the five steps breaks their real dependency (classification needs the previous extraction) and does not remove the fidelity loss between stages."}, "trap": {"kind": "iteration_cap", "tip_es": "Más pasadas no es siempre mejor. Si hay un solo ítem y los pasos son conocidos, dividir es coste sin beneficio: la descomposición se justifica por número de ítems o por alcance desconocido.", "tip_en": "More passes is not always better. With a single item and known steps, splitting is cost without benefit: decomposition is justified by the number of items or by unknown scope."}, "citations": [{"source_id": "lesson-1.6", "section": "The Attention Dilution Problem", "quote": "Attention dilution occurs when an agent processes too many items in a single pass. The depth of analysis becomes inconsistent: some items get thorough analysis, and the agent misses obvious issues in other items."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.6-E11", "domain": 1, "subdomain": "1.6", "task_statement": "1.6 — Design task decomposition strategies for complex workflows", "type": "scenario_mcq", "scenario": "A researcher tasks an agent with answering an open-ended question: \"What is causing the 15% increase in checkout abandonment over the last month?\" The relevant data sources, whether logs, analytics dashboards, or recent deploys, are not specified in advance and depend on what early findings suggest.", "question": "How should this task be decomposed?", "options": {"A": "Hand the full question to one subtask with access to logs, analytics and deploy history, and accept the first explanation it reports as the answer", "B": "Start with one exploratory subtask on the abandonment data, review what it returns, then spawn further subtasks aimed at the strongest leads it surfaces", "C": "Draw up a plan with one subtask each for analytics dashboards, server logs and recent deploys, then run them in that sequence and merge the findings", "D": "Split the checkout system into components, give each its own analysis subtask, then run one integration subtask that combines the component findings"}, "correct": "B", "why_correct_es": "Alcance desconocido y siguientes pasos dependientes de lo hallado es el caso canónico de descomposición dinámica adaptativa: una primera subtarea exploratoria sobre los datos de abandono, revisión de lo que devuelve y después subtareas dirigidas a las hipótesis más fuertes que aparezcan.", "why_correct_en": "Unknown scope plus next steps that depend on what is found is the canonical case for dynamic adaptive decomposition: a first exploratory subtask on the abandonment data, a review of what it returns, then subtasks aimed at the strongest hypotheses that surface.", "option_rationales_es": {"A": "Delegar todo a una sola subtarea sin revisión intermedia convierte el problema en una caja negra: se acepta la primera explicación sin contrastarla ni profundizar en las pistas.", "C": "Un pipeline fijo de tres pasos asume que ya sabes dónde está la causa; no puede añadir un paso cuando los hallazgos apuntan a algo que no estaba en el plan.", "D": "Descomponer por componentes del sistema impone una arquitectura previa cuando la pregunta es causal y todavía no se sabe qué componente importa."}, "option_rationales_en": {"A": "Delegating everything to a single subtask with no intermediate review turns the problem into a black box: you accept the first explanation without testing it or following up on the leads.", "C": "A fixed three-step pipeline assumes you already know where the cause is; it cannot add a step when the findings point at something that was not in the plan.", "D": "Decomposing by system component imposes an architecture up front, when the question is causal and you still do not know which component matters."}, "trap": {"kind": "determinism_drift", "tip_es": "Pregúntate si los pasos se pueden escribir ANTES de investigar. Si la respuesta es no (depende de lo que se descubra), es dinámica; si los pasos son conocidos y estables, es pipeline fijo. No elijas lo que suena más sofisticado.", "tip_en": "Ask yourself whether the steps can be written BEFORE investigating. If the answer is no (they depend on what gets discovered), the decomposition is dynamic; if the steps are known and stable, it is a fixed pipeline. Do not pick whatever sounds more sophisticated."}, "citations": [{"source_id": "lesson-1.6", "section": "Exam Traps", "quote": "Open-ended tasks require adaptability. Fixed pipelines cannot respond to unexpected findings. Dynamic adaptive decomposition is the correct pattern when the full scope is unknown at the start."}, {"source_id": "lesson-1.6", "section": "Dynamic Adaptive Decomposition", "quote": "With dynamic decomposition, the plan changes as the agent learns. The agent starts with a high-level goal. It investigates, and it plans from what it finds."}], "difficulty": "hard", "origin": "enriched_existing"}, {"id": "D1-1.7-001", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking (--resume, fork_session, fresh start with summary)", "type": "scenario_mcq", "scenario": "A developer used Claude Code for a full day on a 50-file room-booking service and found three bugs, all inside the three core modules that most of the day's reasoning depended on. Overnight a teammate fixed those three files. The other 47 files are untouched, and the developer wants to continue today without paying to re-read the whole codebase.", "question": "Which session-management approach gives consistent advice with the least wasted work?", "options": {"A": "Resume the day-one session with --resume and tell the agent that the three core files were fixed.", "B": "Start a fresh session, inject a structured summary of the findings that still hold, and name the three changed files for targeted re-analysis.", "C": "Fork the day-one session so the new branch reads the fixed files while the original session keeps the earlier state.", "D": "Start a fresh session and have the agent re-analyse all 50 files so that nothing stale survives into the new context."}, "correct": "B", "why_correct_es": "Cuando la mayor parte del análisis previo se apoyaba en ficheros que ya cambiaron, el historial resumido sigue siendo válido pero sus tool results no. Una sesión nueva con un resumen estructurado conserva el conocimiento sin los datos obsoletos, y al nombrar los tres ficheros modificados el agente re-analiza solo esos y no los 50.", "option_rationales_es": {"A": "Resumir no borra nada: los tool results con las versiones antiguas de los tres ficheros siguen en el historial y el modelo puede seguir citándolos, sobre todo en preguntas tangenciales. Avisar del cambio mejora el resultado pero no elimina la causa.", "C": "fork_session copia el historial existente, así que la rama hereda exactamente los mismos tool results obsoletos; el fork no aporta ninguna lectura nueva de los ficheros. Fork sirve para divergir, no para refrescar contexto.", "D": "Re-analizar 50 ficheros cuando solo cambiaron 3 es re-exploración completa: funciona, pero desperdicia tiempo y tokens que el resumen previo ya cubre."}, "trap": {"kind": "context_inheritance", "tip_es": "Si el enunciado dice que la mayor parte del análisis dependía de ficheros ya modificados, la respuesta es sesión nueva + resumen estructurado; cualquier opción que conserve el historial viejo (resume o fork) arrastra los tool results obsoletos.", "tip_en": "If the scenario says most of the analysis depended on files that have already been modified, the answer is a fresh session plus a structured summary; any option that keeps the old history (resume or fork) drags the stale tool results along."}, "citations": [{"source_id": "lesson-1.7", "section": "The Stale Context Problem", "quote": "The correct fix is to start a fresh session with a structured summary of prior findings. Specify which files have changed, so the agent can run a targeted re-analysis of those files."}], "difficulty": "core", "origin": "generated", "why_correct_en": "When most of the earlier analysis rested on files that have already changed, the summarized findings are still valid but the tool results behind them are not. A fresh session with a structured summary keeps the knowledge without the stale data, and naming the three modified files makes the agent re-analyse only those instead of all 50.", "option_rationales_en": {"A": "Resuming erases nothing: the tool results holding the old versions of the three files stay in the history and the assistant can keep citing them, especially on tangential questions. Announcing the change improves the outcome but does not remove the cause.", "C": "fork_session copies the existing history, so the branch inherits exactly the same stale tool results; the fork contributes no new read of the files. Fork is for diverging, not for refreshing context.", "D": "Re-analysing 50 files when only 3 changed is full re-exploration: it works, but it wastes time and tokens that the prior summary already covers."}}, {"id": "D1-1.7-002", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking (--resume, fork_session, fresh start with summary)", "type": "scenario_mcq", "scenario": "An architect knows about stale context, so after a two-week pause she resumes the session with --resume and adds: \"before answering, re-read the files we modified\". The agent does re-read them, yet it still recommends changes that were already merged and contradicts itself on questions that touch those files only indirectly.", "question": "Why does the re-read instruction fail to eliminate the contradictions?", "options": {"A": "Because --resume restores the earlier plan and todo state as well, so the agent keeps working from a task list that no longer matches the re-read files.", "B": "Because the re-read is only a prompt-level request competing with the system prompt, and rewording it as a mandatory MUST would make the behaviour reliable.", "C": "Because without a fork the original session keeps the old file versions, and the disagreement comes from the two sessions running side by side.", "D": "Because the earlier tool results stay in the conversation history, so the model can still reason from the outdated contents, especially on tangential decisions."}, "correct": "D", "why_correct_es": "Resumir restaura el historial completo, incluidos los tool results antiguos. Un re-read añade datos nuevos pero no elimina los viejos, y el modelo tiende a recurrir a la información antigua precisamente en decisiones tangenciales que no tocan directamente los ficheros releídos. Por eso el arreglo estructural es una sesión nueva con resumen.", "option_rationales_es": {"A": "El plan restaurado puede quedar desfasado, pero el síntoma descrito son recomendaciones y citas de código que ya no existe: eso viene de los tool results obsoletos, no del todo list.", "B": "Reforzar la redacción del prompt no cambia el hecho de que los datos antiguos siguen en el contexto: el problema es de contenido del historial, no de énfasis de la instrucción.", "C": "No hay dos sesiones: solo se ha reanudado una. Y un fork tampoco ayudaría, porque copia el mismo historial con los mismos resultados obsoletos."}, "trap": {"kind": "prompt_over_program", "tip_es": "Ojo con la opción que propone 'pedirlo con más énfasis en el prompt'. Si el historial conserva datos obsoletos, ninguna instrucción los borra; la solución es cambiar la estructura (sesión nueva + resumen), no el tono.", "tip_en": "Watch the option that proposes 'asking for it more emphatically in the prompt'. If the history still holds stale data, no instruction deletes it; the fix is to change the structure (fresh session plus summary), not the tone."}, "citations": [{"source_id": "lesson-1.7", "section": "The Stale Context Problem", "quote": "The obvious fix is to resume and ask the agent to re-read the changed files. This fix is better than nothing, but the stale tool results remain in the conversation history."}], "difficulty": "hard", "origin": "generated", "why_correct_en": "Resuming restores the entire history, including the old tool results. A re-read adds new data but does not delete the old, and the assistant tends to fall back on the old information precisely on tangential decisions that do not touch the re-read files directly. That is why the structural fix is a fresh session with a summary.", "option_rationales_en": {"A": "The restored plan may be out of date, but the symptom described is recommendations and citations of code that no longer exists: that comes from the stale tool results, not from the todo list.", "B": "Emphasising the wording of the prompt does not change the fact that the old data is still in the context: the problem is the content of the history, not the strength of the instruction.", "C": "There are no two sessions: only one has been resumed. And a fork would not help either, because it copies the same history with the same stale results."}}, {"id": "D1-1.7-003", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking (--resume, fork_session, fresh start with summary)", "type": "scenario_mcq", "scenario": "After a week in which the analyzed service was refactored heavily, a tech lead proposes: \"let's just fork the old session, the branch will read the current files while the original stays intact as our record\". The team expects the branch to give advice based on the new code.", "question": "Why will the fork still produce advice based on the pre-refactor code?", "options": {"A": "Because the fork branches from the existing session and therefore inherits its tool results, including the old file contents it read before the refactor.", "B": "Because the fork starts as an empty session, so the agent has no record of the earlier analysis and falls back on generic assumptions about the code.", "C": "Because the fork keeps the reasoning but discards the tool results, which leaves the branch unable to verify any of its conclusions.", "D": "Because fork_session only works on a session that was given a name at creation, and this one was never named."}, "correct": "A", "why_correct_es": "fork_session crea una sesión nueva a partir de una copia del historial: hereda todo lo que había, incluidos los tool results con el código antiguo. La rama es independiente hacia delante, pero su punto de partida sigue siendo el contexto obsoleto, así que fork no es la herramienta para datos caducados.", "option_rationales_es": {"B": "El fork no arranca vacío: copia el historial de la sesión de la que parte. Si arrancara vacío no habría baseline compartido y el fork no tendría sentido.", "C": "El fork conserva el historial tal cual, tool results incluidos; no filtra ni descarta resultados. Justo por eso hereda la obsolescencia.", "D": "Nombrar la sesión solo afecta a cómo la localizas con --resume; no es un requisito para hacer fork de su historial."}, "trap": {"kind": "context_inheritance", "tip_es": "Fork no limpia el contexto: lo copia. Si el problema es 'los datos del historial ya no son ciertos', fork hereda el problema; solo una sesión nueva con resumen lo elimina.", "tip_en": "Fork does not clean the context: it copies it. If the problem is 'the data in the history is no longer accurate', fork inherits the problem; only a fresh session with a summary removes it."}, "citations": [{"source_id": "lesson-1.7", "section": "Exam Traps", "quote": "branches from the existing session, which still contains stale tool results. The fork inherits the stale context. A fresh start with summary injection is the correct approach for stale data."}], "difficulty": "hard", "origin": "generated", "why_correct_en": "fork_session creates a new session from a copy of the history: it inherits everything that was there, including the tool results with the old code. The branch is independent going forward, but its starting point is still the stale context, so fork is not the tool for expired data.", "option_rationales_en": {"B": "The fork does not start empty: it copies the history of the session it branches from. If it started empty there would be no shared baseline and the fork would make no sense.", "C": "The fork keeps the history exactly as it is, tool results included; it neither filters nor discards results. That is precisely why it inherits the staleness.", "D": "Naming the session only affects how you locate it with --resume; it is not a requirement for forking its history."}}, {"id": "D1-1.7-004", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking (--resume, fork_session, fresh start with summary)", "type": "scenario_mcq", "scenario": "A three-day migration agent keeps its approved plan, the list of files already migrated and the sign-off decisions only as turns in one long conversation. On day two a second engineer must take over in a different session, and the resumed run re-proposes steps that were already completed and approved.", "question": "What is the most robust design change?", "options": {"A": "Keep everything in the single session and rely on --resume to restore the plan, the decisions and the per-file progress exactly as they were.", "B": "Enlarge the context window and instruct the agent to hold the plan and the progress in mind across the whole multi-day run.", "C": "Write the plan, decisions and per-file status to a checkpoint file in the workspace that every session reads at start, and use the conversation only for reasoning.", "D": "After each crash, rewind to the last good turn so the plan and the approvals are never lost from the context."}, "correct": "C", "why_correct_es": "Resumir restaura el historial de la conversación, no un registro de estado del trabajo: otro ingeniero en otra sesión no puede leerlo, y un historial largo acaba degradado por volumen. El estado durable (plan, decisiones, progreso por fichero) debe vivir fuera de la conversación, en un fichero que cada sesión lee al arrancar.", "option_rationales_es": {"A": "--resume solo devuelve el contenido de esa conversación a esa sesión; no es un almacén de estado compartido ni sobrevive a la compactación o a un handoff a otra sesión.", "B": "Más contexto no convierte la conversación en un sistema de registro: el estado sigue siendo ilegible para otros procesos y se degrada cuanto más largo es el hilo.", "D": "/rewind retrocede dentro de una sesión, así que solo sirve si el historial aún existe y no resuelve el handoff ni la pérdida de detalle en hilos largos."}, "trap": {"kind": "premature_compaction", "tip_es": "Si el estado tiene que sobrevivir a otro operador, a otra sesión o a días de trabajo, no puede vivir solo en el chat: busca la opción que escribe un checkpoint en el workspace.", "tip_en": "If state must survive another operator, another session or several days of work, it cannot live in the chat alone: look for the option that writes a checkpoint file into the workspace."}, "citations": [{"source_id": "lesson-1.7", "section": "Option 1: --resume <session-name>", "quote": "Resume continues a specific named session from the point where it stopped. It restores the entire conversation history, including every tool result, analysis and line of reasoning."}, {"source_id": "lesson-1.7", "section": "Option 3: Fresh start with summary injection", "quote": "Use a fresh start too when context has degraded over a long session. In that case, too many irrelevant tool results clutter the history."}], "difficulty": "hard", "origin": "generated", "why_correct_en": "Resuming restores the conversation history, not a work-state record: another engineer in another session cannot read it, and a long history ends up degraded by volume. Durable state (plan, decisions, per-file progress) must live outside the conversation, in a file that every session reads at startup.", "option_rationales_en": {"A": "--resume only returns that conversation's content to that session; it is not a shared state store and does not survive compaction or a handoff to another session.", "B": "More context does not turn the conversation into a record system: the state stays unreadable to other processes and degrades the longer the thread gets.", "D": "/rewind steps back inside one session, so it only helps if the history still exists, and it solves neither the handoff nor the loss of detail in long threads."}}, {"id": "D1-1.7-005", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking (--resume, fork_session, fresh start with summary)", "type": "scenario_mcq", "scenario": "An engineer using the Agent SDK wants two independent branches from a completed analysis session called baseline-v3, and writes an options object containing fork_session: true with no resume field. The call returns a brand-new session with an empty history, and the branches have nothing to diverge from.", "question": "What is the correct way to obtain a branch that starts from baseline-v3's history?", "options": {"A": "Keep fork_session: true and put the session name baseline-v3 as the first line of the prompt so the SDK can locate the baseline.", "B": "Set resume to baseline-v3 together with fork_session: true, so the resume selects the session and the fork copies its history into a new session.", "C": "Set fork_session: true on the new session and let the SDK fork from the most recent session in the working directory.", "D": "Call resume twice with the same session id; the second call automatically becomes the branch."}, "correct": "B", "why_correct_es": "En el SDK, fork_session se pone al lado de resume, no en su lugar: resume elige la sesión de origen y fork_session: true arranca una sesión nueva desde una copia de ese historial en vez de seguir escribiendo en la original. En la CLI el emparejamiento es el mismo: --fork-session junto a --resume.", "option_rationales_es": {"A": "El nombre en el prompt es texto para el modelo; no es un parámetro de sesión y no hace que el SDK localice ni copie baseline-v3.", "C": "Sin resume no hay sesión de origen, y el SDK no adivina la 'más reciente': fork_session por sí solo no aporta baseline. Además, elegir por 'la más reciente' es frágil en un directorio con varias sesiones.", "D": "Llamar a resume dos veces con el mismo id continúa la misma sesión las dos veces; no crea ninguna rama, y la segunda ejecución escribe encima del mismo historial."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "fork_session nunca va solo: es un modificador de resume. Si la opción no incluye a la vez resume/--resume y fork, la rama no tiene de dónde partir.", "tip_en": "fork_session never stands alone: it is a modifier of resume. If the option does not include resume/--resume and the fork at the same time, the branch has no point to start from."}, "citations": [{"source_id": "lesson-1.7", "section": "Option 2: fork_session", "quote": "`fork_session` beside `resume`, not instead of it. `resume` picks the session, and `fork_session: true` starts a new session from a copy of that history instead of appending to it."}], "difficulty": "core", "origin": "generated", "why_correct_en": "In the SDK, fork_session sits beside resume, not instead of it: resume selects the source session and fork_session: true starts a new session from a copy of that history instead of continuing to write to the original. In the CLI the pairing is the same: --fork-session next to --resume.", "option_rationales_en": {"A": "The name in the prompt is text for the model; it is not a session parameter and does not make the SDK locate or copy baseline-v3.", "C": "Without resume there is no source session, and the SDK does not guess which one is 'most recent': fork_session alone brings no baseline. On top of that, picking 'the most recent' is fragile in a directory with several sessions.", "D": "Calling resume twice with the same id continues the same session both times; it creates no branch, and the second run writes over the same history."}}, {"id": "D1-1.7-006", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking (--resume, fork_session, fresh start with summary)", "type": "scenario_mcq", "scenario": "A team forks a shared codebase analysis twice: branch A evaluates a contract-testing strategy and branch B evaluates a snapshot-testing strategy. The plan is that B reads A's findings and produces a combined recommendation for the original session, which is then resumed to write the report.", "question": "What must the team add for the combined recommendation to contain A's findings?", "options": {"A": "Nothing: the original session observes both branches, so resuming it collects A's and B's results before writing the report.", "B": "Nothing: both branches were forked from the same baseline, so branch B already inherits whatever branch A later concludes.", "C": "A resume of branch B after branch A finishes, since forked branches synchronise their results on the next resume.", "D": "An explicit hand-off, because neither branch can see the other's results; A's findings must be passed into B's input or written to a shared artifact."}, "correct": "D", "why_correct_es": "Tras el fork cada rama opera de forma independiente: los cambios de una no afectan a la otra y ninguna puede ver los resultados de la otra. El aislamiento es la razón de ser del fork, así que cualquier combinación posterior tiene que hacerse explícitamente, pasando el resumen de A al input de B o a un artefacto compartido.", "option_rationales_es": {"A": "La sesión original tampoco ve las ramas: el fork deja la original intacta y aislada, no como un hub que recolecta resultados.", "B": "El baseline compartido es una foto del momento del fork; lo que A produzca después no viaja a B, porque no hay comunicación entre ramas.", "C": "Resumir B solo continúa el historial de B; no existe sincronización entre ramas en el resume, así que A sigue siendo invisible para B."}, "trap": {"kind": "hub_and_spoke_bypass", "tip_es": "Fork = aislamiento, no paralelismo coordinado. Si el enunciado espera que una rama 'vea' lo de la otra, o que la sesión padre recoja los resultados, falta un paso explícito de hand-off.", "tip_en": "Fork means isolation, not coordinated parallelism. If the scenario expects one branch to 'see' the other's work, or the parent session to collect the results, an explicit hand-off step is missing."}, "citations": [{"source_id": "lesson-1.7", "section": "Option 2: fork_session", "quote": "After the fork, each branch operates independently. Changes in one branch do not affect the other, and neither branch can see the other's results."}], "difficulty": "hard", "origin": "generated", "why_correct_en": "After the fork each branch operates independently: changes in one do not affect the other and neither can see the other's results. Isolation is the whole point of a fork, so any later combination has to be done explicitly, passing the summary of A into B's input or into a shared artifact.", "option_rationales_en": {"A": "The original session does not see the branches either: the fork leaves the original intact and isolated, not as a hub that collects results.", "B": "The shared baseline is a snapshot of the moment of the fork; whatever A produces afterwards does not reach B, because there is no communication between branches.", "C": "Resuming B only continues B's history; there is no synchronisation between branches on resume, so A remains invisible to B."}}, {"id": "D1-1.7-007", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking (--resume, fork_session, fresh start with summary)", "type": "scenario_mcq", "scenario": "A 120-file service was analysed last week. Only two files changed since then, both small and isolated, so the architect decides the prior context is still mostly valid and resumes the named session. She wants the resumed run to verify the two edits without throwing away last week's work.", "question": "What should her resume message specify?", "options": {"A": "Which two files changed and that only those should be re-analysed, treating the rest of the history as still valid.", "B": "That the whole codebase should be re-analysed, since indirect dependencies may have been touched as well.", "C": "That the agent should ignore its earlier tool results and rebuild its understanding from the conversation alone.", "D": "That the session should be forked first so the two changed files land in the branch and the original keeps the old analysis."}, "correct": "A", "why_correct_es": "Cuando el contexto previo sigue siendo válido en su mayor parte, resume es la opción eficiente; lo que falta es informar de los ficheros concretos que cambiaron para que el agente re-analice solo esos y el resto del historial siga sirviendo. Ese es el re-análisis dirigido que el examen premia frente a la re-exploración completa.", "option_rationales_es": {"B": "Re-analizar 120 ficheros porque cambiaron dos es re-exploración completa: cuesta tiempo y tokens, y el análisis previo de los otros 118 sigue siendo válido.", "C": "Pedir que ignore sus tool results anteriores no los elimina del historial y le quita la evidencia que sí seguía siendo correcta; empeora el resultado en lugar de acotarlo.", "D": "Un fork hereda el mismo historial, incluido el análisis antiguo, así que no aporta lecturas nuevas de los ficheros y además duplica el trabajo en dos sesiones."}, "trap": {"kind": "iteration_cap", "tip_es": "Si solo cambiaron unos pocos ficheros de muchos y el resto del análisis sigue vigente, la respuesta correcta nombra esos ficheros y acota el re-análisis; 'revisar todo por seguridad' es la trampa de sobretrabajo.", "tip_en": "If only a few of many files changed and the rest of the analysis still holds, the correct answer names those files and scopes the re-analysis down; 'review everything to be safe' is the overwork trap."}, "citations": [{"source_id": "lesson-1.7", "section": "Targeted Re-Analysis vs Full Re-Exploration", "quote": "Re-reading 50 files because 3 of them changed is wasted time. Targeted re-analysis means telling the agent which files changed and letting it re-analyse only those."}], "difficulty": "core", "origin": "generated", "why_correct_en": "When the prior context is still mostly valid, resume is the efficient option; what is missing is to report the specific files that changed so the agent re-analyses only those and the rest of the history stays useful. That is the targeted re-analysis the exam rewards over full re-exploration.", "option_rationales_en": {"B": "Re-analysing 120 files because two changed is full re-exploration: it costs time and tokens, and the earlier analysis of the other 118 is still valid.", "C": "Asking the agent to ignore its earlier tool results does not delete them from the history and strips away the evidence that was still correct; it makes the outcome worse instead of narrowing it.", "D": "A fork inherits the same history, including the old analysis, so it brings no new reads of the files and also duplicates the work across two sessions."}}, {"id": "D1-1.7-008", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking (--resume, fork_session, fresh start with summary)", "type": "scenario_mcq", "scenario": "A four-hour investigation session hit no file changes at all, but its history now holds hundreds of grep outputs, most of them dead ends. The architect needs a clean, focused continuation with the conclusions intact and wants to avoid repeating the dead ends.", "question": "Which session approach best fits, given that nothing on disk changed?", "options": {"A": "Resume the session with --resume, because with no file changes no tool result in the history can be stale.", "B": "Resume the session and compact it so the noise is dropped while the session identity and history order are preserved.", "C": "Start a fresh session and inject a structured summary of the conclusions, so the clutter stays out of the new context.", "D": "Fork the session so the clutter remains in the original and the new branch starts from a clean history."}, "correct": "C", "why_correct_es": "El criterio no es solo la obsolescencia: un historial degradado por volumen también justifica empezar de cero. La sesión nueva con resumen conserva las conclusiones y deja fuera los cientos de tool results irrelevantes, cosa que un resume no consigue porque arrastra todo el historial.", "option_rationales_es": {"A": "Que nada haya cambiado en disco evita la obsolescencia, pero no el ruido: el resume restaura igualmente los cientos de salidas de grep que ya no aportan nada.", "B": "Compactar alivia el tamaño, pero sigue siendo la misma sesión arrastrando su historial; el enunciado pide un contexto limpio, y la guía trata el historial degradado como caso de sesión nueva con resumen.", "D": "El fork copia el historial completo, ruido incluido; la rama no arranca limpia, solo arranca separada."}, "trap": {"kind": "premature_compaction", "tip_es": "'No cambió ningún fichero' no implica 'resume'. Si el enunciado insiste en historial degradado o lleno de ruido, la respuesta es sesión nueva + resumen; fork y compactar conservan el desorden.", "tip_en": "'No file changed' does not imply 'resume'. If the scenario insists on a degraded or noise-filled history, the answer is a fresh session plus a summary; fork and compaction both keep the clutter."}, "citations": [{"source_id": "lesson-1.7", "section": "When to Use Each Option: Decision Matrix", "quote": "Long session with cluttered history | Fresh start + summary | Degraded context benefits from a clean baseline"}, {"source_id": "lesson-1.7", "section": "Option 3: Fresh start with summary injection", "quote": "The new session has no stale tool results. It has only the curated summary that you provide."}], "difficulty": "core", "origin": "generated", "why_correct_en": "The criterion is not staleness alone: a history degraded by volume also justifies starting over. A fresh session with a summary keeps the conclusions and leaves the hundreds of irrelevant tool results out, which resume cannot achieve because it drags the whole history along.", "option_rationales_en": {"A": "The fact that nothing changed on disk avoids staleness, but not noise: resume still restores the hundreds of grep outputs that no longer contribute anything.", "B": "Compacting reduces the size, but it is still the same session carrying its history; the scenario asks for a clean context, and the guidance treats a degraded history as a case for a fresh session with a summary.", "D": "The fork copies the entire history, noise included; the branch does not start clean, it only starts separate."}}, {"id": "D1-1.7-E04", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking", "type": "scenario_mcq", "scenario": "A team has finished a shared analysis of a monolith's test suite in one session and now wants to compare two independent refactoring strategies (extract-service vs. strangler-fig) starting from that same analyzed baseline, without letting either exploration corrupt the other or the original session.", "question": "What is the most appropriate mechanism?", "options": {"A": "Use /rewind to return to the analysis checkpoint after the first strategy, giving the second run the same context.", "B": "Resume the analysis with --resume --fork-session once per strategy, giving each run its own new session from that point.", "C": "Resume the analysis with --resume once per strategy, giving each run the full analysis context from that point.", "D": "Start a new session per strategy and rerun the test-suite analysis in each, giving each run its own fresh context."}, "correct": "B", "why_correct_es": "Comparar dos enfoques divergentes desde un análisis ya completado es el caso de uso de fork: --resume --fork-session selecciona la sesión base y arranca una sesión nueva desde una copia de su historial. Cada estrategia explora desde el mismo baseline y ninguna ve ni modifica a la otra ni a la sesión original.", "why_correct_en": "Comparing two divergent approaches from an already completed analysis is the fork use case: --resume --fork-session selects the base session and starts a new session from a copy of its history. Each strategy explores from the same baseline, and neither one sees or modifies the other branch or the original session.", "option_rationales_es": {"A": "/rewind retrocede dentro de la MISMA sesión hasta un checkpoint: la segunda estrategia no recibe una copia independiente, sino que trabaja sobre un historial ya consumido por la primera, así que las dos exploraciones se contaminan.", "C": "--resume sin fork continúa y appendea en la misma sesión: la segunda estrategia hereda el rastro de la primera y el baseline original queda alterado. Resume sirve para continuar una línea de trabajo, no para divergir.", "D": "Empezar de cero obliga a repetir el análisis del test suite en cada rama: se pierde justamente el baseline compartido que se quería reutilizar, y los dos análisis pueden divergir entre sí."}, "option_rationales_en": {"A": "/rewind rewinds inside the SAME session back to a checkpoint: the second strategy does not get an independent copy but works on a history already consumed by the first, so the two explorations contaminate each other.", "C": "--resume without fork continues and appends in the same session: the second strategy inherits the first one's trail and the original baseline gets altered. Resume exists to continue one line of work, not to diverge.", "D": "Starting from scratch forces you to repeat the test-suite analysis in every branch: you lose exactly the shared baseline you wanted to reuse, and the two analyses can diverge from each other."}, "trap": {"kind": "context_inheritance", "tip_es": "Si el enunciado dice 'comparar' o 'divergir' desde una base común, la palabra clave es fork; si dice 'continuar donde lo dejé', es --resume. Fork copia el historial y lo deja intacto; resume escribe sobre él.", "tip_en": "If the prompt says 'compare' or 'diverge' from a common base, the keyword is fork; if it says 'continue where I left off', it is --resume. Fork copies the history and leaves it intact; resume writes over it."}, "citations": [{"source_id": "lesson-1.7", "section": "Option 2: fork_session", "quote": "Fork creates an independent branch from a shared analysis baseline. The baseline is the analysis in the session so far, and both branches start from it."}, {"source_id": "lesson-1.7", "section": "Option 2: fork_session", "quote": "After the fork, each branch operates independently. Changes in one branch do not affect the other, and neither branch can see the other's results."}], "difficulty": "hard", "origin": "enriched_existing"}, {"id": "D1-1.7-E36", "domain": 1, "subdomain": "1.7", "task_statement": "1.7 — Manage session state, resumption, and forking", "type": "scenario_mcq", "scenario": "A large multi-agent exploration run is paused partway through, with several agents already having completed and returned results. The architect resumes the run within the same session.", "question": "What happens to the agents that had already completed?", "options": {"A": "Finished agents lose their output at the pause, and the resumed run starts over with a fresh set of agents.", "B": "Finished agents return their stored results without running again, and only the unfinished agents run live.", "C": "Finished agents run again from the start of the workflow, and the run then yields one consistent set of results.", "D": "Finished agents keep their results only if the session is exited and reopened, and the others then continue."}, "correct": "B", "why_correct_es": "--resume restaura el historial completo de la sesión, incluidos los resultados de herramientas y de los subagentes ya terminados. Al reanudar, esos resultados se devuelven desde el historial y solo los agentes incompletos se ejecutan de verdad.", "why_correct_en": "--resume restores the session's full history, including the tool results and the outputs of subagents that already finished. On resume those results are returned from the history, and only the incomplete agents actually run.", "option_rationales_es": {"A": "La pausa no borra el historial: la sesión conserva los resultados ya producidos, y por eso reanudar no reinicia el trabajo hecho.", "C": "Reejecutar a los agentes completados duplicaría coste y latencia y podría producir resultados inconsistentes; no es lo que hace el resume.", "D": "No hace falta salir y reabrir: reanudar la misma sesión ya restaura el estado; reiniciar el proceso no es la condición para conservar resultados."}, "option_rationales_en": {"A": "Pausing does not erase the history: the session keeps the results already produced, which is why resuming does not restart the completed work.", "C": "Re-running the finished agents would duplicate cost and latency and could produce inconsistent results; that is not what resume does.", "D": "You do not need to exit and reopen: resuming the same session already restores the state; restarting the process is not the condition for keeping results."}, "trap": {"kind": "premature_compaction", "tip_es": "Pausar no es perder contexto. Si la opción dice que el trabajo hecho se descarta o se repite, contradice la definición de resume: restaurar el historial completo, herramientas incluidas.", "tip_en": "Pausing is not losing       list.map(c => {
        const r = state.cards[c.id] || {};
        return `<div class="box"><b>${c.id} · ${c.trap.kind} · ${c.difficulty}</b>
          <div style="font-weight:600;margin-bottom:6px">${h(c.question)}</div>
          <div style="color:var(--green)">${c.correct}: ${h(c.options[c.correct])}</div>
          <div style="margin-top:6px">${h(c["why_correct_" + (lang==="en"?"en":"es")] || c.why_correct_es)}</div>
          <div class="cite" style="margin-top:6px">${t("seen")} ${r.seen||0} · ✅${r.ok||0} ❌${r.bad||0}</div></div>`;
      }).join("");
  }).join("");
  document.getElementById("foot").textContent = `${DATA.cards.length} ${t("total")}`;
}

function paintLang(){
  document.querySelectorAll("#langseg button").forEach(b => b.className = b.dataset.lang === lang ? "on" : "");
  const L = T[lang === "en" ? "en" : "es"];
  document.querySelector(".kicker").textContent = L.sub;
  document.getElementById("tab-study").textContent = L.study;
  document.getElementById("tab-stats").textContent = L.stats;
  document.getElementById("tab-browse").textContent = L.browse;
  document.querySelector("footer span").innerHTML = `<kbd>1</kbd>–<kbd>4</kbd> ${t("keys")}`;
}
document.querySelectorAll("#langseg button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; localStorage.setItem(LKEY, lang); paintLang(); render();
});
document.getElementById("tab-study").onclick = () => { view.tab="study"; render(); };
document.getElementById("tab-stats").onclick = () => { view.tab="stats"; render(); };
document.getElementById("tab-browse").onclick = () => { view.tab="browse"; render(); };
document.addEventListener("keydown", e => {
  if(view.tab !== "study") return;
  if(["1","2","3","4"].includes(e.key) && !view.answered){ answer(ROWS[+e.key-1]); }
  else if((e.key === " " || e.key === "Enter") && view.answered){ e.preventDefault(); next(); }
});

paintLang();
buildQueue();
render();
</script>
</body>
</html>
