"D": "Deduplicating afterwards reduces report noise but not the work spent or the coverage gap: both searches kept pointing at the same slice of the web."}, "trap": {"kind": "prompt_over_program", "tip_es": "Deduplicar, fusionar o pedir 'no dupliques' ataca el síntoma: la palanca real es el reparto de alcance. Si la opción no asigna a cada subagente un subtema o tipo de fuente distinto, no resuelve la duplicación.", "tip_en": "Deduplicating, merging or asking it to 'not duplicate' treats the symptom: the real lever is scope partitioning. If the option does not assign each subagent a distinct subtopic or source type, it does not fix the duplication."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Skills in", "quote": "Partitioning research scope across subagents to minimize duplication (e.g., assigning distinct\nsubtopics or source types to each agent)"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.2-007", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "The web-search subagent for a competitive-intelligence run times out against a rate-limited API. Today each subagent catches its own exceptions, retries five times and, on final failure, returns the string 'no results found'. The coordinator concatenates whatever comes back, so the finished report quietly states that no pricing data exists.", "question": "Which error-handling design fits the hub-and-spoke pattern?", "options": {"A": "Raise the subagent's internal retry budget to fifteen attempts with exponential backoff so that transient rate limits almost never reach the coordinator.", "B": "On repeated failure, let the search subagent message the analysis subagent directly to ask whether it already holds the missing pricing data.", "C": "Have the coordinator drop the failed branch and assemble the report from the sources that did succeed, keeping the output clean.", "D": "Have the subagent return a structured failure — what it queried, what the error was, what it did not cover — and let the coordinator decide between a narrower retry, an alternate source and an explicit coverage gap."}, "correct": "D", "why_correct_es": "El coordinador es quien gestiona los errores y el enrutado: el subagente debe informar del fallo con estructura, y el coordinador decide la recuperación (reintento más acotado, fuente alternativa) o registra el hueco como cobertura degradada. Convertir un fallo en 'sin resultados' destruye esa información.", "why_correct_en": "The coordinator is the one that handles errors and routing: the subagent must report the failure in a structured form, and the coordinator decides the recovery (a narrower retry, an alternate source) or records the gap as degraded coverage. Turning a failure into 'no results' destroys that information.", "option_rationales_es": {"A": "Subir reintentos trata el síntoma y sigue sin escalar: cuando la cuota se agota de verdad, el fallo llega igual y el coordinador vuelve a recibir 'no results' sin saber qué faltó.", "B": "Que un subagente se dirija a otro rompe el hub: nadie centraliza la decisión de recuperación y el coordinador pierde la traza del fallo y de lo que se hizo para compensarlo.", "C": "Descartar la rama en silencio produce exactamente el informe que afirma que no hay datos: el hueco debe declararse y decidirse, no esconderse para que la salida parezca limpia."}, "option_rationales_en": {"A": "Raising the retry budget treats the symptom and still does not escalate: when the quota is genuinely exhausted the failure arrives anyway, and the coordinator again receives 'no results' without knowing what was missing.", "B": "Having one subagent address another breaks the hub: nobody centralises the recovery decision, and the coordinator loses the trace of the failure and of what was done to compensate.", "C": "Silently dropping the branch produces exactly the report that claims there is no data: the gap must be declared and decided on, not hidden so that the output looks clean."}, "trap": {"kind": "hub_and_spoke_bypass", "tip_es": "Distingue 'el subagente falla con estructura y el coordinador decide' de 'el subagente se apaña solo'. Cualquier recuperación autónoma dentro del subagente elimina el punto de decisión del hub.", "tip_en": "Distinguish 'the subagent fails in a structured way and the coordinator decides' from 'the subagent sorts itself out'. Any autonomous recovery inside the subagent removes the hub's decision point."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Knowledge of", "quote": "Hub-and-spoke architecture where a coordinator agent manages all inter-subagent communication,\nerror handling, and information routing"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.2-008", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "To keep its own context small, a coordinator compresses each subagent's findings into two sentences before calling the synthesis subagent. The resulting report contains no figures, no document names and no caveats, and the compliance reviewer cannot trace a single claim back to a source.", "question": "What is the best correction?", "options": {"A": "Give the coordinator a larger context window or a stronger model so that it can hold the raw outputs without compressing them.", "B": "Pass structured per-finding records — claim, source, figure, date — to synthesis and compress only narrative prose, not the evidence fields.", "C": "Have the synthesis subagent repeat the searches itself so that nothing can be lost in the handoff.", "D": "Write the raw subagent transcripts to a shared file and let the synthesis subagent read that file instead of receiving findings in its prompt."}, "correct": "B", "why_correct_es": "Agregar es responsabilidad del coordinador, y la agregación debe conservar la evidencia: los campos estructurados (afirmación, fuente, cifra, fecha) son los que permiten atribuir y auditar. Se comprime la prosa, no el sustrato probatorio; ampliar la ventana no arregla un diseño que descarta datos.", "why_correct_en": "Aggregation is the coordinator's responsibility, and it must preserve the evidence: the structured fields (claim, source, figure, date) are what make attribution and audit possible. You compress the prose, not the evidentiary substrate; widening the context window does not repair a design that discards data.", "option_rationales_es": {"A": "Más ventana retrasa el problema y no lo resuelve: el recorte se eligió por diseño, y con más contexto el coordinador seguiría condensando antes de sintetizar.", "C": "Repetir las búsquedas duplica coste y latencia y abre la puerta a cifras distintas de las ya validadas; además la síntesis no tiene por qué saber buscar bien.", "D": "Delegar la lectura de transcripciones vuelve a saltarse el hub y traslada al sintetizador la tarea de destilar ruido, sin garantía de que conserve fuentes ni cifras."}, "option_rationales_en": {"A": "A bigger window delays the problem and does not solve it: the truncation was a design choice, and with more context the coordinator would still condense before synthesising.", "C": "Repeating the searches doubles cost and latency and opens the door to figures different from the ones already validated; on top of that, synthesis has no reason to be good at searching.", "D": "Delegating the reading of transcripts again bypasses the hub and moves onto the synthesiser the job of distilling noise, with no guarantee that sources or figures survive."}, "trap": {"kind": "premature_compaction", "tip_es": "Comprimir para ahorrar contexto es legítimo solo sobre la narrativa. Si el recorte elimina fuentes, cifras o fechas, la respuesta correcta preserva registros estructurados por hallazgo.", "tip_en": "Compressing to save context is legitimate only on narrative prose. If the truncation removes sources, figures or dates, the correct answer preserves structured records per finding."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Knowledge of", "quote": "The role of the coordinator in task decomposition, delegation, result aggregation, and deciding\nwhich subagents to invoke based on query complexity"}, {"source_id": "lesson-1.2", "section": "Hub-and-Spoke Architecture", "quote": "The coordinator receives the initial task and decomposes it. It decides which subagents to invoke and passes context to them."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.2-009", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "A platform engineer replaces the coordinator's judgement with a Python router: a dictionary maps keywords such as 'rate' or 'churn' to a fixed set of subagents, and anything unmatched goes through the full four-stage pipeline. It works on the sample queries, then misroutes most real analyst questions, which arrive phrased as narrative briefs.", "question": "What is the soundest fix?", "options": {"A": "Keep selection inside the coordinator so it analyses each query's requirements, make the routing criteria explicit in its instructions, and log the decision for review.", "B": "Expand the keyword table to a few hundred entries with fuzzy matching and synonym lists so that more phrasings are recognised.", "C": "Send every unmatched query through the full pipeline as a safe default, since completeness matters more than cost.", "D": "Move the choice to a separate classifier endpoint and hardcode the mapping from its label to subagents."}, "correct": "A", "why_correct_es": "Seleccionar subagentes según lo que la consulta requiere es trabajo del coordinador, que puede analizar un brief narrativo y decidir el conjunto mínimo suficiente. Lo correcto es guiar esa decisión con criterios explícitos y registrarla, no sustituirla por una tabla de palabras clave.", "why_correct_en": "Selecting subagents according to what the query requires is the coordinator's job: it can analyse a narrative brief and decide the minimal sufficient set. The right move is to guide that decision with explicit criteria and log it, not replace it with a keyword table.", "option_rationales_es": {"B": "Una tabla más grande sigue midiendo palabras, no necesidades: los briefs narrativos no contienen las etiquetas esperadas y el mantenimiento crece sin resolver el enrutado.", "C": "Mandar lo desconocido al pipeline completo convierte la excepción en norma: cada consulta no reconocida paga los cuatro subagentes, que es precisamente el desperdicio que la selección dinámica evita.", "D": "Un clasificador externo con etiquetas fijas reproduce el mismo límite: decide entre categorías predefinidas y no razona sobre la consulta ni puede justificar por qué faltó un subagente."}, "option_rationales_en": {"B": "A bigger table still measures words, not needs: narrative briefs do not contain the expected labels, and maintenance grows without fixing the routing.", "C": "Sending the unknown to the full pipeline turns the exception into the rule: every unrecognised query pays for all four subagents, which is precisely the waste dynamic selection avoids.", "D": "An external classifier with fixed labels reproduces the same limit: it decides between predefined categories, does not reason about the query, and cannot justify why a subagent was omitted."}, "trap": {"kind": "determinism_drift", "tip_es": "Si la opción traslada una decisión de contenido a código determinista (keywords, regex, tabla de etiquetas), es la trampa: el enrutado por complejidad lo ejerce el coordinador.", "tip_en": "If the option moves a content decision into deterministic code (keywords, regex, a fixed tag mapping), that is the trap: routing by complexity is exercised by the coordinator, not by a lookup."}, "citations": [{"source_id": "lesson-1.2", "section": "Coordinator Responsibilities", "quote": "Dynamic subagent selection.** The coordinator analyses what a query requires and selects only the subagents it needs."}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Skills in", "quote": "Designing coordinator agents that analyze query requirements and dynamically select which\nsubagents to invoke rather than always routing through the full pipeline"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.2-010", "domain": 1, "subdomain": "1.2", "task_statement": "1.2 — Orchestrate multi-agent systems with coordinator-subagent patterns", "type": "scenario_mcq", "scenario": "After two reports shipped with missing angles, a team bolts a strict JSON schema onto the synthesis subagent: required keys for summary, findings and gaps, with findings as an array of objects. 'If it validates, the research is complete,' the tech lead says, and the coverage review is dropped from the release checklist.", "question": "What does that schema gate actually guarantee?", "options": {"A": "That the research is complete, because required keys force the model to address every section before it can emit valid JSON.", "B": "That the research is complete, provided strict mode is enabled so that no extra or missing properties are tolerated.", "C": "Only that the output has the expected shape; coverage still has to be judged by the coordinator against the brief, with gaps re-delegated before delivery.", "D": "That the research is complete as long as the schema requires a source identifier on every finding object."}, "correct": "C", "why_correct_es": "Un schema valida forma, no cobertura: puede pasar con 'findings' vacío o con cuatro hallazgos que ignoren una explicación entera. La cobertura se evalúa comparando la síntesis con el brief y re-delegando los huecos, que es el bucle de refinamiento del coordinador.", "why_correct_en": "A schema validates shape, not coverage: it can pass with an empty 'findings' array or with four findings that ignore a whole explanation. Coverage is assessed by comparing the synthesis with the brief and re-delegating the gaps, which is the coordinator's refinement loop.", "option_rationales_es": {"A": "Las claves obligatorias se satisfacen con contenido mínimo o vacío: un array vacío de hallazgos es JSON perfectamente válido y no dice nada sobre lo que falta investigar.", "B": "strict mode controla propiedades adicionales o ausentes, es decir, la forma exacta del objeto; no aporta ninguna señal sobre la calidad ni el alcance del contenido.", "D": "Exigir una fuente por hallazgo mejora la atribución, pero un hallazgo puede estar bien citado y aun así cubrir solo una parte del brief; el hueco de cobertura sigue invisible al validador."}, "option_rationales_en": {"A": "Required keys are satisfied with minimal or empty content: an empty findings array is perfectly valid JSON and says nothing about what is still unresearched.", "B": "strict mode controls additional or missing properties, meaning the exact shape of the object; it gives no signal at all about content quality or scope.", "D": "Requiring a source per finding improves attribution, but a finding can be well cited and still cover only part of the brief; the coverage gap stays invisible to the validator."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "Separa siempre forma de fondo: el schema garantiza estructura y campos, nunca que el trabajo se haya hecho. Si la pregunta es por cobertura o corrección, la respuesta no es 'añade un campo al schema'.", "tip_en": "Always separate shape from substance: the schema guarantees structure and fields, never that the work was done. If the question is about coverage or correctness, the answer is not 'add a field to the schema'."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Skills in", "quote": "Implementing iterative reﬁnement loops where the coordinator evaluates synthesis output for gaps,\nre-delegates to search and analysis subagents with targeted queries, and re-invokes synthesis until\ncoverage is sufﬁcient"}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Knowledge of", "quote": "Risks of overly narrow task decomposition by the coordinator, leading to incomplete coverage of\nbroad research topics"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.3-001", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "A team registers three AgentDefinitions (log-analyst, metrics-analyst, policy-checker) with careful prompts, and gives the coordinator allowedTools: [\"Read\", \"Grep\", \"Bash\"]. In staging the coordinator never delegates: it greps logs itself, answers from partial data, and reports that it handled the request directly. The subagent names match exactly and the definitions load without error.", "question": "Which change is most likely to make the coordinator start spawning those subagents?", "options": {"A": "Add \"Task\" to the coordinator's allowedTools so it can emit Task calls for the defined subagents.", "B": "Expand each AgentDefinition description with input formats, example queries and boundary cases.", "C": "Move the coordinator's investigation instructions out of its system prompt and into each Task prompt.", "D": "Grant each subagent its own tools and let the coordinator invoke those tools on the subagents' behalf."}, "correct": "A", "why_correct_es": "El subagente se lanza con la herramienta Task, y un coordinador solo puede emitir herramientas que estén en su allowedTools. Sin \"Task\" en esa lista, ninguna instrucción del prompt ni ninguna AgentDefinition puede producir una invocación: el coordinador hace el trabajo con lo que tiene.", "why_correct_en": "A subagent is launched through the Task tool, and a coordinator can only emit tools that appear in its allowedTools. Without \"Task\" in that list, no prompt instruction and no AgentDefinition can produce an invocation: the coordinator does the work with whatever it already has.", "option_rationales_es": {"B": "Las descripciones influyen en a qué subagente derivar una vez que existe la capacidad de delegar; mejorarlas no crea la herramienta que falta, así que el coordinador sigue sin poder lanzar nada.", "C": "Mover texto entre prompts no cambia el conjunto de herramientas habilitadas: el modelo no puede emitir una llamada a Task si esa herramienta no está permitida para el coordinador.", "D": "Equipar a los subagentes no habilita al coordinador a invocarlos; el lanzamiento ocurre por una llamada Task del coordinador, no porque los subagentes tengan más herramientas."}, "option_rationales_en": {"B": "Descriptions shape which subagent a request routes to once the ability to delegate exists; improving them does not create the missing tool, so the coordinator still cannot launch anything.", "C": "Moving text between prompts does not change the set of enabled tools: the agent cannot emit a Task call if that tool is not permitted for the coordinator.", "D": "Equipping the subagents does not enable the coordinator to invoke them; launching happens through a Task call from the coordinator, not because the subagents gained more tools."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "Definir el subagente no es invocarlo: si el escenario dice que el coordinador 'no delega', revisa primero allowedTools. Sin \"Task\" ahí, el resto de la configuración es irrelevante.", "tip_en": "Defining a subagent is not invoking it: if the scenario says the coordinator \"does not delegate\", check allowedTools first. Without \"Task\" there, the rest of the configuration is irrelevant."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.3 — Knowledge of", "quote": "The Task tool as the mechanism for spawning subagents, and the requirement that allowedTools\nmust include \"Task\" for a coordinator to invoke subagents"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.3-002", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "Earlier in the session the coordinator and the user agreed on which contract PDF to review and which three clauses matter. The engineer writes the Task prompt as: \"Review the contract we discussed and flag the risky clauses.\" The contract-reviewer subagent returns a generic checklist of common contract risks and asks which document it should use.", "question": "What is the correct fix for the coordinator's next Task call?", "options": {"A": "Raise the subagent's max_tokens and move it to a stronger model tier so it can recall the earlier discussion.", "B": "Turn on persistent memory in the coordinator so the subagent can read the shared conversation transcript.", "C": "Put the document path, the three target clauses and the review criteria explicitly into the Task prompt.", "D": "Spawn the subagent earlier in the conversation, before the context grows, so it inherits the discussion."}, "correct": "C", "why_correct_es": "Los subagentes no heredan la conversación del coordinador: su contexto es el prompt que reciben. Si el contrato y los criterios no viajan en el texto de la tarea, el subagente no los tiene, por muy obvios que sean para el coordinador.", "why_correct_en": "Subagents do not inherit the coordinator's conversation: their context is the prompt they receive. If the contract and the criteria do not arrive inside the task text, the subagent does not have them, however obvious they are to the coordinator.", "option_rationales_es": {"A": "El tamaño de contexto o el modelo no crean información: el subagente no puede 'recordar' una conversación que nunca recibió, solo repetir el prompt que se le dio.", "B": "No existe una memoria compartida que el subagente pueda leer; cada invocación arranca con su propio contexto construido a partir del prompt de la tarea.", "D": "El momento del lanzamiento no cambia la herencia: el subagente no recibe el historial del coordinador ni al principio ni al final de la conversación."}, "option_rationales_en": {"A": "Context window size or a stronger tier does not create information: the subagent cannot \"remember\" a conversation it never received, only repeat the prompt it was given.", "B": "There is no shared memory the subagent can read; every invocation starts with its own context built from the task prompt.", "D": "The moment of launch does not change inheritance: the subagent receives none of the coordinator's history, neither at the start nor at the end of the conversation."}, "trap": {"kind": "context_inheritance", "tip_es": "Si el subagente 'pregunta algo que ya se dijo', no falla el modelo: falta el dato en el prompt. Todo lo que el subagente necesita debe estar escrito en la tarea.", "tip_en": "If the subagent \"asks about something already stated\", the failure is not in the agent: the fact is missing from the prompt. Everything the subagent needs must be written into the task."}, "citations": [{"source_id": "lesson-1.3", "section": "What You Need to Know", "quote": "Invocation is how the coordinator starts a subagent. Context passing is how the coordinator gives that subagent the information it needs."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.3-003", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "Yesterday a spec-auditor subagent mapped an API module and returned findings with line references. Overnight three of those files were refactored. Today the coordinator must extend the audit to two new endpoints. The engineer plans to resume the auditor's session by name so it \"remembers\" the earlier work and avoids repeating it.", "question": "Which approach gives the most reliable continuation of the audit?", "options": {"A": "Resume the auditor session and add an instruction to re-read any file that changed before continuing.", "B": "Resume the session and paste the overnight git diff so the auditor can reconcile its old line numbers.", "C": "Fork the auditor session and run the extension there, leaving the original baseline untouched.", "D": "Start a new auditor invocation and pass a structured summary of prior findings plus which files changed."}, "correct": "D", "why_correct_es": "Reanudar arrastra resultados de herramientas ya obsoletos: el auditor seguiría razonando sobre lecturas viejas y números de línea que ya no existen. Una sesión nueva con un resumen estructurado de lo hallado y un aviso explícito de qué cambió es más fiable que resumir resultados rancios.", "why_correct_en": "Resuming drags along tool results that are already stale: the auditor would keep reasoning over old reads and line numbers that no longer exist. A new session with a structured summary of what was found and an explicit note of what changed is more reliable than summarizing stale results.", "option_rationales_es": {"A": "Una instrucción de releer no borra el historial de herramientas antiguo: el subagente conserva las lecturas previas en contexto y puede seguir citándolas aunque el archivo ya cambió.", "B": "El diff ayuda a interpretar el cambio, pero la sesión reanudada mantiene las lecturas viejas y su razonamiento anterior; el subagente tiene que reconciliar dos verdades y no siempre lo hace.", "C": "El fork sirve para explorar enfoques divergentes desde una base común, no para corregir una base obsoleta: cada rama hereda igualmente las lecturas desactualizadas."}, "option_rationales_en": {"A": "A re-read instruction does not erase the old tool history: the subagent keeps the previous reads in context and can keep citing them even though the file has changed.", "B": "The diff helps interpret the change, but the resumed session still holds the old reads and its earlier reasoning; the subagent has to reconcile two truths and does not always do so.", "C": "Forking is for exploring divergent approaches from a common base, not for correcting a stale base: every branch equally inherits the outdated reads."}, "trap": {"kind": "context_inheritance", "tip_es": "Resume no equivale a 'contexto fresco y correcto'. Si los archivos cambiaron desde la sesión anterior, la respuesta correcta casi siempre es sesión nueva con resumen estructurado.", "tip_en": "Resume does not equal \"fresh, correct context\". If the files changed since the earlier session, the correct answer is almost always a new session with a structured summary."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.7 — Knowledge of", "quote": "Why starting a new session with a structured summary is more reliable than resuming with stale\ntool results"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.3-004", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "A coordinator investigates three independent questions. It emits one Task call, waits for the result, then emits the next one, so the run takes nine minutes, roughly the sum of the three investigations. The Agent SDK executes tool calls concurrently, and none of the three depends on another's output.", "question": "What change makes the three investigations actually run at the same time?", "options": {"A": "Set max_concurrency to 3 on each AgentDefinition so the runtime schedules the three subagents together.", "B": "Emit the three Task tool calls in a single coordinator response instead of one per turn.", "C": "Have the first subagent spawn the other two from inside its own run so they inherit its execution slot.", "D": "Add an instruction to the coordinator's system prompt telling it to run the investigations in parallel."}, "correct": "B", "why_correct_es": "El paralelismo se consigue emitiendo varias llamadas Task en una misma respuesta del coordinador. Emitirlas en turnos separados implica esperar el resultado de cada una antes de emitir la siguiente, y por eso los tiempos se suman.", "why_correct_en": "Parallelism is achieved by emitting several Task calls in a single coordinator response. Emitting them in separate turns means waiting for each result before emitting the next, which is why the durations add up.", "option_rationales_es": {"A": "La concurrencia no se configura por subagente ni por definición: depende de cómo el coordinador agrupa las llamadas en un turno, no de una propiedad del AgentDefinition.", "C": "Anidar el lanzamiento dentro de un subagente añade una capa de orquestación, pero no paraleliza: el primer subagente sigue lanzando y esperando a los otros dos.", "D": "Una instrucción de 'ejecuta en paralelo' no cambia el patrón de emisión; si el coordinador sigue emitiendo un Task por turno, el runtime no tiene nada que ejecutar en paralelo."}, "option_rationales_en": {"A": "Concurrency is not configured per subagent or per definition: it depends on how the coordinator groups the calls within a turn, not on a property of AgentDefinition.", "C": "Nesting the spawn inside a subagent adds a layer of orchestration but does not parallelize: the first subagent still launches the other two and waits for them.", "D": "An instruction to \"run in parallel\" does not change the emission pattern; if the coordinator still emits one Task per turn, the runtime has nothing to execute concurrently."}, "trap": {"kind": "tool_overload", "tip_es": "Varias llamadas Task en un mismo turno no son una sobrecarga ni un abuso: son el patrón correcto de paralelismo. Si el escenario dice 'una tras otra, esperando', el problema es el agrupamiento por turnos.", "tip_en": "Several Task calls in a single turn are neither overload nor abuse: they are the correct parallelism pattern. If the scenario says \"one after another, waiting\", the problem is grouping by turn."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.3 — Skills in", "quote": "Spawning parallel subagents by emitting multiple Task tool calls in a single coordinator response\nrather than across separate turns"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.3-005", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "The web and document subagents return findings with URLs, document names and page numbers. Before synthesis, the coordinator condenses both outputs into one plain-text brief — \"Solar installations grew 18% in 2025; permitting remains the bottleneck\" — and passes only that brief. The report is accurate but carries no citations, and the client rejects it.", "question": "Where should the fix be applied?", "options": {"A": "Pass structured records (claim plus source URL, document name and page) from the coordinator into the synthesis prompt.", "B": "Instruct the synthesis subagent to cite sources and to infer the most likely origin of each claim.", "C": "Stop condensing entirely and forward the raw, uncondensed subagent outputs to synthesis.", "D": "Add a post-processing step that appends a general source list to the finished report."}, "correct": "A", "why_correct_es": "La atribución sobrevive solo si el vínculo entre cada afirmación y su fuente viaja con la afirmación. Eso exige datos estructurados que separen contenido de metadatos y que el coordinador mantenga ese vínculo al comprimir.", "why_correct_en": "Attribution survives only if the link between each claim and its source travels with the claim. That requires structured data separating content from metadata, and requires the coordinator to preserve that link while compressing.", "option_rationales_es": {"B": "El subagente de síntesis no puede inferir de dónde salió un dato que recibió sin fuente; pedirle que 'deduzca' el origen produce citas inventadas o atribuciones erróneas.", "C": "El problema no es comprimir sino perder el vínculo claim-fuente: volcar todo crudo arriesga el contexto y aun así puede diluir la relación entre afirmación y documento.", "D": "Una lista genérica de fuentes al final no atribuye cada afirmación a su origen; el lector y el auditor siguen sin poder verificar qué fuente sostiene qué dato."}, "option_rationales_en": {"B": "The synthesis subagent cannot infer where a datum came from when it received it without a source; asking it to \"deduce\" the origin produces invented citations or wrong attributions.", "C": "The problem is not compressing but losing the claim-source link: dumping everything raw risks the context and may still dilute the relation between claim and document.", "D": "A generic source list at the end does not attribute each claim to its origin; the reader and the auditor still cannot verify which source supports which datum."}, "trap": {"kind": "premature_compaction", "tip_es": "Cuando el informe 'es correcto pero no cita', el fallo está en la compresión que borra metadatos, no en el redactor. Busca el punto donde el coordinador convierte hallazgos en prosa.", "tip_en": "When the report \"is accurate but cites nothing\", the fault lies in the compression that erases metadata, not in the writer. Look for the point where the coordinator turns findings into prose."}, "citations": [{"source_id": "lesson-1.3", "section": "Context Passing", "quote": "When a coordinator compresses findings for the next agent and removes the link between each claim and its source, the attribution is lost."}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 1.3 — Skills in", "quote": "Using structured data formats to separate content from metadata (source URLs, document names,\npage numbers) when passing context between agents to preserve attribution"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.3-006", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "A coordinator prompt for its market-research subagent lists twelve fixed steps: query the search engine, open the top five results, extract pricing tables, then open each vendor's pricing page. On the first run the top results are PDFs behind a login wall, and the subagent stops at step two reporting that it cannot continue.", "question": "What is the most effective revision of the coordinator's prompt?", "options": {"A": "Add an explicit fallback branch for login-walled PDFs immediately after step two.", "B": "Raise the subagent's iteration limit so it can keep retrying the blocked steps.", "C": "State the research goal and quality criteria, and let the subagent choose how to reach them.", "D": "Give the subagent a browser tool so that the fixed steps become executable as written."}, "correct": "C", "why_correct_es": "Un prompt de coordinador debe fijar el objetivo y los criterios de calidad, no el procedimiento paso a paso. Con el 'qué' claro y el 'cómo' abierto, el subagente puede adaptarse cuando la primera ruta falla, que es justo lo que un guion rígido impide.", "why_correct_en": "A coordinator prompt should fix the goal and the quality criteria, not the step-by-step procedure. With the \"what\" clear and the \"how\" left open, the subagent can adapt when the first route fails, which is exactly what a rigid script prevents.", "option_rationales_es": {"A": "Añadir una rama de fallback parchea ese fallo concreto, pero mantiene el guion rígido: el siguiente obstáculo imprevisto vuelve a detener al subagente.", "B": "Más iteraciones solo permiten repetir el mismo paso bloqueado; el subagente no necesita más intentos, necesita libertad para cambiar de estrategia.", "D": "Dar una herramienta nueva no arregla el guion: si el paso sigue diciendo 'abre los cinco primeros resultados', el subagente seguirá atado al mismo camino."}, "option_rationales_en": {"A": "Adding a fallback branch patches that one failure but keeps the rigid script: the next unforeseen obstacle stops the subagent again.", "B": "More iterations only allow repeating the same blocked step; the subagent does not need more attempts, it needs freedom to change strategy.", "D": "Handing over a new tool does not fix the script: if the step still says \"open the top five results\", the subagent stays bound to the same path."}, "trap": {"kind": "prompt_over_program", "tip_es": "Doce pasos numerados en un prompt de coordinador son la señal: el examen premia objetivos y criterios de calidad, no procedimientos. La adaptabilidad del subagente se pierde con guiones rígidos.", "tip_en": "Twelve numbered steps in a coordinator prompt are the signal: the exam rewards goals and quality criteria, not procedures. Subagent adaptability is lost with rigid scripts."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.3 — Skills in", "quote": "Designing coordinator prompts that specify research goals and quality criteria rather than step-by-\nstep procedural instructions, to enable subagent adaptability"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.3-007", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "A coordinator's system prompt carries a firm-wide rule: never quote a client name in generated text. It spawns a report-writer AgentDefinition whose system prompt says only \"You write research reports.\" Drafts keep quoting client names, and the engineer insists the rule is already covered because it sits in the coordinator's prompt.", "question": "What explains the failure and what is the right fix?", "options": {"A": "The report-writer's temperature is too high for policy adherence; lower it so it follows the coordinator's rule.", "B": "The rule never reaches the subagent; encode it in the report-writer's own system prompt (and tools).", "C": "Move the coordinator's system prompt into a shared CLAUDE.md file that both agents read at startup.", "D": "Mention the rule in each Task call's description field so the runtime injects it into the subagent."}, "correct": "B", "why_correct_es": "El contexto del subagente es el que se le entrega explícitamente: no hereda el prompt del coordinador. Las políticas que deben regir dentro de un subagente pertenecen a su AgentDefinition (system prompt y herramientas), no al agente que lo lanza.", "why_correct_en": "Subagent context is whatever is explicitly handed to it: it does not inherit the coordinator's prompt. Policies that must govern inside a subagent belong in its AgentDefinition (system prompt and tools), not in the agent that launches it.", "option_rationales_es": {"A": "La temperatura afecta la variabilidad de la salida, no el cumplimiento de una regla que el subagente nunca recibió; sin la instrucción, bajarla no cambia nada.", "C": "Un archivo compartido solo ayuda si el subagente lo lee y si su prompt se lo indica; el AgentDefinition sigue siendo el sitio donde la restricción queda declarada de forma explícita.", "D": "El campo description sirve para enrutar, no para inyectar políticas en tiempo de ejecución: el subagente no recibe ese texto como instrucción operativa."}, "option_rationales_en": {"A": "Temperature affects output variability, not adherence to a rule the subagent never received; without the instruction, lowering it changes nothing.", "C": "A shared file helps only if the subagent reads it and its prompt tells it to; the AgentDefinition is still the place where the restriction is declared explicitly.", "D": "The description field is for routing, not for injecting policies at runtime: the subagent does not receive that text as an operating instruction."}, "trap": {"kind": "context_inheritance", "tip_es": "Regla de oro: nada del prompt del coordinador cruza al subagente. Si una política debe aplicarse dentro del subagente, tiene que estar en su propia definición.", "tip_en": "Rule of thumb: nothing from the coordinator's prompt crosses into the subagent. If a policy must apply inside the subagent, it has to live in that subagent's own definition."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.3 — Knowledge of", "quote": "That subagent context must be explicitly provided in the prompt—subagents do not automatically\ninherit parent context or share memory between invocations"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.3-008", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "To keep the agent fleet \"flexible\", an engineer copies the coordinator's allowedTools — which include \"Task\" — into all six AgentDefinitions. On a broad query the run fans out past forty agents, cost spikes, and several subagents re-delegate the same subtask to one another before any result reaches the coordinator.", "question": "What is the correct fix?", "options": {"A": "Lower max_tokens on the subagent definitions so runaway agents terminate sooner.", "B": "Add \"do not spawn other agents\" to each subagent's system prompt and keep the tool lists as they are.", "C": "Reduce the coordinator's max_iterations so the fan-out stops earlier in the run.", "D": "Remove \"Task\" from the subagent tool lists, leaving each subagent only the tools its role needs."}, "correct": "D", "why_correct_es": "Task es la capacidad de crear agentes; si un subagente la tiene, puede delegar y abrir nuevas ramas que el coordinador no controla. Cada subagente debe llevar solo las herramientas de su rol, sin Task, para que la orquestación quede en el coordinador.", "why_correct_en": "Task is the ability to create agents; if a subagent holds it, it can delegate and open new branches the coordinator does not control. Each subagent should carry only the tools its role needs, with no Task, so orchestration stays with the coordinator.", "option_rationales_es": {"A": "El límite de tokens acorta cada respuesta, no impide que un subagente lance a otro; la cascada de lanzamientos sigue ocurriendo aunque cada agente escriba menos.", "B": "Una instrucción en el prompt es probabilística y no retira la herramienta: mientras Task esté permitida, el subagente puede delegar igualmente.", "C": "Recortar iteraciones del coordinador no controla lo que hacen los subagentes por su cuenta, y además degrada la tarea legítima del coordinador."}, "option_rationales_en": {"A": "The token limit shortens each response, it does not stop a subagent from launching another; the cascade of launches still happens even if each agent writes less.", "B": "A prompt instruction is probabilistic and does not remove the tool: while Task is permitted, the subagent can delegate anyway.", "C": "Trimming coordinator iterations does not control what the subagents do on their own, and it also degrades the coordinator's legitimate task."}, "trap": {"kind": "iteration_cap", "tip_es": "Cascadas de agentes y coste desbocado suelen venir de 'Task' copiado a los subagentes. La contención no se logra con topes de iteraciones, sino quitando la capacidad de lanzar subagentes a quien no debe tenerla.", "tip_en": "Agent cascades and runaway cost usually come from \"Task\" copied into the subagents. Containment is not achieved with iteration caps, it comes from removing the ability to spawn subagents from whoever should not hold it."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.3 — Knowledge of", "quote": "The Task tool as the mechanism for spawning subagents, and the requirement that allowedTools\nmust include \"Task\" for a coordinator to invoke subagents"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.3-009", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "A web subagent returns twelve findings with URLs, dates and short quotes. The coordinator passes to synthesis only this line: \"Web research found twelve relevant sources about solar permitting.\" The resulting report repeats one claim three times and contradicts a finding that the document subagent had reported in detail.", "question": "What is the root cause of the weak synthesis?", "options": {"A": "The synthesis subagent's prompt lacks a required length and section structure.", "B": "The web subagent should have written the final report itself rather than returning findings.", "C": "The coordinator passed a label about the findings instead of the complete findings themselves.", "D": "The coordinator queried too few sources, so synthesis had no redundancy to work with."}, "correct": "C", "why_correct_es": "La síntesis solo puede razonar sobre lo que recibe. Al sustituir los hallazgos completos por una etiqueta ('doce fuentes relevantes'), el coordinador deja al sintetizador sin material y sin forma de detectar contradicciones entre fuentes.", "why_correct_en": "Synthesis can only reason over what it receives. By replacing the complete findings with a mere tag (\"twelve relevant sources\"), the coordinator leaves the synthesizer with no material and no way to detect contradictions across sources.", "option_rationales_es": {"A": "Formato y longitud cambian la presentación, no el contenido disponible: con una sola frase de entrada, ninguna estructura de prompt produce un análisis que no existe.", "B": "Mover la redacción al subagente de búsqueda rompe la separación de roles y no resuelve el problema: el sintetizador seguiría sin los hallazgos del analista de documentos.", "D": "El volumen de fuentes no es la causa; incluso con doce fuentes, si solo llega un resumen etiquetado, la síntesis no puede usar ninguna de ellas."}, "option_rationales_en": {"A": "Format and length change the presentation, not the available content: with a single input sentence, no prompt structure produces an analysis that does not exist.", "B": "Moving the writing into the search subagent breaks the role separation and does not fix the problem: the synthesizer would still lack the document analyst's findings.", "D": "The volume of sources is not the cause; even with twelve sources, if only a labeled summary arrives, synthesis cannot use any of them."}, "trap": {"kind": "context_inheritance", "tip_es": "Si el informe final es pobre pese a que los subagentes 'hicieron bien su trabajo', mira qué texto exacto cruzó del coordinador al sintetizador: un resumen etiquetado no es un hallazgo.", "tip_en": "If the final report is weak even though the subagents \"did their job well\", check which exact text crossed from the coordinator to the synthesizer: a labeled summary is not a finding."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.3 — Skills in", "quote": "Including complete ﬁndings from prior agents directly in the subagent's prompt (e.g., passing web\nsearch results and document analysis outputs to the synthesis subagent)"}, {"source_id": "lesson-1.3", "section": "When Attribution Fails", "quote": "The coordinator passes the content of both to the synthesis subagent but removes the metadata: no source URLs, document names or page numbers."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.3-010", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "A doc-analyst returns page-referenced analysis that a synthesis agent needs. To \"decouple\" them, an engineer has doc-analyst write /tmp/handoff.md, gives synthesis Read access to that path, and stops passing the analysis in the Task prompt. Reports now sometimes ignore the analysis and sometimes quote a handoff left over from a previous run.", "question": "Which architecture should replace this arrangement?", "options": {"A": "The coordinator passes doc-analyst's structured output into the synthesis Task prompt; agents never exchange data directly.", "B": "Give the synthesis agent the Task tool so it can invoke doc-analyst itself whenever it needs the analysis.", "C": "Version the handoff file per run (handoff-<run-id>.md) so synthesis reads only the current run's file.", "D": "Add a retry loop that re-runs synthesis whenever the report fails to mention the document analysis."}, "correct": "A", "why_correct_es": "El patrón es hub-and-spoke: toda la comunicación entre subagentes pasa por el coordinador, que así controla qué información fluye y puede observarla y validarla. El traspaso debe ser un dato estructurado en el prompt de la tarea, no un canal lateral opaco.", "why_correct_en": "The pattern is hub-and-spoke: all communication between subagents goes through the coordinator, which thereby controls what information flows and can observe and validate it. The handoff must be structured data in the task prompt, not a hidden side channel.", "option_rationales_es": {"B": "Dar Task a la síntesis crea una vía directa entre subagentes y salta al coordinador: nadie controla qué se pidió, qué se devolvió ni si el resultado es coherente con el resto del run.", "C": "Versionar el archivo evita colisiones entre ejecuciones, pero mantiene el canal lateral: el coordinador sigue sin saber qué se pasó, sin poder validarlo ni observarlo.", "D": "Reintentar la síntesis trata el síntoma; mientras el traspaso siga siendo un archivo compartido sin control del coordinador, el fallo reaparecerá con otra forma."}, "option_rationales_en": {"B": "Giving Task to synthesis creates a direct path between subagents and bypasses the coordinator: nobody controls what was asked, what came back, or whether the result is consistent with the rest of the run.", "C": "Versioning the file avoids collisions between runs but keeps the side channel: the coordinator still does not know what was passed, cannot validate it, cannot observe it.", "D": "Retrying synthesis treats the symptom; while the handoff remains a shared file outside the coordinator's control, the failure will reappear in another form."}, "trap": {"kind": "hub_and_spoke_bypass", "tip_es": "Archivos compartidos, colas o llamadas directas entre subagentes son atajos que rompen hub-and-spoke. Si la solución 'desacopla' a dos subagentes entre sí, probablemente está mal.", "tip_en": "Shared files, queues or direct calls between subagents are shortcuts that break hub-and-spoke. If a solution \"decouples\" two subagents from each other, it is probably wrong."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.2 — Skills in", "quote": "Routing all subagent communication through the coordinator for observability, consistent error\nhandling, and controlled information ﬂow"}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.3-E06", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "An architect is designing the output schema for research subagents that will feed a downstream synthesis agent producing a due-diligence report. The architect wants downstream agents to be able to verify and re-attribute every claim without re-reading the original documents.", "question": "What should each subagent's structured output include for every extracted claim?", "options": {"A": "The claim text, the name of the subagent that extracted it, and the research task the coordinator assigned it", "B": "The claim text, the name or URL of the source document, and the passage from that document that backs the claim", "C": "The claim text, a numeric confidence score from the subagent, and its rating of how reliable the source is", "D": "The claim text, a short summary of the surrounding paragraph, and the general subject area of the source"}, "correct": "B", "why_correct_es": "La atribución verificable exige el mapeo claim-fuente: el texto de la afirmación, el identificador de la fuente (URL o nombre del documento) y el pasaje exacto que la respalda. Sin la fuente no se puede re-atribuir y sin el extracto no se puede re-verificar; el contenido y sus metadatos viajan juntos en el mismo registro estructurado.", "why_correct_en": "Verifiable attribution requires the claim-to-source mapping: the claim text, the source identifier (URL or document name), and the exact passage that backs it. Without the source you cannot re-attribute, and without the excerpt you cannot re-verify; the content and its metadata travel together in the same structured record.", "option_rationales_es": {"A": "El nombre del subagente y la tarea asignada dicen quién extrajo la afirmación, no de dónde salió: no permiten volver al documento ni comprobar el texto original.", "C": "Una puntuación de confianza autoevaluada no es trazabilidad: no se puede auditar y, sin calibrar, ni siquiera indica fiabilidad real de la afirmación.", "D": "Un resumen del párrafo y el área temática son metadatos derivados: siguen sin identificar documento ni pasaje concreto, así que la afirmación no es verificable."}, "option_rationales_en": {"A": "The subagent name and the assigned task say who extracted the claim, not where it came from: they do not let you return to the document or check the original text.", "C": "A self-assessed confidence score is not traceability: it cannot be audited and, unless calibrated, does not even indicate the claim's real reliability.", "D": "A paragraph summary and the subject area are derived metadata: they still identify neither the document nor a specific passage, so the claim is not verifiable."}, "trap": {"kind": "context_inheritance", "tip_es": "Atribuir no es etiquetar. Si la opción no nombra fuente (documento/URL) Y pasaje exacto, no permite re-verificar. 'Quién lo dijo' y 'cuánta confianza tengo' son los distractores clásicos.", "tip_en": "Attributing is not labelling. If the option names neither a source (document/URL) nor the exact passage, it does not allow re-verification. 'Who said it' and 'how confident am I' are the classic distractors."}, "citations": [{"source_id": "lesson-1.3", "section": "Context Passing", "quote": "Content is the claim, the fact or the analysis. Metadata says where the content came from: source URL, document name, page number."}, {"source_id": "lesson-1.3", "section": "Context Passing", "quote": "A downstream agent can attribute a claim to a source only if the coordinator passes that metadata with the claim."}], "difficulty": "hard", "origin": "enriched_existing"}, {"id": "D1-1.3-E32", "domain": 1, "subdomain": "1.3", "task_statement": "1.3 — Configure subagent invocation, context passing, and spawning", "type": "scenario_mcq", "scenario": "A team is building a \"doc-reviewer\" subagent that should be able to read and comment on documentation but must never be able to modify files, even accidentally. The coordinator itself has Read, Edit, Write, Grep, and Glob available.", "question": "How should the doc-reviewer's AgentDefinition be configured to guarantee this constraint?", "options": {"A": "Give doc-reviewer the same tools as the coordinator, then rely on the description field to signal that the subagent is read-only in practice", "B": "Set tools to [\"Read\", \"Grep\"] on the doc-reviewer definition so it inherits only the listed read tools regardless of what the coordinator has available", "C": "Set the coordinator's own allowedTools to just [\"Read\", \"Grep\"] for the duration of the review so neither agent can access Edit or Write", "D": "Leave tools unset on the doc-reviewer definition and instead instruct it in the prompt field never to call Edit or Write during its review"}, "correct": "B", "why_correct_es": "El campo tools del AgentDefinition es la restricción efectiva: el subagente solo puede llamar lo que aparece en su lista, sea cual sea el conjunto del coordinador. Con [\"Read\", \"Grep\"] la escritura no está disponible a nivel de herramienta, no solo desaconsejada en el texto.", "why_correct_en": "The tools field on AgentDefinition is the effective restriction: the subagent can only call what appears in its list, whatever the coordinator's set is. With [\"Read\", \"Grep\"] writing is unavailable at the tool level, not merely discouraged in the text.", "option_rationales_es": {"A": "Heredar todas las tools deja Edit y Write disponibles; el campo description solo guía la selección del coordinador, no limita capacidades, así que el subagente sí puede modificar ficheros.", "C": "Recortar las tools del coordinador degrada al agente principal y no garantiza nada sobre el subagente, que se define aparte; además rompe el resto del trabajo del coordinador.", "D": "Dejar tools sin definir hace que el subagente herede el conjunto del coordinador, incluidas Edit y Write; la instrucción en el prompt es probabilística y no es una garantía."}, "option_rationales_en": {"A": "Inheriting every tool leaves Edit and Write available; the description field only guides the coordinator's selection and does not limit capabilities, so the subagent can in fact modify files.", "C": "Trimming the coordinator's tools degrades the main agent and guarantees nothing about the subagent, which is defined separately; it also breaks the rest of the coordinator's work.", "D": "Leaving tools unset makes the subagent inherit the coordinator's set, including Edit and Write; the instruction in the prompt is probabilistic and is not a guarantee."}, "trap": {"kind": "context_inheritance", "tip_es": "Garantía de capacidades = lista de tools en la definición del subagente. El prompt y el description convencen; la lista de tools impide. Si la opción confía en el texto o en el coordinador, no garantiza nada.", "tip_en": "Capability guarantee = the tools list in the subagent definition. The prompt and the description persuade; the tools list prevents. If the option relies on text or on the coordinator, it guarantees nothing."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.3", "quote": "That subagent context must be explicitly provided in the prompt—subagents do not automatically\ninherit parent context or share memory between invocations"}, {"source_id": "exam-guide-v1.0", "section": "Task Statement 2.3", "quote": "Scoped tool access: giving agents only the tools needed for their role, with limited cross-role tools\nfor speciﬁc high-frequency needs"}], "difficulty": "core", "origin": "enriched_existing"}, {"id": "D1-1.4-001", "domain": 1, "subdomain": "1.4", "task_statement": "1.4 — Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "An online clothing retailer's support agent must verify a customer's identity before every refund. An audit of 4,000 refunds found 3.1% processed without a verified customer. The team added three few-shot examples of the correct sequence and rewrote the system prompt to say the model MUST verify first; the next audit still showed 1.4% unverified refunds. The product lead now wants a design that cannot miss.", "question": "Which change actually removes the residual failure mode?", "options": {"A": "Set temperature to 0 on every turn of a refund conversation and add a negative example showing an unverified refund being rejected, so the model never reproduces that trajectory.", "B": "Require the model to state in its reasoning that identity was verified before calling process_refund, and reject any refund call whose preceding text omits that step.", "C": "Gate process_refund in code so the call is blocked unless session state holds a verified customer ID returned by get_customer, and return a structured reason explaining the missing prerequisite.", "D": "Run a nightly audit that flags any refund without a preceding get_customer call, then replay those conversations through the stricter prompt to recover the missed cases."}, "correct": "C", "why_correct_es": "Un gate en código comprueba el estado real de la sesión antes de dejar ejecutar la herramienta, así que el cumplimiento deja de depender de la probabilidad del modelo. El prompt puede quedarse como guía, pero ya no es el mecanismo que garantiza el orden.", "why_correct_en": "A gate in code checks the real session state before letting the tool execute, so compliance no longer depends on the LLM's probability. The prompt can stay as guidance, but it is no longer the mechanism that guarantees ordering.", "option_rationales_es": {"A": "Bajar la temperatura reduce la variabilidad del muestreo, no la elimina: sigue siendo una instrucción del prompt y el modelo puede saltarse el paso en cualquier ejecución.", "B": "Pedir razonamiento añade otra salida que redacta el propio modelo; si el modelo cree que verificó, el filtro acepta la llamada igual y el fallo persiste.", "D": "La auditoría detecta el fallo cuando el reembolso ya se ejecutó, y reejecutar con un prompt más estricto vuelve a confiar en la probabilidad."}, "option_rationales_en": {"A": "Lowering temperature reduces sampling variability, it does not remove it: this is still a prompt instruction and the assistant can skip the step on any given run.", "B": "Asking for reasoning adds another output written by the assistant itself; if the assistant believes it verified, the filter accepts the call anyway and the failure persists.", "D": "The audit catches the failure only after the refund has already executed, and replaying with a stricter prompt once again relies on probability."}, "trap": {"kind": "prompt_over_program", "tip_es": "Si la opción vive dentro del prompt (few-shot, temperatura, razonamiento, auditoría posterior), reduce o detecta el fallo pero no lo elimina: la respuesta correcta bloquea en código.", "tip_en": "If the option lives inside the prompt (few-shot, temperature, reasoning, a later audit), it reduces or detects the failure but does not remove it: the correct answer blocks in code."}, "citations": [{"source_id": "lesson-1.4", "section": "Prompt Guidance Versus Programmatic Enforcement", "quote": "A stronger system prompt, firmer instructions and few-shot examples (examples that show the correct workflow) all improve accuracy. None of them gives a deterministic guarantee."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.4-002", "domain": 1, "subdomain": "1.4", "task_statement": "1.4 — Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "A prerequisite gate on process_refund reads tool_input[\"identity_verified\"] and allows the call when it is true. In a post-incident review it emerged that a refund ran on an account whose owner had never been verified: the model had set the flag itself because the system prompt told it to set the flag after verifying. Leadership asks why the gate did not stop it.", "question": "What is the defect in this gate?", "options": {"A": "The gate trusts a value the model can assert; it must instead read the verified customer ID recorded from get_customer's own result and compare it with the customer_id in the refund call.", "B": "The flag should be declared in the tool schema as a required boolean defaulting to false, so the model cannot omit it and the server can rely on the field being present.", "C": "The gate needs a second hook on get_customer that marks the session as verified, so that process_refund can check that the marking happened before the refund call.", "D": "The flag should be defined as a policy in the system prompt rather than as a tool argument, so the model only sets it after it has actually completed verification."}, "correct": "A", "why_correct_es": "Un flag que rellena el modelo es una afirmación, no una prueba, y el schema solo garantiza que el campo existe y es booleano. El gate debe leer el resultado real de get_customer y comparar ese ID con el que viaja en el reembolso.", "why_correct_en": "A flag the assistant fills in is an assertion, not evidence, and the schema only guarantees that the field exists and is boolean. The gate must read the real result of get_customer and compare that ID with the one carried on the refund.", "option_rationales_es": {"B": "Marcar el campo como obligatorio en el schema solo impide omitirlo; el modelo puede enviarlo en true sin haber verificado nada.", "C": "Un segundo hook confirma que get_customer se llamó, no que el ID usado en el reembolso sea el que se verificó.", "D": "Mover la regla al system prompt la devuelve al terreno probabilístico: el modelo seguirá decidiendo cuándo pone el flag."}, "option_rationales_en": {"B": "Marking the field as required in the schema only prevents omitting it; the assistant can still send it as true without having verified anything.", "C": "A second hook confirms that get_customer was called, not that the ID used on the refund is the one that was verified.", "D": "Moving the rule into the system prompt puts it back in probabilistic territory: the assistant will still decide when to set the flag."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "Si el gate confía en un valor que escribe el modelo (flag, booleano, status 'verified'), está validando la forma y no el hecho. La prueba tiene que venir del resultado de la herramienta prerrequisito.", "tip_en": "If the gate trusts a value written by the assistant (a flag, a boolean, a 'verified' status), it is validating the shape and not the fact. The evidence has to come from the result of the prerequisite tool."}, "citations": [{"source_id": "lesson-1.4", "section": "Prompt Guidance Versus Programmatic Enforcement", "quote": "A prerequisite gate is a programmatic check that blocks a tool from executing until a prior condition is met."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.4-003", "domain": 1, "subdomain": "1.4", "task_statement": "1.4 — Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "A support agent handling a 1,240 EUR dispute finds a gap: the partial-refund policy says nothing about requests made after 90 days. It escalates by posting 'Escalating to a human agent — customer wants a refund that policy does not cover.' The human queue has no access to the conversation transcript and a six-minute budget per case, and the refund cannot be issued until someone decides.", "question": "What must the escalation hand off to be usable?", "options": {"A": "The full conversation transcript attached to the ticket, so the human can reconstruct everything the agent saw and reach an independent decision.", "B": "A structured record with the verified customer ID, order reference, root cause of the dispute, refund amount, the policy clause that blocks it, and a recommended action.", "C": "The agent's self-reported confidence in its assessment plus a one-line summary of the customer's last message, so the human can triage by urgency.", "D": "The session identifier and a pointer to the agent's reasoning trace, so the human can resume the session and continue where the agent stopped."}, "correct": "B", "why_correct_es": "Quien recibe el caso no tiene el transcript, así que el handoff tiene que llevar los datos en campos explícitos: ID verificado, pedido, causa raíz, importe, cláusula y acción recomendada. Sin eso el humano reinicia la investigación y el cliente repite todo.", "why_correct_en": "The person who receives the case does not have the transcript, so the handoff has to carry the data in explicit fields: verified ID, order, root cause, amount, policy clause and recommended action. Without that the human restarts the investigation and the customer repeats everything.", "option_rationales_es": {"A": "Adjuntar el transcript entero traslada al humano el trabajo de interpretar y no destila causa raíz ni acción recomendada; además suele desbordar el ticket y el límite de tiempo.", "C": "La confianza autodeclarada no es un indicador fiable y el último mensaje no contiene ni el importe ni la política que bloquea el caso.", "D": "Un puntero a la sesión supone que el humano puede abrirla y leerla, y el enunciado dice justo lo contrario: no tiene acceso al transcript."}, "option_rationales_en": {"A": "Attaching the whole transcript hands the human the work of interpreting it and distills neither root cause nor recommended action; it also tends to overflow the ticket and the time limit.", "C": "Self-reported confidence is not a reliable indicator, and the last message contains neither the amount nor the policy that blocks the case.", "D": "A pointer to the session assumes the human can open it and read it, and the scenario says exactly the opposite: the human has no access to the transcript."}, "trap": {"kind": "context_inheritance", "tip_es": "Handoff a humano = campos estructurados (ID, causa, importe, acción). Si la opción pasa el transcript crudo, un resumen vago o un puntero a la sesión, está asumiendo que el humano hereda el contexto.", "tip_en": "Handoff to a human = structured fields (ID, cause, amount, action). If the option passes the raw transcript, a vague summary or a pointer to the session, it is assuming the human inherits the context."}, "citations": [{"source_id": "exam-guide-v1.0", "section": "Task Statement 1.4: Skills", "quote": "Compiling structured handoff summaries (customer ID, root cause, refund amount, recommended\naction) when escalating to human agents who lack access to the conversation transcript"}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.4-004", "domain": 1, "subdomain": "1.4", "task_statement": "1.4 — Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "A coordinator has a PreToolUse gate that blocks process_refund above 500 EUR until verification is recorded, and it fires correctly on every refund it handles. Refunds are in practice executed by a billing-specialist subagent that also has process_refund in its allowed tools. A quarterly audit found eleven large refunds that ran with no verification and no gate event at all.", "question": "Which change closes this gap for every current and future caller, with no second place to keep in sync?", "options": {"A": "Add the verification rule to the billing-specialist's system prompt, since subagents do not see the coordinator's hooks and must be told to check identity themselves.", "B": "Register the same gate a second time on the billing-specialist's AgentDefinition, so both the coordinator and the subagent enforce the prerequisite locally.", "C": "Attach a PostToolUse hook to the billing-specialist that records every refund it executes and raises an alert when the record lacks a verified customer ID.", "D": "Enforce the prerequisite inside process_refund itself, at the tool or server layer, so any caller is blocked until verification is present in state."}, "correct": "D", "why_correct_es": "La comprobación tiene que estar donde ocurre el efecto: un gate que vive solo en el coordinador lo esquiva cualquier otro invocador, y aquí el invocador real era el subagente. Ponerlo en la implementación de la herramienta cubre a todos los llamadores presentes y futuros.", "why_correct_en": "The check has to sit where the effect happens: a gate that lives only in the coordinator is bypassed by any other caller, and here the real caller was the subagent. Putting it in the tool implementation covers every present and future caller.", "option_rationales_es": {"A": "Una instrucción en el prompt del subagente vuelve a ser probabilística, y ese es justo el camino por el que ya se colaron los reembolsos.", "B": "Duplicar el registro funciona hasta que alguien añade un subagente nuevo o edita una de las dos copias: la garantía depende de mantener dos configuraciones sincronizadas.", "C": "Un hook PostToolUse se ejecuta después: registra o alerta sobre un reembolso que ya salió, pero no lo impide."}, "option_rationales_en": {"A": "An instruction in the subagent's prompt is probabilistic again, and that is precisely the path the refunds already slipped through.", "B": "Duplicating the registration works until someone adds a new subagent or edits one of the two copies: the guarantee depends on keeping two configurations in sync.", "C": "A PostToolUse hook runs afterwards: it records or alerts on a refund that has already gone out, but it does not prevent it."}, "trap": {"kind": "hub_and_spoke_bypass", "tip_es": "Pregunta dónde puede invocarse la herramienta. Si la respuesta es 'solo en este agente', el gate de ese agente es evitable: hay que moverlo al punto donde el efecto ocurre.", "tip_en": "Ask where the tool can be invoked. If the answer is 'only in this agent', that agent's gate is avoidable: it has to move to the point where the effect happens."}, "citations": [{"source_id": "lesson-1.4", "section": "Prompt Guidance Versus Programmatic Enforcement", "quote": "Programmatic enforcement sets it in code: hooks, prerequisite gates or code-level checks that block downstream tools (the tools that run later) until their prerequisites complete."}], "difficulty": "hard", "origin": "generated"}, {"id": "D1-1.4-005", "domain": 1, "subdomain": "1.4", "task_statement": "1.4 — Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "After a costly payout error, a claims team put programmatic gates on every step of its workflow: summarising the claim, choosing a reply tone, formatting the response and issuing the payout. p95 latency rose 40%, and three cases stalled for hours because a formatting gate rejected a reply that was merely unpolished. The architect is asked to redesign the gating policy.", "question": "Which gating policy is correct?", "options": {"A": "Gate only steps whose failure is irreversible or financially consequential, such as identity checks and payouts, and leave reversible presentation choices ungated.", "B": "Keep gates on every step but make them asynchronous, so they log violations for later review instead of blocking the workflow at any point.", "C": "Replace the per-step gates with a single gate at the end of the workflow that validates the whole case before the claim is submitted.", "D": "Keep gates on every step but add an override that lets the model proceed after two blocked attempts, so cases cannot stall indefinitely."}, "correct": "A", "why_correct_es": "El coste del gate se compara con el coste del error: el pago es irreversible y justifica el bloqueo, mientras que el formato es reversible y barato de corregir. Gatear todo añade latencia y puntos de fallo sin proteger nada.", "why_correct_en": "The cost of the gate is weighed against the cost of the error: the payment is irreversible and justifies blocking, whereas formatting is reversible and cheap to fix. Gating everything adds latency and failure points without protecting anything.", "option_rationales_es": {"B": "Un gate asíncrono que solo registra incumplimientos deja de bloquear; para los pasos irreversibles eso elimina justo la garantía que se buscaba.", "C": "Validar solo al final llega tarde: el pago ya se ejecutó y el caso no se puede deshacer, solo rechazar.", "D": "Permitir continuar tras dos bloqueos es un fail-open: convierte la política en una sugerencia después de un número fijo de intentos."}, "option_rationales_en": {"B": "An asynchronous gate that only records violations stops blocking; for irreversible steps that removes exactly the guarantee that was wanted.", "C": "Validating only at the end comes too late: the payment has already executed and the case cannot be undone, only rejected.", "D": "Letting the workflow continue after two blocks is a fail-open: it turns the policy into a suggestion after a fixed number of attempts."}, "trap": {"kind": "tool_overload", "tip_es": "Gatea lo irreversible y caro (dinero, identidad, envíos); lo cosmético y reversible no necesita bloqueo. Si la opción gatea todo o valida solo al final, elige mal el punto de control.", "tip_en": "Gate what is irreversible and expensive (money, identity, shipments); cosmetic and reversible choices need no block. If the option gates everything or validates only at the end, it picks the wrong control point."}, "citations": [{"source_id": "lesson-1.4", "section": "Prompt Guidance Versus Programmatic Enforcement", "quote": "The agent also chooses the layout of its replies. A mistake in the layout costs nothing."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.4-006", "domain": 1, "subdomain": "1.4", "task_statement": "1.4 — Implement multi-step workflows with enforcement and handoff patterns", "type": "scenario_mcq", "scenario": "A three-stage pipeline extracts claims (subagent emits JSON with claim, source_url and page), verifies them, then publishes. Stage 1's prompt says to return valid JSON matching the schema. About 2% of runs crash stage 3 on a missing page field or a page sent as a string. The team's proposed fix is to add 'be careful to always include page as an integer' to stage 1's prompt.", "question": "What should change instead?", "options": {"A": "Have stage 3 coerce types and fill missing fields with defaults so an imperfect payload never crashes the pipeline downstream.", "B": "Ask stage 1 to self-review its own JSON against the schema and return it only after the checklist passes, which removes malformed payloads at the source.", "C": "Catch the stage-3 exception and re-run stage 1 with the error appended to its prompt, letting the model repair its own output when something is wrong.", "D": "Parse and validate stage 1's output against the schema at the boundary, and on failure re-invoke stage 1 with the specific validation errors before stage 2 consumes it."}, "correct": "D", "why_correct_es": "El contrato entre etapas solo existe si alguien lo valida en código al cruzar la frontera. Validar en la frontera y, si falla, re-invocar la etapa con los errores concretos impide que un payload roto llegue a la etapa siguiente.", "why_correct_en": "The contract between stages only exists if someone validates it in code at the boundary. Validating at the boundary and, on failure, re-invoking the stage with the specific errors prevents a broken payload from reaching the next stage.", "option_rationales_es": {"A": "Rellenar huecos y convertir tipos transforma un fallo de contrato en datos inventados: la etapa 3 publica atribuciones falsas sin avisar a nadie.", "B": "Una checklist en el prompt es otra instrucción probabilística; el modelo puede creer que cumplió y seguir emitiendo el campo mal.", "C": "Reejecutar la etapa sin comprobar el contrato repite el error a ciegas y puede entrar en un bucle de reintentos que nunca converge."}, "option_rationales_en": {"A": "Filling gaps and coercing types turns a contract failure into invented data: stage 3 publishes false attributions without warning anyone.", "B": "A checklist in the prompt is another probabilistic instruction; the assistant can believe it complied and keep emitting the field wrong.", "C": "Re-running the stage without checking the contract repeats the error blindly and can enter a retry loop that never converges."}, "trap": {"kind": "schema_vs_invocation", "tip_es": "Entre etapas, 'el prompt pide JSON válido' no es validación: es una instrucción. Busca parse y schema check en el código de la frontera, con re-invocación dirigida por los errores.", "tip_en": "Between stages, 'the prompt asks for valid JSON' is not validation: it is an instruction. Look for a parse and schema check in the boundary code, with re-invocation driven by the errors."}, "citations": [{"source_id": "lesson-1.4", "section": "Prompt Guidance Versus Programmatic Enforcement", "quote": "A prompt instruction works most of the time, perhaps in 90-95% of cases. It still has a non-zero failure rate, because the model is probabilistic."}], "difficulty": "core", "origin": "generated"}, {"id": "D1-1.4-007", "domain": 1, "subdomain": "1.4", "task_statement": "1.4
